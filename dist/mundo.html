<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Génesis</title>
<meta name="description" content="Un mundo de pueblos que viven la historia humana real, de la Edad de Piedra a la era atómica. Tú eres su dios y lo cambias escribiendo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Génesis · la vista de un dios: el mundo de píxeles en el centro, la noche alrededor, el oro para lo divino.
   Una sola apariencia, oscura a propósito (el mapa necesita un fondo de noche para que brillen los pueblos). */
:root {
  color-scheme: dark;
  --noche: #0d1322;
  --panel: #141c31;
  --linea: #26324f;
  --pergamino: #ece4d0;
  --tenue: #9aa3b8;
  --oro: #f0c05a;
  --oro-hondo: #3a2f17;
  --sangre: #ff6a5a;
  --f-pixel: 'Pixelify Sans', 'Courier New', monospace;
  --f-libro: 'Literata', Georgia, 'Times New Roman', serif;
  --f-dato: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radio: 3px;
}

* { box-sizing: border-box; }
html, body { background: var(--noche); color: var(--pergamino); }
body { margin: 0; font-family: var(--f-libro); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 12px 32px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }

/* Una columna en el móvil; en pantallas anchas, la crónica a la derecha. */
.g { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) {
  .g { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); grid-template-areas: 'cab cab' 'mapa cronica' 'voluntad cronica' 'pueblos cronica'; align-items: start; }
  .g-cab { grid-area: cab; } .g-mapa { grid-area: mapa; } .g-voluntad { grid-area: voluntad; } .g-pueblos { grid-area: pueblos; }
  .g-cronica { grid-area: cronica; position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
  .g-cronica .cronica { overflow-y: auto; min-height: 0; }
}

/* ---- Cabecera ---- */
.g-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.marca { font-family: var(--f-pixel); font-weight: 600; font-size: 30px; letter-spacing: 0.06em; margin: 0; text-transform: uppercase; color: var(--oro); }
.reloj { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; min-width: 0; }
.anio { font-family: var(--f-pixel); font-size: 22px; font-variant-numeric: tabular-nums; }
.era { font-family: var(--f-dato); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tenue); }
.mandos { display: flex; gap: 6px; flex-wrap: wrap; }
.mando { font-family: var(--f-pixel); font-size: 15px; background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 6px 12px; }
.mando:hover { border-color: var(--oro); }
.mando.sutil { color: var(--tenue); }
.mando:disabled { opacity: 0.5; cursor: wait; }

/* ---- El mapa ---- */
.marco { border: 1px solid var(--linea); border-radius: var(--radio); background: #091020; padding: 4px; line-height: 0; overflow: hidden; }
#mapa { display: block; max-width: 100%; image-rendering: pixelated; cursor: crosshair; margin: 0 auto; }
.clave { margin: 6px 0 0; font-family: var(--f-dato); font-size: 11px; color: var(--tenue); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.cuad { display: inline-block; width: 9px; height: 9px; margin-right: 4px; vertical-align: -1px; }
.cuad.cap { background: #fff6dc; outline: 1px solid var(--noche); }
.cuad.gue { background: #ff4b3a; }
.cuad.rio { background: #4f8fd6; }

/* ---- La voluntad ---- */
.etiqueta { font-family: var(--f-pixel); font-weight: 400; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tenue); margin: 0 0 8px; display: block; }
.g-voluntad { background: linear-gradient(180deg, var(--oro-hondo), var(--panel) 70%); border: 1px solid var(--oro); border-radius: var(--radio); padding: 14px; }
.g-voluntad .etiqueta { color: var(--oro); }
.linea { display: flex; gap: 8px; }
#orden { flex: 1; min-width: 0; background: var(--noche); border: 1px solid var(--linea); border-radius: var(--radio); padding: 10px 12px; font-family: var(--f-libro); font-size: 16px; }
#orden::placeholder { color: #6c7690; font-style: italic; }
.obrar { font-family: var(--f-pixel); font-weight: 600; font-size: 17px; background: var(--oro); color: var(--noche); border: 0; border-radius: var(--radio); padding: 0 18px; }
.obrar:hover { filter: brightness(1.08); }
.ejemplos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ejemplo { font-size: 13px; font-family: var(--f-libro); font-style: italic; background: transparent; border: 1px dashed var(--linea); border-radius: var(--radio); padding: 3px 8px; color: var(--tenue); }
.ejemplo:hover { color: var(--pergamino); border-color: var(--oro); }
.respuesta { margin: 10px 0 0; font-size: 14px; color: var(--tenue); min-height: 1.5em; }
.respuesta.bien { color: var(--oro); }
.respuesta.duda { color: var(--pergamino); }
.respuesta.espera { color: var(--oro); font-style: italic; }

/* ---- Los pueblos ---- */
.lista-pueblos { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.pueblo { display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 5px 10px 5px 6px; text-align: left; }
.pueblo:hover { border-color: var(--tenue); }
.pueblo.elegido { border-color: var(--pergamino); background: #1c2643; }
.muestra { width: 12px; height: 12px; flex: none; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35); }
.p-nombre { font-family: var(--f-pixel); font-size: 15px; }
.p-dato { font-family: var(--f-dato); font-size: 10px; color: var(--tenue); letter-spacing: 0.04em; }
.ficha { background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 12px 14px; }
.ficha h3 { font-family: var(--f-pixel); font-weight: 600; font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
.ficha .subt { margin: 2px 0 10px; color: var(--tenue); font-style: italic; }
.ficha dl { margin: 0; display: grid; gap: 4px; }
.fila { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.fila dt { font-family: var(--f-dato); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--tenue); }
.fila dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; }
.tenue { color: var(--tenue); font-size: 13px; }
.rojo { color: var(--sangre); }
.barra { display: inline-block; width: 90px; height: 8px; background: var(--noche); border: 1px solid var(--linea); vertical-align: 0; }
.barra span { display: block; height: 100%; background: var(--pergamino); }
.vacio { margin: 0; color: var(--tenue); font-style: italic; }

/* ---- La crónica ---- */
.cronica-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cronica { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.suceso { padding: 10px 0 12px; border-top: 1px solid var(--linea); min-width: 0; }
.s-cab { display: flex; align-items: baseline; gap: 8px; }
.s-anio { font-family: var(--f-dato); font-size: 11px; color: var(--tenue); font-variant-numeric: tabular-nums; flex: none; min-width: 6.6em; }
.s-punto { width: 8px; height: 8px; flex: none; align-self: center; }
.s-titulo { margin: 0; font-family: var(--f-libro); font-weight: 600; font-size: 15px; text-wrap: balance; }
.s-texto { margin: 4px 0 0; color: var(--pergamino); max-width: 62ch; }
.s-porque, .s-precedente { margin: 4px 0 0; font-size: 13px; color: var(--tenue); max-width: 62ch; }
.s-porque b, .s-precedente b { font-family: var(--f-dato); font-weight: 600; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pergamino); margin-right: 4px; }
.suceso.importante .s-titulo { font-size: 16px; }
.suceso.divino { border-top-color: var(--oro); }
.suceso.divino .s-titulo { color: var(--oro); }
.suceso.cronista .s-texto { font-style: italic; font-size: 15.5px; }
.suceso.cronista .s-titulo { font-family: var(--f-pixel); font-weight: 400; letter-spacing: 0.04em; }

@media (max-width: 420px) {
  .marca { font-size: 26px; }
  .mando { padding: 5px 9px; font-size: 14px; }
  .s-anio { min-width: 5.8em; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="g">
  <header class="g-cab">
    <h1 class="marca">Génesis</h1>
    <div class="reloj" aria-live="polite"><span class="anio" id="anio">4000 a. C.</span><span class="era" id="era">Neolítico</span></div>
    <div class="mandos">
      <button type="button" class="mando" id="play" aria-pressed="false">❚❚ Pausa</button>
      <button type="button" class="mando" id="vel" title="Velocidad del tiempo">1×</button>
      <button type="button" class="mando sutil" id="nuevo">Nuevo mundo</button>
    </div>
  </header>

  <section class="g-mapa" aria-label="Mapa del mundo">
    <div class="marco"><canvas id="mapa" role="img" aria-label="Mapa del mundo: cada color es un pueblo; los cuadrados claros son sus capitales"></canvas></div>
    <p class="clave"><span class="cuad cap"></span>capital <span class="cuad gue"></span>frontera en guerra <span class="cuad rio"></span>río</p>
  </section>

  <form class="g-voluntad" id="voluntad" autocomplete="off">
    <label for="orden" class="etiqueta">Tu voluntad</label>
    <div class="linea">
      <input id="orden" name="orden" type="text" maxlength="200" enterkeyhint="send" placeholder="Peste sobre el más grande, que descubran la pólvora…">
      <button type="submit" class="obrar">Obrar</button>
    </div>
    <div class="ejemplos" id="ejemplos" aria-label="Ejemplos"></div>
    <p class="respuesta" id="respuesta" aria-live="polite">El tiempo corre. Escribe cuando quieras intervenir.</p>
  </form>

  <section class="g-pueblos" aria-label="Los pueblos">
    <h2 class="etiqueta">Los pueblos</h2>
    <ul class="lista-pueblos" id="pueblos"></ul>
    <div class="ficha" id="ficha"></div>
  </section>

  <section class="g-cronica" aria-label="Crónica del mundo">
    <div class="cronica-cab">
      <h2 class="etiqueta">Crónica del mundo</h2>
      <button type="button" class="mando sutil" id="cronista" hidden>Pedir un capítulo al cronista</button>
    </div>
    <ol class="cronica" id="cronica"></ol>
  </section>
</div>
<script>
// js/mundo/datos.js
/*
 * GÉNESIS · LOS DATOS DEL MUNDO
 * Las eras de la historia humana real, sus inventos, el carácter de los pueblos, cómo se nombran
 * y la biblioteca de porqués: mecanismos reales con su precedente histórico, para que la crónica
 * explique cada cosa que pasa en el mundo.
 */
(function (RF) {
  'use strict';
  const M = RF.MUNDO = RF.MUNDO || {};

  // Cada era: cuántos años dura un turno cuando el pueblo más avanzado está en ella, cuánta gente
  // alimenta cada casilla (cap), cuánto pesa en la guerra (fuerza) y cuánta ciencia hace falta para llegar.
  M.ERAS = [
    { nombre: 'Neolítico', con: 'el Neolítico', corto: 'NEOLÍTICO', anios: 100, cap: 1.0, fuerza: 1.0, umbral: 0, inventos: ['la agricultura', 'la cerámica', 'el arado de madera'] },
    { nombre: 'Edad del Bronce', con: 'la Edad del Bronce', corto: 'BRONCE', anios: 100, cap: 1.35, fuerza: 1.4, umbral: 19, inventos: ['la escritura', 'la rueda', 'el bronce', 'el calendario'] },
    { nombre: 'Edad del Hierro', con: 'la Edad del Hierro', corto: 'HIERRO', anios: 50, cap: 1.7, fuerza: 2.0, umbral: 118, inventos: ['el hierro', 'el alfabeto', 'la moneda'] },
    { nombre: 'Antigüedad clásica', con: 'la Antigüedad clásica', corto: 'CLÁSICA', anios: 50, cap: 2.0, fuerza: 2.6, umbral: 270, inventos: ['la filosofía', 'el acueducto', 'el derecho escrito', 'el hormigón'] },
    { nombre: 'Edad Media', con: 'la Edad Media', corto: 'MEDIEVAL', anios: 50, cap: 2.3, fuerza: 3.2, umbral: 696, inventos: ['el molino de agua', 'la brújula', 'la universidad', 'el estribo'] },
    { nombre: 'Renacimiento', con: 'el Renacimiento', corto: 'RENACIMIENTO', anios: 25, cap: 3.0, fuerza: 5.0, umbral: 1237, inventos: ['la imprenta', 'la pólvora', 'la banca', 'la carabela'] },
    { nombre: 'Revolución Industrial', con: 'la Revolución Industrial', corto: 'INDUSTRIAL', anios: 15, cap: 5.0, fuerza: 9.0, umbral: 1594, inventos: ['la máquina de vapor', 'el ferrocarril', 'la fábrica'] },
    { nombre: 'Era Moderna', con: 'la Era Moderna', corto: 'MODERNA', anios: 8, cap: 8.0, fuerza: 16, umbral: 2054, inventos: ['la electricidad', 'las vacunas', 'la radio', 'el avión'] },
    { nombre: 'Era Atómica', con: 'la Era Atómica', corto: 'ATÓMICA', anios: 4, cap: 12, fuerza: 30, umbral: 2544, inventos: ['la bomba atómica', 'el ordenador', 'los satélites'] }
  ];

  // Lo que un dios puede regalar, y a qué era pertenece (para "que descubran la imprenta").
  M.INVENTOS = [
    [/agricultura|sembrar|cultivar/, 0, 'la agricultura'], [/ceramica|vasijas/, 0, 'la cerámica'],
    [/escritura|escribir/, 1, 'la escritura'], [/\brueda\b/, 1, 'la rueda'], [/bronce/, 1, 'el bronce'], [/calendario/, 1, 'el calendario'],
    [/hierro/, 2, 'el hierro'], [/alfabeto/, 2, 'el alfabeto'], [/moneda|dinero/, 2, 'la moneda'],
    [/filosofia/, 3, 'la filosofía'], [/acueducto/, 3, 'el acueducto'], [/derecho|leyes escritas/, 3, 'el derecho escrito'], [/hormigon|cemento/, 3, 'el hormigón'],
    [/molino/, 4, 'el molino de agua'], [/brujula/, 4, 'la brújula'], [/universidad/, 4, 'la universidad'], [/estribo/, 4, 'el estribo'],
    [/imprenta|libros/, 5, 'la imprenta'], [/polvora|canon/, 5, 'la pólvora'], [/banca|bancos/, 5, 'la banca'], [/carabela|barcos/, 5, 'la carabela'],
    [/vapor/, 6, 'la máquina de vapor'], [/ferrocarril|tren/, 6, 'el ferrocarril'], [/fabrica/, 6, 'la fábrica'],
    [/electricidad|luz electrica/, 7, 'la electricidad'], [/vacuna/, 7, 'las vacunas'], [/radio/, 7, 'la radio'], [/avion/, 7, 'el avión'], [/penicilina|antibiotico/, 7, 'la penicilina'],
    [/bomba atomica|bomba nuclear|arma nuclear|atomica/, 8, 'la bomba atómica'], [/ordenador|computadora/, 8, 'el ordenador'], [/satelite/, 8, 'los satélites'], [/internet/, 8, 'internet']
  ];

  // El carácter de cada pueblo cambia cómo decide: cuánto guerrea, cuánta ciencia hace, cuánto comercia.
  M.CARACTERES = {
    guerrero: { nombre: 'guerrero', agresion: 1.7, ciencia: 0.9, comercio: 0.8, estab: 0 },
    mercader: { nombre: 'mercader', agresion: 0.6, ciencia: 1.05, comercio: 1.7, estab: 0 },
    devoto: { nombre: 'devoto', agresion: 1.0, ciencia: 0.85, comercio: 1.0, estab: 6 },
    sabio: { nombre: 'sabio', agresion: 0.7, ciencia: 1.4, comercio: 1.1, estab: 0 }
  };

  M.COLORES = ['#e5533d', '#4f86e8', '#e8b13b', '#45b86a', '#a65fe0', '#e8823b', '#3cc6c6', '#e0559b', '#9bc93f', '#8a93e8', '#c9a16b', '#5fd1a0'];

  // Nombres inventados para los pueblos ("Karenia", "Tolmedor"...).
  M.SILABAS = {
    inicio: ['Ak', 'Bel', 'Cor', 'Dra', 'Esh', 'Far', 'Gal', 'Hel', 'Ish', 'Kar', 'Lum', 'Mar', 'Nor', 'Ost', 'Pel', 'Qan', 'Ras', 'Sar', 'Tal', 'Ur', 'Val', 'Xan', 'Yar', 'Zor', 'Tum', 'Ib', 'Ol', 'Sen', 'Mez', 'Ka', 'Tol', 'Ner', 'Ab', 'Ilu'],
    medio: ['a', 'e', 'i', 'o', 'u', 'ar', 'en', 'il', 'or', 'an', 'ur', 'es'],
    fin: ['ria', 'nia', 'dor', 'tan', 'ka', 'mia', 'lia', 'sis', 'ra', 'gon', 'thos', 'mar', 'shan', 'via', 'ta', 'kum', 'lan']
  };

  /*
   * LOS PORQUÉS DEL MUNDO: por cada tipo de suceso, mecanismos reales con su precedente histórico.
   * La crónica elige uno al azar para explicar lo que acaba de pasar.
   */
  M.PORQUES = {
    fundacion: [['Donde hay agua y tierra blanda, hay pueblos: las primeras civilizaciones nacieron junto a ríos.', 'Sumer, Egipto, el Indo y el río Amarillo crecieron, todos, junto a un río.']],
    expansion: [['Cuando la tierra da más comida de la que se come, sobran brazos para ir más lejos.', 'Los pueblos bantúes se extendieron por media África llevando la agricultura y el hierro.'], ['Cada casilla nueva es más comida, pero también más frontera que defender.', 'El Imperio romano llegó tan lejos que acabó construyendo muros: el de Adriano tiene 117 kilómetros.']],
    era: [['Los inventos se acumulan: cada uno hace posible el siguiente.', 'Sin la escritura no hay leyes escritas; sin leyes escritas no hay imperios.']],
    era_1: [['El bronce necesita cobre y estaño, que casi nunca están juntos: obliga a comerciar lejos.', 'Las rutas del estaño unían Cornualles con el Mediterráneo hace 4.000 años.'], ['La escritura se inventó para contar sacos de grano: los primeros textos son facturas.', 'Las tablillas de Uruk (3.200 a. C.) son, sobre todo, cuentas de cebada.']],
    era_2: [['El hierro abunda en casi todas partes: armas baratas para todos, y los reyes pierden el monopolio de la guerra.', 'Hacia 1177 a. C. se hundieron casi todos los reinos del bronce del Mediterráneo; los que llegaron después tenían hierro.']],
    era_3: [['Con ciudades grandes y gente que no tiene que cultivar, aparecen los filósofos y los ingenieros.', 'Atenas tuvo a Sócrates porque tenía esclavos y excedentes; Roma tuvo acueductos porque tenía legiones de ingenieros.']],
    era_4: [['Tras la caída de los grandes imperios, el poder se reparte entre señores y monasterios que guardan el saber.', 'Tras la caída de Roma, en Europa los libros sobrevivieron en los monasterios y en Bagdad se tradujo a Aristóteles.']],
    era_5: [['La imprenta abarata los libros: las ideas se copian más rápido de lo que se pueden prohibir.', 'Gutenberg imprimió su Biblia hacia 1455; en 1517, las tesis de Lutero corrieron por Europa en semanas.'], ['La pólvora vuelve inútiles los castillos: gana quien puede pagar cañones.', 'En 1453 los cañones otomanos abrieron las murallas de Constantinopla, que aguantaban desde hacía mil años.']],
    era_6: [['Una máquina hace el trabajo de cien hombres: la riqueza deja de ser la tierra y pasa a ser la fábrica.', 'Manchester pasó de pueblo a ciudad de 300.000 habitantes en sesenta años gracias al algodón y al vapor.']],
    era_7: [['La electricidad y la medicina alargan la vida: la población se dispara.', 'La humanidad tardó hasta 1804 en llegar a mil millones; en 1927 ya eran dos mil.']],
    era_8: [['Con la bomba atómica, la guerra total deja de tener ganador.', 'Tras Hiroshima y Nagasaki (1945), las potencias nucleares no han vuelto a enfrentarse directamente.']],
    hambruna: [['Si la población crece más deprisa que la comida, el hambre la recorta: es la trampa maltusiana.', 'Malthus lo escribió en 1798. La Gran Hambruna europea de 1315 mató a uno de cada diez.']],
    guerra: [['Las guerras empiezan por fronteras y recursos, y acaban por agotamiento.', 'La guerra de los Cien Años duró 116: se acabó cuando ninguno de los dos podía pagar otra campaña.'], ['El vecino fuerte con un vecino débil siempre encuentra un motivo.', 'Tucídides lo resumió en Melos: "los fuertes hacen lo que pueden y los débiles sufren lo que deben".']],
    conquista: [['Quien tiene mejor técnica puede vencer a muchos más: el acero contra la piedra, el cañón contra la lanza.', 'Pizarro tomó el imperio inca en 1532 con 168 hombres, caballos, acero y la viruela.'], ['Conquistar es fácil; gobernar lo conquistado es lo difícil.', 'Alejandro conquistó de Grecia a la India en once años; su imperio se partió al día siguiente de su muerte.']],
    caida: [['Ningún imperio es eterno: se hunden por dentro antes de que los derriben por fuera.', 'Roma tardó siglos en caer; en 476 el último emperador de Occidente fue depuesto casi sin ruido.']],
    revuelta: [['Cuanto más grande el reino, más lejos queda la capital de sus fronteras: las provincias dejan de obedecer.', 'El Imperio romano se dividió en dos en 395; el califato abasí acabó partido en reinos que solo le rezaban de nombre.']],
    plaga: [['Las pestes viajan con los mercaderes: cuanto más comercio, más contagio.', 'La Peste Negra llegó a Europa en 1347 en barcos genoveses desde Crimea y mató a un tercio de la población.']],

    const p = $('respuesta');
    p.textContent = texto;
    p.className = 'respuesta ' + (tipo || '');
  }

  async function obrar(texto) {
    if (ocupado) return;
    const r = D.obrar(m, texto, sel);
    if (r.ok) {
      responder('Hecho. ' + r.suceso.titulo + '.', 'bien');
      marcar(r.suceso); pintarTodo(); guardar();
      return;
    }
    if (r.motivo === 'falta_quien') { responder('¿Sobre quién? Toca un pueblo en el mapa o nómbralo ("peste sobre ' + (S.vivas(m)[0] || { nombre: 'Karenia' }).nombre + '").', 'duda'); return; }
    if (r.motivo === 'faltan_dos') { responder('Para eso hacen falta dos pueblos: nómbralos, o elige uno y nombra al otro.', 'duda'); return; }
    if (!sample) { responder('Los cielos no entienden esa orden. Prueba con pestes, diluvios, sequías, terremotos, oro, inventos ("que descubran la pólvora"), guerras, paces, profetas, revoluciones o pueblos nuevos.', 'duda'); return; }
    // Lo que el intérprete no entiende, lo decide Claude (con límites).
    ocupado = true;
    const seguia = corriendo; corriendo = false; programar();
    responder('Los cielos meditan tu voluntad…', 'espera');
    try {
      let f;
      if (typeof sample.json === 'function') f = await sample.json(D.SISTEMA + '\n\n' + D.paraIA(m, texto));
      else { const res = await sample(D.SISTEMA + '\n\n' + D.paraIA(m, texto)); f = JSON.parse(String(res.text).replace(/^[^{]*/, '').replace(/[^}]*$/, '')); }
      const e = D.aplicarIA(m, f);
      if (e) { responder('Hecho. ' + e.titulo + '.', 'bien'); marcar(e); }
      else responder((f && f.pregunta) || 'Ni los cielos entienden esa orden. Dila de otra manera.', 'duda');
    } catch (err) {
      responder(err && err.code === 'rate_limited' ? 'Los cielos están saturados. Espera un poco y vuelve a intentarlo.' : 'Los cielos no responden ahora. Prueba con un poder sencillo: peste, diluvio, oro, un invento, una guerra o la paz.', 'duda');
    }
    ocupado = false; corriendo = seguia; programar();
    pintarTodo(); guardar();
  }

  async function cronista() {
    if (!sample || ocupado) return;
    const nuevos = m.cronica.filter(e => e.turno > ultimaCronista && e.tipo !== 'cronista').slice(0, 16).reverse();
    if (nuevos.length < 3) { responder('Aún no ha pasado lo bastante para escribir otro capítulo. Deja correr el tiempo.', 'duda'); return; }
    ocupado = true; $('cronista').disabled = true;
    responder('El cronista moja la pluma…', 'espera');
    try {
      const datos = 'Sucesos desde ' + S.anioTexto(nuevos[0].anio) + ' hasta ' + S.anioTexto(nuevos[nuevos.length - 1].anio) + ':\n' + nuevos.map(e => '- ' + S.anioTexto(e.anio) + ': ' + e.titulo + '. ' + e.texto).join('\n');
      const r = await sample(D.CRONISTA + '\n\n' + datos, { modelTier: 'default' });
      const texto = String(r.text || '').trim();
      if (texto) {
        m.cronica.unshift({ anio: m.anio, turno: m.turno, tipo: 'cronista', titulo: 'Capítulo: de ' + S.anioTexto(nuevos[0].anio) + ' a ' + S.anioTexto(nuevos[nuevos.length - 1].anio), texto, importante: true });
        ultimaCronista = m.turno;
        responder('El cronista ha escrito un capítulo nuevo.', 'bien');
      }
    } catch (err) { responder('El cronista no responde ahora. Vuelve a intentarlo en un rato.', 'duda'); }
    ocupado = false; $('cronista').disabled = false;
    pintarCronica(); guardar();
  }

  // ---------- Arranque ----------
  function iniciar(datos) {
    m = (datos && datos.mundo) || cargar();
    if (!m) mundoNuevo();
    if (datos && datos.sel != null) sel = datos.sel;
    pintarEjemplos(); pintarTodo();
    $('play').addEventListener('click', () => { corriendo = !corriendo; programar(); });
    $('vel').addEventListener('click', () => { vel = (vel + 1) % VELOCIDADES.length; programar(); });
    $('nuevo').addEventListener('click', () => {
      if (!confirmarNuevo) { confirmarNuevo = true; $('nuevo').textContent = '¿Seguro? Toca otra vez'; setTimeout(() => { confirmarNuevo = false; $('nuevo').textContent = 'Nuevo mundo'; }, 3500); return; }
      confirmarNuevo = false; $('nuevo').textContent = 'Nuevo mundo';
      mundoNuevo(); pintarTodo(); guardar(); responder('Un mundo nuevo. Cinco pueblos acaban de aprender a sembrar.', 'bien');
    });
    $('voluntad').addEventListener('submit', ev => { ev.preventDefault(); const t = $('orden').value.trim(); if (!t) return; $('orden').value = ''; obrar(t); });
    $('mapa').addEventListener('click', ev => {
      const r = ev.currentTarget.getBoundingClientRect();
      const x = Math.floor((ev.clientX - r.left) / r.width * S.W), y = Math.floor((ev.clientY - r.top) / r.height * S.H);
      const d = m.dueno[S.idx(x, y)];
      sel = d >= 0 ? (sel === d ? null : d) : null;
      pintarTodo();
    });
    $('cronista').addEventListener('click', cronista);
    window.addEventListener('resize', () => pintarMapa());
    programar();
    if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ mundo: m, sel }));
    // Dentro de claude.ai, Claude entiende lo que el intérprete no, y escribe capítulos de la crónica.
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then(fn => { sample = fn || null; $('cronista').hidden = !sample; }).catch(() => { sample = null; });
    }
  }

  function arrancar() {
    if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(iniciar);
    else iniciar(window.claude && window.claude.hot ? window.claude.hot.data : null);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);
  else arrancar();
})(globalThis.RF = globalThis.RF || {});
</script>
