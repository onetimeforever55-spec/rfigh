  // ---------- Memoria del mundo ----------
  function memoria(e) { if (!e.memoria) e.memoria = []; return e.memoria; }
  function recordar(e, texto) {
    const t = limpiar(texto, 240);
    if (!t) return;
    const m = memoria(e);
    if (m.length && m[m.length - 1].texto === t) return;
    m.push({ dia: e.dia, texto: t });
    if (m.length > MAX_MEMORIA) m.splice(0, m.length - MAX_MEMORIA);
  }

  // ---------- El contexto que recibe la IA ----------
  const redondear = v => Math.round(v * 10) / 10;
  // Solo los elementos que son objetos (la IA a veces cuela null, números o textos sueltos).
  const objetos = (x, n) => (Array.isArray(x) ? x : []).filter(o => o && typeof o === 'object' && !Array.isArray(o)).slice(0, n);
  function soloNumeros(o) {
    const out = {};
    for (const [k, v] of Object.entries(o || {})) if (Math.abs(v) >= 0.05) out[k] = redondear(v);
    return out;
  }

  function contexto(e, decreto) {
    const s = e.stats;
    const p = RF.politica.iniciar(e);
    RF.poder.iniciar(e);
    const gabinete = Object.entries(RF.GABINETE).map(([id, m]) => {
      const g = e.gabinete[id];
      return { id, nombre: g.nombre, cargo: m.cargo, caidos_antes: g.caidos.map(c => c.nombre + ' (' + c.destino + ')') };
    });
    const gente = Object.entries(RF.CIUDADANOS).map(([id, c]) => ({
      id, nombre: c.nombre, quien: c.presentacion ? c.presentacion.slice(0, 140) : '', estado: e.ciudadanos[id].estado || 'libre', animo: Math.round(e.ciudadanos[id].animo)
    }));
    const otros = [
      { id: 'valiente', nombre: 'Song Dae-ho', quien: 'líder de la oposición', estado: e.personas.valiente || 'libre' },
      { id: 'embajador', nombre: 'el embajador sueco', quien: 'la gran potencia vecina', estado: e.personas.embajador || 'libre' }
    ];
    return {
      turno: e.dia,
      regimen: RF.REGIMENES[p.regimen].nombre,
      instituciones: { congreso: p.congreso, tribunales: p.tribunales, prensa: p.prensa, elecciones: p.elecciones, constitucion: p.constitucion },
      apoyo_en_el_congreso: Math.round(p.apoyo) + '%',
      pais: { dinero: s.dinero, inflacion: Math.round(s.inflacion), estabilidad: s.estabilidad, balance_por_turno: Math.round(e.balance || 0) },
      sectores: { ejercito: Math.round(RF.consejero.asegurar(e).sectores.ejercito), elite: Math.round(e.sectores.elite), felicidad: s.felicidad },
      economia: { sanciones: e.economia.sanciones + ' de 4', mercado_negro: Math.round(e.economia.mercadoNegro) + '%' },
      diplomacia: RF.diplomacia ? RF.diplomacia.paraIA(e) : undefined,
      leyes_vigentes: RF.leyes.lista(e).map(l => ({ id: l.clave, nombre: l.nombre, desde_turno: l.desde, nivel: l.nivel, por_turno: soloNumeros(RF.leyes.efectoNominal(l)), secreta: l.secreta || undefined })),
      gabinete, gente_de_a_pie: gente, otras_personas: otros,
      secretos_sin_descubrir: p.secretos.length, escandalos: p.escandalos,
      turnos_sin_evento: e.dilemas && e.dilemas.ultimo ? e.dia - e.dilemas.ultimo : e.dia,
      consecuencias_ya_programadas: (e.pendientes || []).map(x => x.titulo),
      memoria: memoria(e).map(m => 'Turno ' + m.dia + ': ' + m.texto),
      ultimos_decretos: (e.historial || []).slice(-6).map(h => 'Turno ' + h.dia + ': ' + (h.texto || h.medida)),
      decreto: decreto
    };
  }

  // ---------- Leer la ficha ----------
  function extraerJSON(texto) {
    const t = String(texto || '').replace(/<think>[\s\S]*?<\/think>/g, '');
    try { return JSON.parse(t); } catch (e) { /* sigue */ }
    const f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (f) { try { return JSON.parse(f[1]); } catch (e) { /* sigue */ } }
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* sigue */ } }
    return null;
  }

  // Los textos de la IA se muestran tal cual: fuera llaves y corchetes (el juego los usa como plantillas).
  function limpiar(x, max) {
    if (x == null) return '';
    return String(x).replace(/[{}[\]]/g, '').replace(/\s+/g, ' ').trim().slice(0, max || 600);
  }

  // Números dentro de los topes. Anota lo que se recorta.
  function efectos(o, topes, recortes) {
    const out = {};
    if (!o || typeof o !== 'object') return out;
    for (const k of STATS) {
      let v = Number(o[k]);
      if (!isFinite(v) || !v) continue;
      const [min, max] = topes[k];
      if (v < min || v > max) { recortes.push(k); v = Math.max(min, Math.min(max, v)); }
      out[k] = Math.round(v * 10) / 10;
    }
    return out;
  }

  // "La privatización del aire de Brisa S.A." → "la privatización del aire de Brisa S.A." (sin romper nombres propios).
  const minuscula = t => (t ? t.charAt(0).toLowerCase() + t.slice(1) : t);
  const clave = nombre => 'IA:' + T.normalizar(nombre).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 60);

  // ---------- Aplicar una ley de la ficha ----------
  function prepararLey(l, recortes) {
    const nombre = minuscula(limpiar(l.nombre, 120)) || 'una medida sin nombre';
    const curvas = {};
    for (const [k, v] of Object.entries(l.curvas && typeof l.curvas === 'object' ? l.curvas : {})) if (STATS.includes(k) && CURVAS.includes(v)) curvas[k] = v;
    const porTurno = efectos(l.por_turno, TOPES.porTurno, recortes);
    const duracion = Number(l.duracion) > 0 ? Math.min(30, Math.round(Number(l.duracion))) : null;
    return {
      nombre,
      def: { clave: clave(nombre), inicial: efectos(l.inicial, TOPES.inicial, recortes), porTurno, curvas, duracion, imprime: !!l.imprime && (porTurno.inflacion || 0) > 0, notas: [] },
      controversia: Math.max(0, Math.min(3, Math.round(Number(l.controversia) || 0)))
    };
  }

  // Promulga (o manda al Congreso) una ley. Devuelve los efectos iniciales a aplicar.
  function promulgarLey(e, ley, res, op) {
    const p = RF.politica.iniciar(e);
    const c = ley.controversia;
    const secreta = !!op.secreto;
    if (!op.forzar && !secreta && p.congreso === 'libre' && c > 0 && p.apoyo < 35 + 10 * c) {
      res.bloqueada = true;
      RF.director.forzar(e, 'congreso_bloquea', { ficha: { leyes: [ley] }, medida: ley.nombre });
      res.dilema = 'congreso_bloquea';
      res.notas.push('La ley necesita pasar por el Congreso y no tienes votos: solo cuentas con el ' + Math.round(p.apoyo) + '% de apoyo.');
      return {};
    }
    const r = RF.leyes.promulgar(e, Object.assign({}, ley.def, { secreta }), 'IA', ley.nombre);
    res.leyes.push(r.ley);
    const nom = RF.leyes.efectoNominal(r.ley);
    res.porTurno = res.porTurno || {};
    for (const [k, v] of Object.entries(nom)) res.porTurno[k] = (res.porTurno[k] || 0) + v;
    if (Object.keys(r.ley.curvas || {}).length) res.curvas = Object.assign(res.curvas || {}, r.ley.curvas);
    res.notas.push(...r.notas);
    if (secreta) RF.politica.registrarSecreto(e, { tipo: op.tipoSecreto || 'represion', descripcion: ley.nombre, gravedad: op.gravedad || 2, clave: ley.def.clave });
    if (p.congreso === 'libre' && !secreta) {
      const fel = (ley.def.porTurno.felicidad || 0) * 3 + (ley.def.inicial.felicidad || 0);
      p.apoyo = Math.max(0, Math.min(100, p.apoyo - 3 * c + (fel > 2 ? 3 : 0)));
    }
    return r.inicial;
  }

  // Relaciones con las potencias (con tope ±25 cada una) y el arsenal nuclear.
  function aplicarRelaciones(e, ficha, res) {
    if (!RF.diplomacia) return;
    const r = ficha.relaciones && typeof ficha.relaciones === 'object' ? ficha.relaciones : {};
    const cambios = {};
    for (const id of Object.keys(RF.PAIS.relaciones || {})) {
      const v = Math.max(-25, Math.min(25, Math.round(Number(r[id]) || 0)));
      if (v) cambios[id] = v;
    }
    const hecho = RF.diplomacia.ajustar(e, cambios, res.notas);
    if (Object.keys(hecho).length) res.relaciones = Object.assign(res.relaciones || {}, hecho);
    if (typeof ficha.arsenal === 'boolean') RF.diplomacia.iniciar(e).arsenal = ficha.arsenal;
  }

  // Consecuencias que llegan más tarde (las cuenta el motor cuando toca).
  function programar(e, ficha, res, recortes) {
    for (const c of objetos(ficha.consecuencias, 2)) {
      const en = Math.max(1, Math.min(6, Math.round(Number(c.en_turnos) || 2)));
      const tit = limpiar(c.titulo, 80);
      if (!tit) continue;
      e.pendientes.push({ dia: e.dia + en, titulo: tit, texto: limpiar(c.texto, 400), efectos: efectos(c.efectos, TOPES.inicial, recortes) });
      res.programadas = (res.programadas || 0) + 1;
    }
  }

  function relacionesOpcion(r) {
    const out = {};
    if (!r || typeof r !== 'object') return out;
    for (const id of Object.keys(RF.PAIS.relaciones || {})) { const v = Math.max(-20, Math.min(20, Math.round(Number(r[id]) || 0))); if (v) out[id] = v; }
    return out;
  }

  // Un evento propio de la IA: no más de uno cada dos turnos y nunca encima de otro.
  function crearEvento(e, ev, res, recortes) {
    const D = e.dilemas;
    if (ev && typeof ev === 'object' && objetos(ev.opciones, 3).length >= 2 && !D.pendiente && (!D.ultimo || e.dia - D.ultimo >= 2)) {
      const id = 'ia_' + e.dia + '_' + Math.floor(Math.random() * 1e6);
      const opciones = objetos(ev.opciones, 3).map(o => {
        const din = Math.max(-15, Math.min(15, Number(o.por_turno_dinero) || 0));
        return { texto: limpiar(o.texto, 90) || 'Seguir adelante', resultado: limpiar(o.resultado, 400), efectos: efectos(o.efectos, TOPES.inicial, recortes), ingresos: din ? Math.round(din / 3 * 10) / 10 : 0, hecho: limpiar(o.hecho, 240), relaciones: relacionesOpcion(o.relaciones), sanciones: Math.max(-1, Math.min(1, Math.round(Number(o.sanciones) || 0))) };
      });
      D.custom = D.custom || {};
      D.custom[id] = { id, titulo: limpiar(ev.titulo, 80) || 'Una decisión', texto: limpiar(ev.texto, 700), opciones, ia: true };
      RF.director.forzar(e, id, {});
      res.dilema = id;
    }
  }

  // Si el Congreso bloqueó una ley de la IA y luego sale adelante (por un evento).
  function aprobar(e, ficha) {
    const res = { deltas: {}, porTurno: null, notas: [], leyes: [] };
    const ini = {};
    for (const ley of ficha.leyes || []) for (const [k, v] of Object.entries(promulgarLey(e, ley, res, { forzar: true }))) ini[k] = (ini[k] || 0) + v;
    RF.consejero.aplicarEfectos(e, ini, res.deltas);
    return res;
  }

  /*
   * Aplica la ficha de la IA al estado, con el motor como árbitro.
   * Devuelve un resultado de turno (como los del Consejero) con lo que pasó de verdad.
   */
  function aplicar(e, ficha, texto) {
    const p = RF.politica.iniciar(e);
    RF.poder.iniciar(e);
    const recortes = [];
    const titulo = minuscula(limpiar(ficha.titulo, 140)) || 'un decreto';
    const res = { tipo: 'ia', dia: e.dia, deltas: {}, porTurno: null, sucesos: [], notas: [], leyes: [], medida: titulo, nombreObjeto: titulo };
    const inicial = {};
    const sumar = (o, f) => { for (const [k, v] of Object.entries(o || {})) inicial[k] = (inicial[k] || 0) + v * (f || 1); };
    const secreto = !!ficha.secreto;
    const gravedad = Math.max(1, Math.min(3, Math.round(Number(ficha.gravedad_secreto) || 2)));

    // 1. El sistema político.
    const destino = typeof ficha.regimen === 'string' ? ficha.regimen.toUpperCase() : null;
    let efectosRegimen = null;
    if (destino && RF.REGIMENES[destino] && destino !== p.regimen) {
      const r = RF.politica.instaurar(e, destino);
      if (!r.nulo) {
        res.cambioRegimen = r.cambio;
        efectosRegimen = r.efectos;
        if (r.cadena) e.dilemas.cadena.push({ id: r.cadena.id, dia: e.dia + r.cadena.en });
      }
    }
    // Las mismas reglas que con los decretos normales: sobornos, fraude, comisiones de la verdad, autogolpes.
    for (const [k, v] of Object.entries(ficha.instituciones && typeof ficha.instituciones === 'object' ? ficha.instituciones : {})) {
      if (!INSTITUCIONES.includes(k) || !VALORES_INST.includes(v) || p[k] === v) continue;
      p[k] = v;
      if (k === 'congreso' && v === 'controlado') {
        p.apoyo = 85;
        RF.leyes.promulgar(e, { clave: 'SOBORNOS', porTurno: { dinero: -4 } }, 'POLITICA', 'los sobornos a los diputados');
        RF.politica.registrarSecreto(e, { tipo: 'soborno', descripcion: 'los sobornos a los diputados', gravedad: 2 });
        res.notas.push('Ahora el Congreso aprueba todo. Mantenerlo contento cuesta 4 millones cada turno, y el secreto puede salir a la luz.');
      }
      if (k === 'congreso' && v === 'libre') { p.apoyo = e.stats.felicidad; RF.leyes.derogar(e, 'SOBORNOS'); }
      if (k === 'elecciones' && v === 'controlado') RF.politica.registrarSecreto(e, { tipo: 'fraude', descripcion: 'el amaño del sistema electoral', gravedad: 2 });
      if (k === 'tribunales' && v === 'libre' && (p.crimenes > 0 || p.secretos.length)) e.dilemas.cadena.push({ id: 'comision_verdad', dia: e.dia + 3 });
    }
    if (!res.cambioRegimen) {

        if (c.a === 'DICTADURA' && (c.de === 'DEMOCRACIA' || c.de === 'ILIBERAL')) e.dilemas.cadena.push({ id: 'autogolpe_ejercito', dia: e.dia + 1 });

  // ---------- Contar el decreto (sin crónica, o como borrador para la crónica) ----------
  function bloques(e, ficha, res) {

    if (b.tipo === 'cronica') {
      n.appendChild(el('span', 'etiqueta', b.titulo || 'CRÓNICA'));
      const pc = el('p', b.terminada ? '' : 'cursor' + (b.texto ? '' : ' pensando'), b.texto ? null : 'Claude está escribiendo la crónica del turno…');
      if (b.texto) escribirCronica(pc, b.texto);
      n.appendChild(pc);
      nodosCronica.set(b, pc);
      return { nodo: n };
    }
    if (b.titulo) n.appendChild(el('span', 'etiqueta', b.titulo));
    if (b.tipo === 'gaceta' && b.titulo) {
      const sello = b.titulo.indexOf('DECRETO') === 0 ? 'DECRETADO' : b.titulo.indexOf('ORDEN RESERVADA') === 0 ? 'SECRETO' : b.titulo.indexOf('PROYECTO') === 0 ? 'BLOQUEADO' : null;
      if (sello) n.appendChild(el('span', 'sello', sello));
    }
    if (b.texto != null) {
      p = el('p');
      n.appendChild(p);
      texto = b.texto;
    }
    if (b.tipo === 'suceso' && b.deltas && Object.keys(b.deltas).some(k => b.deltas[k])) n.appendChild(listaDeltas(b.deltas, 'mini'));
    return { nodo: n, parrafo: p, texto };
  }

  const LETRAS = ['A', 'B', 'C'];

  // Tarjeta de evento con sus opciones. Solo se puede pulsar si es el evento abierto ahora mismo.
  function crearDilema(b, n) {
    n.appendChild(el('span', 'etiqueta', b.titulo));
    const p = el('p');
    n.appendChild(p);
    const cont = el('div', 'dilema-opciones');
    const pend = RF.director.pendiente(estado);
    const abierto = b.elegida == null && pend && pend.id === b.id;
    b.opciones.forEach((op, i) => {
      const boton = el('button', 'dilema-op' + (b.elegida === i ? ' elegida' : ''));
      boton.type = 'button';
      boton.disabled = !abierto;
      const linea = el('span', 'op-texto');
      linea.appendChild(el('span', 'op-letra', LETRAS[i] + ')'));
      linea.appendChild(document.createTextNode(op.texto));
      boton.appendChild(linea);
      const efectos = el('span', 'op-efectos');
      for (const r of op.resumen) efectos.appendChild(el('span', r.tono, r.texto));
      boton.appendChild(efectos);
      boton.addEventListener('click', () => elegirOpcion(i));
      cont.appendChild(boton);
    });
    n.appendChild(cont);
    if (abierto) tarjetaAbierta = { b, cont };
    return { nodo: n, parrafo: p, texto: b.texto };
  }

  const ANIMADOS = new Set(['gaceta', 'cupula', 'calle', 'suceso', 'fin', 'dilema', 'amanecer', 'prensa', 'regimen', 'radio', 'ejercito']);

  function mostrar(bloques, animar) {
    for (const b of bloques) {
      registro.push(b);
      cola.push({ b, animar: animar && !reducirMovimiento && ANIMADOS.has(b.tipo) });
    }
    if (registro.length > MAX_REGISTRO * 1.5) registro = registro.slice(-MAX_REGISTRO);
    if (!escribiendo) siguiente();
  }

  // La vista sigue el texto que se va escribiendo solo si el jugador está abajo del todo.
  // Si sube a leer algo, no se le arrastra: aparece un botón para volver al final.
  let pegado = true, posAuto = 0;
  function alFondo(forzar) {
    const r = $('registro');
    if (forzar) pegado = true;
    if (pegado) { r.scrollTop = r.scrollHeight; posAuto = r.scrollTop; $('ir-abajo').hidden = true; }
    else $('ir-abajo').hidden = false;
  }
  function vigilarScroll() {
    const r = $('registro');
    r.addEventListener('scroll', () => {
      // Solo cuenta como "ha subido a leer" si la vista sube respecto a donde la dejó el juego
      // (el texto nuevo que se añade mientras tanto no debe despegarla).
      if (r.scrollHeight - r.scrollTop - r.clientHeight < 60) pegado = true;
      else if (r.scrollTop < posAuto - 10) pegado = false;
      if (pegado) $('ir-abajo').hidden = true;
    }, { passive: true });
    $('ir-abajo').addEventListener('click', () => alFondo(true));
  }

  function siguiente() {
    let item;
    while ((item = cola.shift())) {
      const { nodo, parrafo, texto } = crearBloque(item.b);
      $('registro').appendChild(nodo);
      if (!parrafo || !item.animar || saltar) { if (parrafo) parrafo.textContent = texto; continue; }
      let i = 0;
      actual = { parrafo, texto };
      parrafo.classList.add('cursor');
      const paso = () => {
        i = saltar ? texto.length : Math.min(texto.length, i + 4);
        parrafo.textContent = texto.slice(0, i);
        alFondo();
        if (i < texto.length) escribiendo = requestAnimationFrame(paso);
        else { parrafo.classList.remove('cursor'); actual = null; escribiendo = setTimeout(siguiente, saltar ? 0 : 180); }
      };
      escribiendo = requestAnimationFrame(paso);
      return;
    }
    alFondo();
    escribiendo = null;
    saltar = false;
  }

  // Termina de golpe todo lo que se estaba escribiendo.
  function vaciar() {
    if (escribiendo) { clearTimeout(escribiendo); cancelAnimationFrame(escribiendo); }
    if (actual) { actual.parrafo.textContent = actual.texto; actual.parrafo.classList.remove('cursor'); actual = null; }
    while (cola.length) {
      const { nodo, parrafo, texto } = crearBloque(cola.shift().b);
      if (parrafo) parrafo.textContent = texto;
      $('registro').appendChild(nodo);
    }
    escribiendo = null;
    saltar = false;
    alFondo();
  }

  function mostrarOpciones(opciones) {
    const cont = el('div', 'bloque opciones');
    for (const op of opciones) {
      const b = el('button', 'opcion', op.etiqueta);
      b.type = 'button';
      b.addEventListener('click', () => {
        cont.querySelectorAll('button').forEach(x => { x.disabled = true; });
        b.classList.add('elegida');
        vaciar();
        firmar([op.interp]);
      });
      cont.appendChild(b);
    }
    const esperar = () => { if (escribiendo || cola.length) setTimeout(esperar, 100); else { $('registro').appendChild(cont); alFondo(); } };
    esperar();
  }

  // ---------- Turno ----------
  function cambios(antes) {
    const c = {};
    for (const k of Object.keys(antes)) c[k] = estado.stats[k] - antes[k];
    return c;
  }

  // Firma uno o varios decretos (el mismo día) y cuenta lo que pasa.
  // ---------- Crónica con IA ----------
  const nodosCronica = new WeakMap();
  let iaPausada = false; // si la conexión falla (por ejemplo, dentro del visor de Claude), no se reintenta en esta sesión

  // Escribe la crónica separando sus secciones (RADIO PIONYANG:, PALACIO:, EJÉRCITO:, POBLACIÓN:) con subtítulos.
  // Se llama con cada trozo que llega, así que la crónica se va leyendo mientras se escribe.
  function escribirCronica(pc, texto) {
    pc.textContent = '';
    const nombres = RF.narradorIA.SECCIONES.map(n => n.toUpperCase());
    for (const linea of String(texto).split('\n')) {
      if (!linea.trim()) continue;
      const m = /^\s*\**\s*([A-ZÁÉÍÓÚÑ ]{4,30})\s*\**\s*:\s*(.*)$/.exec(linea);
      const seccion = m && nombres.find(n => n === m[1].trim());
      const cuerpo = el('span', 'cronica-linea');
      if (seccion) {
        pc.appendChild(el('span', 'cronica-seccion', seccion));
        cuerpo.textContent = m[2];
      } else {
        cuerpo.textContent = linea;
      }
      pc.appendChild(cuerpo);
      pc.appendChild(document.createElement('br'));
    }
  }

  function pintarCronica(b) {
    const pc = nodosCronica.get(b);
    if (!pc) return;
    if (b.texto) escribirCronica(pc, b.texto); else pc.textContent = 'Claude está escribiendo la crónica del turno…';
    pc.classList.toggle('pensando', !b.texto);
    pc.classList.toggle('cursor', !b.terminada);
    alFondo();
  }

  // Muestra los bloques de un turno. Con la IA activa, los textos narrativos se sustituyen por una crónica.
  function publicarTurno(bloques) {
    const N = RF.narradorIA.NARRATIVOS;
    const narrativos = bloques.filter(b => N.has(b.tipo));
    // Lo que se ve: lo entretenido; lo técnico, plegado. La IA recibe el turno completo.
    const visibles = RF.narrador.compactar(bloques);
    if (!RF.narradorIA.activa() || iaPausada || !narrativos.length) { mostrar(visibles, true); return; }
    const cronica = { tipo: 'cronica', titulo: 'CRÓNICA', texto: '' };
    const resto = visibles.filter(b => !N.has(b.tipo));
    const i = resto.findIndex(b => b.tipo === 'dilema' || b.tipo === 'fin');
    resto.splice(i === -1 ? resto.length : i, 0, cronica);
    mostrar(resto, true);
    RF.narradorIA.narrar(estado, bloques, (t) => { cronica.texto = t; pintarCronica(cronica); })
      .then(r => {
        cronica.texto = r.texto;
        cronica.terminada = true;
        pintarCronica(cronica);
        guardar();
      })
      .catch(err => {
        // Si algo falla, se quita la crónica y se cuenta el turno con la narración normal.
        registro = registro.filter(b => b !== cronica);
        const pc = nodosCronica.get(cronica);
        if (pc && pc.parentNode) pc.parentNode.remove();
        cola = cola.filter(x => x.b !== cronica);
        const conexion = err.pausar || /conectar|cargar/.test(err.mensaje || '');
        if (conexion) { iaPausada = true; pintarBotonIA(); }
        mostrar([{ tipo: 'nota', texto: (err.mensaje || 'La IA no respondió.') + (conexion ? ' Desactivo la IA durante esta sesión.' : '') + ' El turno sigue con la narración normal.' }].concat(visibles.filter(b => N.has(b.tipo))), true);
        guardar();
      });
  }

  // ---------- El cuadro de la IA: se pega la clave y el juego reconoce el proveedor ----------
  let modalIA = null, volverFoco = null;

  function pintarBotonIA() {
    const b = $('boton-ia');
    if (!b) return;
    const on = RF.narradorIA.activa() && !iaPausada;
    b.classList.toggle('on', on);
    if (on) b.classList.remove('aviso');
    b.textContent = on ? 'IA ●' : 'IA';
    b.setAttribute('aria-label', on ? 'Narrador con IA: activado' : 'Narrador con IA: desactivado');
  }

  function cerrarIA() {
    if (!modalIA || modalIA.hidden) return;
    modalIA.hidden = true;
    pintarBotonIA();
    if (volverFoco) volverFoco.focus();
  }

  function construirIA() {
    const NI = RF.narradorIA;
    const fondo = el('div', 'modal-ia'); fondo.hidden = true;
    const caja = el('div', 'caja-ia');
    caja.setAttribute('role', 'dialog'); caja.setAttribute('aria-modal', 'true'); caja.setAttribute('aria-labelledby', 'titulo-ia');
    const cab = el('div', 'cab-ia');
    const tit = el('h2', '', 'NARRADOR CON IA'); tit.id = 'titulo-ia';
    const cerrar = el('button', 'cerrar-ia', '✕'); cerrar.type = 'button'; cerrar.setAttribute('aria-label', 'Cerrar');
    cab.append(tit, cerrar);
    const intro = el('p', 'intro-ia', 'Una IA convierte lo que pasa cada turno en una crónica. No decide nada: el juego ya lo ha calculado todo.');

    const form = el('form', 'form-ia');
    // Dentro de claude.ai se puede usar la cuenta del jugador, sin clave.
    const fuentes = el('fieldset', 'fuentes-ia'); fuentes.hidden = true;
    fuentes.append(el('legend', '', '¿Quién narra?'));
    const radio = (valor, titulo, detalle) => {
      const l = el('label', 'fuente-ia');
      const r = el('input'); r.type = 'radio'; r.name = 'ia-fuente'; r.value = valor;
      const t = el('span', ''); t.append(el('strong', '', titulo), el('small', '', detalle));
      l.append(r, t); fuentes.append(l);
      return r;
    };
    const rCuenta = radio('cuenta', 'Tu cuenta de Claude', 'Sin clave. Usa el plan de claude.ai; la primera vez te pide permiso.');
    const rClave = radio('clave', 'Una clave de API', 'OpenRouter, Gemini, Groq o Claude.');
    const secCuenta = el('div', 'seccion-ia');
    const labN = el('label', '', 'Nivel'); labN.htmlFor = 'ia-nivel';
    const selN = el('select'); selN.id = 'ia-nivel';
    for (const nv of NI.NIVELES) { const o = el('option', '', nv.nombre); o.value = nv.id; selN.appendChild(o); }
    secCuenta.append(labN, selN);
    const secClave = el('div', 'seccion-ia');
    const lab1 = el('label', '', 'Tu clave de API'); lab1.htmlFor = 'ia-clave';
    const filaClave = el('div', 'fila-clave');
    const clave = el('input'); clave.id = 'ia-clave'; clave.type = 'password'; clave.autocomplete = 'off'; clave.spellcheck = false;
    clave.placeholder = 'Pega aquí tu clave (sk-or-…, AIza…, sk-ant-…)';
    const ver = el('button', 'chip', 'ver'); ver.type = 'button'; ver.setAttribute('aria-label', 'Mostrar u ocultar la clave');
    filaClave.append(clave, ver);
    const detectado = el('p', 'detectado-ia');
    const lab2 = el('label', '', 'Modelo'); lab2.htmlFor = 'ia-modelo';
    const sel = el('select'); sel.id = 'ia-modelo';
    const fila = el('label', 'fila-ia');
    const chk = el('input'); chk.type = 'checkbox'; chk.id = 'ia-activa';
    fila.append(chk, document.createTextNode(' Usar la IA'));
    const filaC = el('label', 'fila-ia sub-ia');
    const chkC = el('input'); chkC.type = 'checkbox'; chkC.id = 'ia-consejo';
    filaC.append(chkC, document.createTextNode(' La IA decide las consecuencias (Consejo de Estado). Si no, solo cuenta la crónica.'));
    chk.addEventListener('change', () => { chkC.disabled = !chk.checked; });
    const botones = el('div', 'botones-ia');
    const bGuardar = el('button', 'chip guardar-ia', 'Guardar'); bGuardar.type = 'submit';
    const bProbar = el('button', 'chip', 'Probar'); bProbar.type = 'button';
    const bBorrar = el('button', 'chip cmd', 'Borrar clave'); bBorrar.type = 'button';
    botones.append(bGuardar, bProbar, bBorrar);
    secClave.append(lab1, filaClave, detectado, lab2, sel);
    form.append(fuentes, secCuenta, secClave, fila, filaC, botones);
    const fuente = () => (!fuentes.hidden && rCuenta.checked ? 'cuenta' : 'clave');
    const verFuente = () => { const cu = fuente() === 'cuenta'; secCuenta.hidden = !cu; for (const x of [secClave, bBorrar, guia, aviso]) x.hidden = cu; };
    rCuenta.addEventListener('change', verFuente); rClave.addEventListener('change', verFuente);
    const estadoIA = el('p', 'estado-ia'); estadoIA.setAttribute('aria-live', 'polite');
    const guia = el('details', 'guia-ia');
    guia.append(el('summary', '', '¿Dónde consigo una clave?'));
    for (const t of [
      'Gratis: OpenRouter (openrouter.ai → Keys). El juego elige solo un modelo gratis.',
      'Gratis: Google Gemini (aistudio.google.com → Get API key).',
      'Gratis: Groq (console.groq.com → API Keys).',
      'De pago, la mejor prosa: Claude (console.anthropic.com → API Keys).'
    ]) guia.append(el('p', '', t));
    const aviso = el('p', 'aviso-ia', 'La clave se guarda solo en este navegador. No compartas el juego con la clave puesta. Dentro de la página de Claude no funciona (bloquea conexiones externas): usa GitHub Pages o el archivo dist/pionyang.html.');
    caja.append(cab, intro, form, estadoIA, guia, aviso);
    fondo.appendChild(caja);
    document.body.appendChild(fondo);

    // Qué proveedor es y qué modelos ofrecer.
    let proveedorVisto = null, cargando = 0;
    const opcion = (valor, texto, elegido) => { const o = el('option', '', texto); o.value = valor; o.selected = !!elegido; sel.appendChild(o); };
    async function alCambiarClave() {
      const c = NI.config();
      const p = NI.detectar(clave.value);
      if (p === proveedorVisto && sel.options.length) return;
      proveedorVisto = p;
      sel.textContent = '';
      if (!clave.value.trim()) { detectado.textContent = ''; sel.disabled = true; opcion('', '—'); return; }
      if (!p) { detectado.textContent = 'No reconozco esta clave. Sirven las de OpenRouter, Gemini, Groq o Claude.'; detectado.className = 'detectado-ia mal'; sel.disabled = true; opcion('', '—'); return; }
      const info = NI.PROVEEDORES[p];
      detectado.className = 'detectado-ia';
      detectado.textContent = '✓ ' + info.nombre + (info.soloGratis ? ' · solo modelos gratis' : '');
      sel.disabled = false;
      const mismo = c.proveedor === p || (!c.proveedor && NI.detectar(c.clave) === p);
      if (p === 'anthropic') { for (const m of NI.MODELOS) opcion(m.id, m.nombre, mismo && m.id === c.modelo); return; }
      const fijo = mismo && c.modelo && !c.auto;
      opcion('', 'Automático' + (info.modelo ? ' (' + info.modelo + ')' : ' · uno gratis'), !fijo);
      if (fijo) opcion(c.modelo, c.modelo, true);
      // Se pide la lista de modelos al proveedor con la clave escrita (sin guardarla todavía).
      const yo = ++cargando;
      let lista = [];
      try { lista = await NI.listarModelos(clave.value.trim(), p); } catch (e) { /* sin lista: queda "automático" */ }
      if (yo !== cargando) return;
      for (const id of lista.sort()) if (!(fijo && id === c.modelo)) opcion(id, id);
      if (lista.length) detectado.textContent += ' · ' + lista.length + ' modelos';
    }
    clave.addEventListener('input', alCambiarClave);
    ver.addEventListener('click', () => { clave.type = clave.type === 'password' ? 'text' : 'password'; ver.textContent = clave.type === 'password' ? 'ver' : 'ocultar'; });

    const leer = () => (fuente() === 'cuenta'
      ? { proveedor: 'cuenta', nivel: selN.value, activa: chk.checked, consejo: chkC.checked }
      : { clave: clave.value.trim(), proveedor: NI.detectar(clave.value) || '', modelo: sel.value, auto: !sel.value, activa: chk.checked, consejo: chkC.checked });
    const describir = () => NI.PROVEEDORES[NI.proveedor()].nombre + (NI.modelo().id ? ' · ' + NI.modelo().nombre.toLowerCase() : '');
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const v = leer();
      if (v.proveedor !== 'cuenta' && v.clave && !v.proveedor) { estadoIA.textContent = 'No reconozco esa clave.'; return; }
      if (v.activa && v.proveedor !== 'cuenta' && !v.clave) { estadoIA.textContent = 'Falta la clave para activar la IA.'; return; }
      NI.guardar(v);
      iaPausada = false;
      pintarBotonIA();
      if (NI.activa()) { estadoIA.textContent = 'Guardado. El próximo turno lo cuenta ' + describir() + '.'; setTimeout(cerrarIA, 900); }
      else estadoIA.textContent = 'Guardado. La IA está apagada: sigue la narración normal.';
    });
    bProbar.addEventListener('click', async () => {
      const v = leer();
      if (v.proveedor !== 'cuenta' && !v.clave) { estadoIA.textContent = 'Pega primero tu clave.'; return; }
      if (!v.proveedor) { estadoIA.textContent = 'No reconozco esa clave.'; return; }
      NI.guardar(Object.assign(v, { activa: NI.config().activa }));
      estadoIA.textContent = 'Probando…';
      bProbar.disabled = true;
      const r = await NI.probar();
      bProbar.disabled = false;
      estadoIA.textContent = r.mensaje;
      if (r.ok) { iaPausada = false; if (v.proveedor !== 'cuenta' && NI.modelo().id && ![...sel.options].some(o => o.value === NI.modelo().id)) opcion(NI.modelo().id, NI.modelo().id, true); }
    });
    bBorrar.addEventListener('click', () => {
      NI.guardar({ clave: '', activa: fuente() === 'cuenta' ? NI.config().activa : false, proveedor: fuente() === 'cuenta' ? 'cuenta' : '', modelo: '' });
      clave.value = ''; chk.checked = false; proveedorVisto = undefined; alCambiarClave();
      pintarBotonIA();
      estadoIA.textContent = 'Clave borrada de este navegador.';
    });
    cerrar.addEventListener('click', cerrarIA);
    fondo.addEventListener('click', (ev) => { if (ev.target === fondo) cerrarIA(); });
    fondo.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') cerrarIA(); });

    fondo.abrir = () => {
      const c = NI.config();
      clave.value = c.clave || ''; clave.type = 'password'; ver.textContent = 'ver';
      const hayCuenta = NI.cuentaDisponible() === true;
      fuentes.hidden = !hayCuenta;
      (hayCuenta && (c.proveedor === 'cuenta' || !c.clave) ? rCuenta : rClave).checked = true;
      selN.value = c.nivel || 'default';
      verFuente();
      chk.checked = !!c.activa || (!c.clave && c.proveedor !== 'cuenta'); // la primera vez, la IA se activa sola
      chkC.checked = c.consejo !== false; chkC.disabled = !chk.checked;
      proveedorVisto = undefined; alCambiarClave();
      estadoIA.textContent = NI.activa() ? (iaPausada ? 'En pausa por un error de conexión. Pulsa Guardar para reintentar.' : 'Activa con ' + describir() + '.') : 'Apagada: el juego usa su narración normal.';
    };
    return fondo;
  }

  function mostrarConfigIA() {
    if (!modalIA) modalIA = construirIA();
    volverFoco = document.activeElement;
    modalIA.abrir();
    modalIA.hidden = false;
    const c = modalIA.querySelector('#ia-clave');
    setTimeout(() => (c.value ? modalIA.querySelector('.guardar-ia') : c).focus(), 30);
  }

  // ---------- El Consejo de Estado con IA: la IA decide qué significa el decreto; el motor arbitra ----------
  let ocupado = false;
  function consejoActivo() { return RF.narradorIA.activa() && !iaPausada && RF.narradorIA.config().consejo !== false; }

  // Mientras la IA piensa: un aviso que se retira al terminar.
  function deliberando(texto) {
    ocupado = true;
    $('consola').classList.add('ocupada');
    const espera = el('section', 'bloque b-consejo');
    const p = el('p', 'cursor pensando', texto);
    espera.append(el('span', 'etiqueta', 'CONSEJO DE ESTADO'), p);
    $('registro').appendChild(espera);
    alFondo();
    return {
      // En cuanto llega la interpretación (el primer campo de la ficha), se enseña.
      alTexto: (t) => {
        const m = /"interpretacion"\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(t);
        if (!m || !m[1]) return;
        // Los pasos del razonamiento que ya han llegado enteros.
        const l = /"logica"\s*:\s*\[((?:[^\]"]|"(?:[^"\\]|\\.)*")*)/.exec(t);
        const pasos = l ? [...l[1].matchAll(/"((?:[^"\\]|\\.)*)"/g)].map(x => x[1].replace(/\\"/g, '"')) : [];
        p.textContent = 'Entendido: ' + m[1].replace(/\\"/g, '"') + '.' + (pasos.length ? '\n' + pasos.join('\n') : '') + '\nCalculando las consecuencias…';
        alFondo();
      },
      listo: () => { espera.remove(); ocupado = false; $('consola').classList.remove('ocupada'); }
    };
  }

  async function firmarIA(texto) {
    const aviso = deliberando('Tus ministros deliberan sobre el decreto y sus consecuencias…');
    const listo = aviso.listo;
    let ficha;
    try {
      ficha = await RF.consejoIA.consultar(estado, texto, aviso.alTexto);
    } catch (err) {
      listo();
      const conexion = err.pausar || /conectar|cargar/.test(err.mensaje || '');
      if (conexion) { iaPausada = true; pintarBotonIA(); }
      mostrar([{ tipo: 'nota', texto: (err.mensaje || 'El Consejo no respondió.') + (conexion ? ' Desactivo la IA durante esta sesión.' : '') + ' Este decreto lo resuelve el intérprete local.' }], false);
      firmarLocal(texto);
      return;
    }
    listo();
    if (ficha.entendido === false) {
      mostrar([{ tipo: 'cupula', titulo: 'EL GABINETE', texto: RF.consejoIA.limpiarTexto(ficha.pregunta) || 'El gabinete se mira entre sí. Nadie ha entendido el decreto. ¿Puede explicarlo de otra forma, Líder Supremo?' }], true);
      guardar();
      return;
    }
    const antes = Object.assign({}, estado.stats);
    estado.iaActiva = true;
    const res = RF.consejoIA.aplicar(estado, ficha, texto);
    const bloques = RF.consejoIA.bloques(estado, ficha, res);
    // El intérprete local aprende de lo que la IA ha entendido.
    const leccion = RF.aprendiz && RF.aprendiz.deFicha(texto, ficha);
    if (leccion) bloques.push({ tipo: 'aprende', titulo: 'EL BOT APRENDE', texto: '«' + texto + '» = ' + RF.aprendiz.describir(leccion) + '. La próxima vez lo entenderá sin la IA.' });
    RF.consejero.avanzarDia(estado, res);
    bloques.push(...RF.narrador.cierreDia(estado, res));
    const d = RF.director.pendiente(estado);
    if (d) bloques.push(RF.narrador.dilema(estado, d));
    publicarTurno(bloques);
    pintarStats(cambios(antes));
    actualizarConsola();
    guardar();
  }

  // ---------- Entrenar al bot: la IA le pone un examen y le enseña lo que falla ----------
  function bloquesAprendido() {
    const r = RF.aprendiz.resumen();
    const lineas = ['De fábrica: ' + r.base + ' ejemplos. Aprendidos jugando con la IA: ' + r.ia + '. En exámenes: ' + r.entreno + '.'];
    if (r.ultimos.length) lineas.push('Lo último:', ...r.ultimos.map(x => '«' + x.texto + '» = ' + RF.aprendiz.describir(x.etiqueta)));
    lineas.push('Escribe "entrenar" para que la IA le ponga un examen, "exportar" para copiar lo aprendido u "olvidar lo aprendido" para borrarlo.');
    return [{ tipo: 'aprende', titulo: 'LO QUE SABE EL BOT', texto: lineas.join('\n') }];
  }

  async function entrenarBot(n) {
    if (!RF.narradorIA.activa() || iaPausada) {
      mostrar([{ tipo: 'nota', texto: 'Para entrenar al bot hace falta la IA: ella es el profesor. Actívala con el botón IA de arriba. Mientras tanto, el bot también aprende solo cada vez que firmas un decreto con la IA activa.' }], false);
      return;
    }
    const aviso = deliberando('La IA prepara un examen de ' + n + ' decretos para el intérprete local…');
    let r;
    try {
      r = await RF.aprendiz.examen(n, estado);
    } catch (err) {
      aviso.listo();
      mostrar([{ tipo: 'nota', texto: (err.mensaje || 'El profesor no respondió.') + ' Prueba otra vez.' }], false);
      return;
    }
    aviso.listo();
    const lineas = ['Decretos del examen: ' + r.total + '. Los entendía bien: ' + r.antes + '. Ahora entiende: ' + r.despues + '.'];
    if (r.aprendidos.length) lineas.push('Ha aprendido:', ...r.aprendidos.slice(0, 10).map(x => '«' + x.texto + '» = ' + RF.aprendiz.describir(x.etiqueta)));
    else lineas.push('No ha fallado nada que aprender. Buen alumno.');
    mostrar([{ tipo: 'aprende', titulo: 'EXAMEN DEL BOT', texto: lineas.join('\n') }], false);
  }

  // El camino de siempre: el Intérprete local entiende el decreto y el Consejero aplica sus reglas.
  function firmarLocal(texto) {
    const lista = RF.interprete.interpretarVarios(texto, estado);
    if (lista.length > 1) { firmar(lista); return; }
    const interp = lista[0];
    if (interp.estado === 'ok') { firmar([interp]); return; }
    if (interp.estado === 'confuso') { mostrar(RF.narrador.confuso(interp), true); guardar(); return; }
    const q = RF.narrador.pregunta(interp);
    mostrar(q.bloques, true);
    if (q.opciones.length) mostrarOpciones(q.opciones);
    guardar();
  }

  function firmar(lista) {
    estado.iaActiva = consejoActivo();
    const antes = Object.assign({}, estado.stats);
    const bloques = [];
    if (lista.length > 1) bloques.push({ tipo: 'nota', texto: 'Firmas ' + lista.length + ' decretos de una sentada. El secretario se masajea la muñeca.' });
    let ultimo = null, validos = 0, avanzado = false;
    lista.forEach((interp, k) => {
      const esUltimo = k === lista.length - 1;
      const op = { avanzar: esUltimo, secundario: validos > 0 };
      const res = interp.tipo === 'persona' ? RF.consejero.decretarPersona(estado, interp, op) : RF.consejero.decretar(estado, interp, op);
      // Una orden imposible ("matar a alguien que ya está muerto") no cuenta como decreto.
      if (res.nulo) { bloques.push({ tipo: 'nota', texto: res.nulo }); return; }
      validos++;
      ultimo = res;
      if (esUltimo) avanzado = true;
      bloques.push(...RF.narrador.decreto(estado, interp, res));
    });
    if (!ultimo) { mostrar(bloques, false); guardar(); return; }
    if (!avanzado) RF.consejero.avanzarDia(estado, ultimo);
    bloques.push(...RF.narrador.cierreDia(estado, ultimo));
    // Si ha saltado un evento (o el Congreso ha bloqueado la ley), su tarjeta va al final.
    const d = RF.director.pendiente(estado);
    if (d) bloques.push(RF.narrador.dilema(estado, d));
    publicarTurno(bloques);
    pintarStats(cambios(antes));
    actualizarConsola();
    guardar();
  }

  // Un turno sin decretos con el Consejo activo: la IA decide qué pasa en el país por sí solo.
  async function esperarIA() {
    const aviso = deliberando('Corea del Norte sigue su curso. Tus ministros vigilan qué se mueve en el país…');
    let ficha;
    try {
      ficha = await RF.consejoIA.consultarMundo(estado);
    } catch (err) {
      aviso.listo();
      const conexion = err.pausar || /conectar|cargar/.test(err.mensaje || '');
      if (conexion) { iaPausada = true; pintarBotonIA(); }
      mostrar([{ tipo: 'nota', texto: (err.mensaje || 'El Consejo no respondió.') + (conexion ? ' Desactivo la IA durante esta sesión.' : '') }], false);
      esperar(true);
      return;
    }
    aviso.listo();
    estado.iaActiva = true;
    const antes = Object.assign({}, estado.stats);
    const res = { tipo: 'espera', dia: estado.dia, deltas: {}, sucesos: [], notas: [] };
    RF.consejoIA.aplicarMundo(estado, ficha, res);
    RF.consejero.avanzarDia(estado, res);
    const bloques = [{ tipo: 'nota', texto: 'No firmas nada este turno. Dejas que tus leyes trabajen.' }];
    bloques.push(...RF.narrador.cierreDia(estado, res), ...RF.consejoIA.reacciones(estado, ficha, res));
    // El amanecer va al final, después de las reacciones.
    const i = bloques.findIndex(b => b.tipo === 'amanecer');
    if (i >= 0) bloques.push(bloques.splice(i, 1)[0]);
    const d = RF.director.pendiente(estado);
    if (d) bloques.push(RF.narrador.dilema(estado, d));
    publicarTurno(bloques);
    pintarStats(cambios(antes));
    actualizarConsola();
    guardar();
  }

  // Un turno sin decretos nuevos: las leyes vigentes siguen actuando.
  function esperar(sinIA) {
    if (!sinIA && consejoActivo()) { esperarIA(); return; }
    estado.iaActiva = consejoActivo();
    const antes = Object.assign({}, estado.stats);
    const res = RF.consejero.pasarTurno(estado);
    const bloques = [{ tipo: 'nota', texto: 'No firmas nada este turno. Dejas que tus leyes trabajen.' }].concat(RF.narrador.cierreDia(estado, res));
    const d = RF.director.pendiente(estado);
    if (d && res.dilema) bloques.push(RF.narrador.dilema(estado, d));
    publicarTurno(bloques);
    pintarStats(cambios(antes));
    actualizarConsola();
    guardar();
  }

  function elegirOpcion(i) {
    const d = RF.director.pendiente(estado);
    if (!d || !d.opciones[i] || !tarjetaAbierta) return;
    vaciar();
    tarjetaAbierta.b.elegida = i;
    tarjetaAbierta.cont.querySelectorAll('button').forEach((x, k) => { x.disabled = true; x.classList.toggle('elegida', k === i); });
    tarjetaAbierta = null;
    const antes = Object.assign({}, estado.stats);
    const r = RF.director.resolver(estado, i);
    mostrar([{ tipo: 'eco', texto: LETRAS[i] + ') ' + RF.texto.expandir(d.opciones[i].texto) }], false);
    mostrar(RF.narrador.decision(estado, r), true);
    pintarStats(cambios(antes));
    actualizarConsola();
    guardar();
  }

  // Mientras hay un evento abierto, la consola lo recuerda.
  function actualizarConsola() {
    const d = RF.director.pendiente(estado);
    $('consola').classList.toggle('aviso-pendiente', !!d);
    $('decreto').placeholder = d ? 'Elige A, B o C en el evento…' : estado.fin ? 'Escribe "reiniciar"…' : 'Escribe tu decreto…';
  }

  function reiniciar() {
    estado = RF.consejero.nuevoEstado();
    vaciar();
    tarjetaAbierta = null;
    registro = [];
    $('registro').innerHTML = '';
    pintarStats();
    mostrar(RF.narrador.intro(estado), false);
    actualizarConsola();
    guardar();
  }

  function procesar(entrada) {
    const texto = entrada.trim();
    if (!texto) return;
    alFondo(true); // quien escribe una orden quiere ver la respuesta
    if (ocupado) { mostrar([{ tipo: 'nota', texto: 'El Consejo de Estado sigue deliberando. Espera a que termine.' }], false); return; }
    const orden = RF.texto.normalizar(texto);
    mostrar([{ tipo: 'eco', texto }], false);

    if (pendienteReinicio) {
      pendienteReinicio = false;
      if (/^(si|s|confirmar|reiniciar)$/.test(orden)) { reiniciar(); return; }
      mostrar([{ tipo: 'nota', texto: 'Seguimos gobernando.' }], false);
      return;
    }
    if (/^(reiniciar|reset|nueva partida|empezar de nuevo)$/.test(orden)) {
      if (estado.fin) { reiniciar(); return; }
      pendienteReinicio = true;
      mostrar([{ tipo: 'nota', texto: '¿Seguro que quieres abandonar el poder y empezar de cero? Escribe "sí" para confirmar.' }], false);
      return;
    }
    if (/^(ayuda|help|\?)$/.test(orden)) { mostrar(RF.narrador.ayuda(), false); return; }
    if (/^(estado|informe|situacion)$/.test(orden)) { mostrar(RF.narrador.estadoPais(estado), false); return; }
    if (/^(ia|api|clave|configurar ia|narrador ia|cronica)$/.test(orden)) { mostrarConfigIA(); return; }
    if (/^(diplomacia|relaciones|exterior|relaciones exteriores|paises|el mundo)$/.test(orden)) { mostrar(RF.narrador.diplomacia(estado), false); return; }
    if (/^(sistema|regimen|politica|congreso|sistema politico)$/.test(orden)) { mostrar(RF.narrador.sistema(estado), false); return; }
    if (/^(gabinete|ministros|poder|instituciones)$/.test(orden)) { mostrar(RF.narrador.gabinete(estado), false); return; }
    if (/^(leyes|ley|leyes vigentes|economia|mercado|balance)$/.test(orden)) { mostrar(RF.narrador.leyes(estado), false); return; }
    if (/^(historial|decretos|archivo)$/.test(orden)) { mostrar(RF.narrador.historial(estado), false); return; }

    const ent = orden.match(/^(?:entrenar|entrena|entrenar al bot|examen|examinar al bot|examinar)(?: (\d+))?$/);
    if (ent) { entrenarBot(ent[1] ? +ent[1] : 15); return; }
    if (/^(aprendido|lo aprendido|que has aprendido|que ha aprendido|memoria del bot|el bot)$/.test(orden)) { mostrar(bloquesAprendido(), false); return; }
    if (/^(olvidar lo aprendido|borrar lo aprendido|borrar aprendizaje)$/.test(orden)) { RF.aprendiz.olvidar(); mostrar([{ tipo: 'aprende', titulo: 'EL BOT OLVIDA', texto: 'El intérprete local olvida todo lo que aprendió en este navegador. Conserva lo que traía de fábrica.' }], false); return; }
    if (/^(exportar|exportar lo aprendido|exportar aprendizaje)$/.test(orden)) {
      mostrar([{ tipo: 'detalles', titulo: 'Lo aprendido (JSON para copiar)', hijos: [{ tipo: 'nota', texto: RF.aprendiz.exportar() }] }], false);
      return;
    }

    if (estado.fin) {
      mostrar([{ tipo: 'nota', texto: 'Tu gobierno ha terminado. Escribe "reiniciar" para empezar otra partida.' }], false);
      return;
    }

    const pend = RF.director.pendiente(estado);
    if (pend) {
      const m = orden.match(/^(?:opcion )?([1-3]|[abc])\)?$/);
      if (m) { const i = /\d/.test(m[1]) ? +m[1] - 1 : 'abc'.indexOf(m[1]); if (i < pend.opciones.length) { elegirOpcion(i); return; } }
      mostrar([{ tipo: 'nota', texto: 'Antes de firmar nada más, decide qué hacer con el evento "' + pend.titulo + '". Pulsa una opción o escribe A, B o C.' }], false);
      return;
    }

    if (/^(esperar|espera|pasar|pasar turno|siguiente turno|siguiente|no hacer nada|nada)$/.test(orden)) { esperar(); return; }

    if (consejoActivo()) { firmarIA(texto); return; }
    firmarLocal(texto);
  }

  // ---------- Controles ----------
  function montarAtajos() {
    const cont = $('chips');
    for (const [etiqueta, valor, esComando] of ATAJOS) {
      const b = el('button', 'chip' + (esComando ? ' cmd' : ''), etiqueta);
      b.type = 'button';
      b.addEventListener('click', () => {
        const input = $('decreto');
        if (esComando || !valor.endsWith(' ')) { vaciar(); procesar(valor); return; }
        input.value = valor;
        input.focus();
        try { input.setSelectionRange(valor.length, valor.length); } catch (e) { /* algunos navegadores no lo permiten */ }
      });
      cont.appendChild(b);
    }
  }

  function iniciar() {
    RF.interprete.entrenar();
    montarStats();
    montarAtajos();
    vigilarScroll();

    const guardada = cargar();
    if (guardada) {
      estado = guardada.estado;
      RF.poder.iniciar(estado);
      registro = [];
      // Una crónica que se quedó a medias al cerrar la página no se vuelve a mostrar.
      mostrar(guardada.registro.filter(b => b.tipo !== 'cronica' || b.terminada), false);
      mostrar([{ tipo: 'nota', texto: 'Partida recuperada. Bienvenido de vuelta a Palacio, Líder Supremo.' }], false);
      // Si había un evento abierto y su tarjeta no quedó en el registro, se vuelve a mostrar.
      const d = RF.director.pendiente(estado);
      if (d && !tarjetaAbierta) mostrar([RF.narrador.dilema(estado, d)], false);
      pintarStats();
      actualizarConsola();
    } else {
      reiniciar();
    }

    $('consola').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('decreto');
      const v = input.value;
      input.value = '';
      vaciar();
      procesar(v);
    });
    // Tocar la historia acelera el texto.
    $('registro').addEventListener('click', (e) => { if (!e.target.closest('button')) saltar = true; });
    $('ticker').addEventListener('click', () => { vaciar(); procesar('leyes'); });
    $('regimen').addEventListener('click', () => { vaciar(); procesar('sistema'); });
    $('boton-ia').addEventListener('click', mostrarConfigIA);
    pintarBotonIA();
    // Dentro de claude.ai, Claude puede narrar sin clave: se avisa una vez.
    RF.narradorIA.cuentaPromesa.then(fn => {
      pintarBotonIA();
      if (!fn || RF.narradorIA.config().activa) return;
      $('boton-ia').classList.add('aviso');
      mostrar([{ tipo: 'nota', texto: 'Estás jugando dentro de claude.ai: Claude puede entender tus decretos, decidir sus consecuencias y contar cada turno con tu cuenta, sin clave. Toca el botón IA de arriba para activarlo.' }], false);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})(globalThis.RF = globalThis.RF || {});
</script>
</body>
</html>
