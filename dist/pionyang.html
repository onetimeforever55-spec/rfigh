<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a100c">
<title>Consola de Pionyang</title>
<meta name="description" content="Gobierna Corea del Norte escribiendo decretos en una consola. Tus órdenes cambian el país y la vida de su gente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=VT323&display=swap">
<style>
/* Terminal presidencial: fósforo verde sobre negro; los decretos salen impresos en papel. */
:root {
  color-scheme: dark;
  --fondo: #0a100c;
  --fondo-2: #101a13;
  --linea: #1d3324;
  --fosforo: #62f59a;
  --fosforo-tenue: #3fa86c;
  --fosforo-oscuro: #22583a;
  --brillo: rgba(98, 245, 154, 0.35);
  --papel: #e9eddc;
  --tinta: #1f261d;
  --sello: #d0452f;
  --bien: #7fdcff;
  --mal: #ff6b52;
  --aviso: #ff9f43;
  --f-terminal: 'VT323', 'Courier New', monospace;
  --f-texto: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --f-papel: 'Special Elite', 'Courier New', Courier, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--fosforo);
  font-family: var(--f-texto);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.app {
  height: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    repeating-linear-gradient(to bottom, rgba(98, 245, 154, 0.025) 0 1px, transparent 1px 3px),
    var(--fondo);
}

/* ---------- Cabecera y barras del país ---------- */
.cabecera {
  flex: none;
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--linea);
  background: var(--fondo);
}
.cabecera-fila {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
/* Etiqueta del régimen junto al nombre del país: se pulsa para ver el sistema político. */
.regimen {
  font: inherit;
  font-family: var(--f-texto);
  font-size: 10px;
  letter-spacing: 0.1em;
  vertical-align: middle;
  margin-left: 6px;
  padding: 2px 6px;
  border: 1px solid var(--fosforo-oscuro);
  background: none;
  color: var(--fosforo-tenue);
  cursor: pointer;
  text-shadow: none;
}
.regimen:hover { color: var(--fosforo); border-color: var(--fosforo); }
.regimen.r-iliberal { color: var(--aviso); border-color: var(--aviso); }
.regimen.r-juche, .regimen.r-dictadura, .regimen.r-junta, .regimen.r-monarquia, .regimen.r-teocracia { color: var(--mal); border-color: var(--mal); }

.marca {
  font-family: var(--f-terminal);
  font-size: 26px;
  line-height: 1;
  letter-spacing: 0.04em;
  margin: 0;
  font-weight: 400;
  text-shadow: 0 0 8px var(--brillo);
}
.dia {
  white-space: nowrap;
  font-family: var(--f-terminal);
  font-size: 22px;
  line-height: 1;
  color: var(--fosforo-tenue);
  font-variant-numeric: tabular-nums;
}
.stats {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-nombre { font-size: 10px; letter-spacing: 0.08em; color: var(--fosforo-tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-valor { font-family: var(--f-terminal); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-barra { height: 4px; background: var(--linea); position: relative; overflow: hidden; }
.stat-relleno { position: absolute; inset: 0 auto 0 0; background: var(--fosforo); transition: width 0.6s ease; }
.stat.medio .stat-relleno { background: var(--aviso); }
.stat.medio .stat-valor { color: var(--aviso); }
.stat.bajo .stat-relleno { background: var(--mal); }
.stat.bajo .stat-valor { color: var(--mal); animation: parpadeo 1.2s steps(2) infinite; }
.stat .cambio {
  font-size: 10px; height: 12px; line-height: 12px; text-align: right;
  font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 0.3s;
}
.stat .cambio.visible { opacity: 1; }
.cambio.sube { color: var(--bien); }
.cambio.baja { color: var(--mal); }

@keyframes parpadeo { 50% { opacity: 0.45; } }

/* Línea del mercado bajo las barras: se pulsa para ver la economía. */
.ticker {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 3px 0 0;
  border: 0;
  border-top: 1px dashed var(--linea);
  background: none;
  color: var(--fosforo-tenue);
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.ticker:hover { color: var(--fosforo); }
.ticker.alerta { color: var(--aviso); }
.b-suceso.mercado .etiqueta { color: var(--bien); }
.b-suceso.institucion { border-style: dashed; }

/* ---------- Historia ---------- */
.registro {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.bloque { max-width: 65ch; }
.bloque p { margin: 0; white-space: pre-wrap; }
.etiqueta {
  display: block;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fosforo-tenue);
  margin-bottom: 2px;
}

.b-titulo {
  font-family: var(--f-terminal);
  font-size: 40px;
  line-height: 1;
  text-align: left;
  text-wrap: balance;
  text-shadow: 0 0 12px var(--brillo);
  margin-top: 8px;
}

.b-eco, .b-bot { display: flex; gap: 1ch; }
.b-eco { color: var(--fosforo); font-weight: 600; margin-top: 6px; }
.b-eco::before { content: '>'; color: var(--fosforo-tenue); flex: none; }

.b-bot { font-size: 12px; color: var(--fosforo-tenue); opacity: 0.75; letter-spacing: 0.02em; }
.b-bot::before { content: '▸'; flex: none; }

.b-nota { font-size: 13px; font-style: italic; color: var(--fosforo-tenue); }

/* La Gaceta Oficial: un papel impreso dentro de la terminal. */
.b-gaceta {
  position: relative;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--f-papel);
  padding: 14px 16px 16px;
  box-shadow: 0 2px 0 var(--fosforo-oscuro), 0 10px 24px rgba(0, 0, 0, 0.5);
  transform: rotate(-0.4deg);
  overflow: hidden;
}
.b-gaceta .etiqueta {
  padding-right: 110px;
  color: var(--tinta);
  opacity: 0.7;
  border-bottom: 1px dashed rgba(31, 38, 29, 0.4);
  padding-bottom: 4px;
  margin-bottom: 8px;
  font-family: var(--f-texto);
}
.b-gaceta p { font-size: 15px; line-height: 1.5; }
.sello {
  position: absolute;
  right: 10px;
  top: 8px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.1em;
  color: var(--sello);
  border: 2px solid var(--sello);
  padding: 0 6px;
  transform: rotate(8deg);
  opacity: 0.85;
  pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) {
  .sello { animation: sellar 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
}
@keyframes sellar {
  from { transform: rotate(8deg) scale(2.2); opacity: 0; }
  to { transform: rotate(8deg) scale(1); opacity: 0.85; }
}

.b-efectos { display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.b-efectos-grupo { display: flex; flex-direction: column; gap: 6px; }
.por-turno .efecto { border-style: dashed; }

/* Parte de las leyes vigentes: la lista de lo que cada ley ha hecho este turno. */
.b-leyes { font-size: 12.5px; padding: 8px 10px; border-left: 2px solid var(--fosforo-oscuro); background: var(--fondo-2); }
.b-logica { font-size: 13px; padding: 8px 12px; border: 1px dashed var(--fosforo-oscuro); background: var(--fondo-2); }
.b-logica .etiqueta { color: var(--fosforo-tenue); letter-spacing: 0.08em; }
.b-logica p { white-space: pre-line; color: var(--fosforo); }
.b-leyes p { color: var(--fosforo-tenue); font-variant-numeric: tabular-nums; }
.efecto { padding: 1px 7px; border: 1px solid var(--linea); background: var(--fondo-2); white-space: nowrap; }
.efecto.sube { color: var(--bien); }
.efecto.baja { color: var(--mal); }
.efecto.neutro { color: var(--fosforo-tenue); }

.b-cupula, .b-calle, .b-ejercito { padding-left: 12px; border-left: 2px solid var(--fosforo-oscuro); }
.b-calle { border-left-style: dotted; }
.b-ejercito { border-left-color: var(--aviso); }
.b-ejercito .etiqueta { color: var(--aviso); }
/* Radio Pionyang: el locutor de propaganda. */
.b-radio { font-size: 13.5px; padding: 8px 12px; border: 1px solid var(--fosforo-oscuro); border-radius: 2px; background: rgba(98, 245, 154, 0.04); }
.b-radio .etiqueta::before { content: '◉ '; color: var(--mal); }
.b-radio p { font-style: italic; }
/* Subtítulos de sección dentro de la crónica con IA. */
.cronica-seccion { display: block; margin-top: 10px; font-family: var(--f-texto); font-size: 11px; letter-spacing: 0.1em; color: var(--fosforo-tenue); font-style: normal; }
.cronica-seccion:first-child { margin-top: 0; }

.b-suceso { padding: 10px 12px; background: var(--fondo-2); border: 1px solid var(--linea); }
.b-suceso.umbral { border-color: var(--mal); }
.b-suceso.umbral .etiqueta { color: var(--mal); }
.b-suceso.hito .etiqueta { color: var(--aviso); }
.b-suceso.mundo { border-left: 3px solid var(--fosforo-tenue); }
.b-suceso .mini { margin-top: 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.mini .sube { color: var(--bien); }
.mini .baja { color: var(--mal); }

.b-sistema { padding: 10px 12px; border: 1px dashed var(--fosforo-oscuro); font-size: 13px; }
.b-sistema.mono p { font-variant-numeric: tabular-nums; overflow-x: auto; white-space: pre; }

.b-fin {
  border: 3px double var(--sello);
  padding: 16px;
  color: var(--papel);
  background: rgba(208, 69, 47, 0.08);
}
.b-fin .etiqueta { font-family: var(--f-terminal); font-size: 30px; line-height: 1.1; letter-spacing: 0.06em; color: var(--sello); margin-bottom: 8px; }

/* Titulares de prensa: tres voces, tres tipografías de periódico en miniatura. */
.b-prensa { font-size: 13px; }
.b-prensa p { color: var(--fosforo-tenue); }
.b-prensa p::first-line { color: var(--fosforo); }

/* Separador de día: amanece. */
.b-amanecer { border-top: 1px solid var(--linea); padding-top: 10px; margin-top: 6px; }
.b-amanecer .etiqueta { font-family: var(--f-terminal); font-size: 22px; letter-spacing: 0.08em; color: var(--fosforo); }
.b-amanecer p { font-style: italic; color: var(--fosforo-tenue); font-size: 14px; }

.b-suceso.decision { border-color: var(--fosforo-oscuro); border-left: 3px solid var(--fosforo); }

/* Cambio de régimen: un aviso solemne entre el decreto y la calle. */
.b-regimen { border-top: 3px double var(--mal); border-bottom: 3px double var(--mal); padding: 10px 0; }
.b-regimen .etiqueta { font-family: var(--f-terminal); font-size: 22px; line-height: 1.15; letter-spacing: 0.06em; color: var(--mal); margin-bottom: 6px; }
.b-suceso.escandalo { border-color: var(--mal); background: rgba(255, 107, 82, 0.06); }
.b-suceso.escandalo .etiqueta { color: var(--mal); }

/* Crónica escrita por la IA: el texto principal del turno. */
.b-cronica { padding: 12px 14px; border-left: 3px solid var(--fosforo); background: var(--fondo-2); }
.b-cronica .etiqueta { color: var(--fosforo); }
.b-cronica p { font-size: 15px; line-height: 1.65; }

/* Panel de la clave de la API. */
.cabecera-der { display: flex; align-items: baseline; gap: 10px; }
/* Botón de la IA en la cabecera: apagado en tenue, encendido brilla. */
.boton-ia {
  font: inherit; font-family: var(--f-terminal); font-size: 18px; line-height: 1;
  padding: 3px 8px; background: none; cursor: pointer; white-space: nowrap;
  color: var(--fosforo-tenue); border: 1px dashed var(--fosforo-oscuro);
}
.boton-ia:hover, .boton-ia:focus-visible { color: var(--fosforo); border-color: var(--fosforo); }
.boton-ia.aviso { color: var(--fosforo); border-color: var(--fosforo); animation: latido 1.6s ease-in-out infinite; }
@keyframes latido { 50% { box-shadow: 0 0 12px var(--brillo); } }
@media (prefers-reduced-motion: reduce) { .boton-ia.aviso { animation: none; } }
.boton-ia.on { color: var(--fondo); background: var(--fosforo); border: 1px solid var(--fosforo); box-shadow: 0 0 10px var(--brillo); }

/* El cuadro donde se pega la clave. */
.modal-ia {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(3, 8, 5, 0.82);
  display: flex; align-items: flex-start; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px 16px;
  overflow-y: auto;
}
.modal-ia[hidden] { display: none; }
.caja-ia {
  width: 100%; max-width: 480px; margin-top: 6vh;
  background: var(--fondo-2); border: 1px solid var(--fosforo);
  box-shadow: 0 0 0 4px var(--fondo), 0 0 0 5px var(--fosforo-oscuro), 0 0 30px rgba(98, 245, 154, 0.15);
  padding: 14px 16px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.cab-ia { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--linea); padding-bottom: 8px; }
.cab-ia h2 { margin: 0; font-family: var(--f-terminal); font-weight: 400; font-size: 24px; line-height: 1; letter-spacing: 0.05em; text-shadow: 0 0 8px var(--brillo); }
.cerrar-ia { font: inherit; font-size: 18px; background: none; border: 0; color: var(--fosforo-tenue); cursor: pointer; padding: 4px 8px; min-width: 44px; min-height: 36px; }
.cerrar-ia:hover { color: var(--fosforo); }
.intro-ia { margin: 0; font-size: 14px; }
.aviso-ia { margin: 0; font-size: 12px; color: var(--aviso); }
.form-ia { display: flex; flex-direction: column; gap: 6px; }
.form-ia label { font-size: 12px; color: var(--fosforo-tenue); letter-spacing: 0.04em; }
.fuentes-ia { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fuentes-ia[hidden], .seccion-ia[hidden] { display: none; }
.fuentes-ia legend { font-size: 12px; color: var(--fosforo-tenue); letter-spacing: 0.04em; padding: 0; margin-bottom: 4px; }
.fuente-ia { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--fosforo-oscuro); cursor: pointer; color: var(--fosforo) !important; font-size: 14px !important; }
.fuente-ia:has(input:checked) { border-color: var(--fosforo); background: rgba(98, 245, 154, 0.06); }
.fuente-ia input { margin-top: 3px; accent-color: var(--fosforo); width: 18px; height: 18px; flex: none; }
.fuente-ia strong { display: block; font-weight: 600; }
.fuente-ia small { display: block; font-size: 12px; color: var(--fosforo-tenue); }
.seccion-ia { display: flex; flex-direction: column; gap: 6px; }
.fila-clave { display: flex; gap: 6px; }
.fila-clave input { flex: 1; min-width: 0; }
.form-ia input[type="password"], .form-ia input[type="text"], .form-ia select {
  font: inherit; font-size: 16px; color: var(--fosforo); background: var(--fondo);
  border: 1px solid var(--fosforo-oscuro); padding: 10px; border-radius: 0; width: 100%;
}
.form-ia input:focus, .form-ia select:focus { outline: none; border-color: var(--fosforo); box-shadow: 0 0 0 1px var(--fosforo); }
.form-ia select:disabled { opacity: 0.5; }
.detectado-ia { margin: 0; min-height: 1.4em; font-size: 13px; color: var(--fosforo); }
.detectado-ia.mal { color: var(--aviso); }
.form-ia .fila-ia { font-size: 14px; color: var(--fosforo); display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.form-ia .sub-ia { font-size: 12px; color: var(--fosforo-tenue); margin-left: 24px; margin-top: 0; }
.form-ia .sub-ia:has(input:disabled) { opacity: 0.5; }
.consola.ocupada .boton { opacity: 0.5; }
.form-ia .fila-ia input { width: 18px; height: 18px; accent-color: var(--fosforo); }
.botones-ia { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.guardar-ia { color: var(--fondo) !important; background: var(--fosforo) !important; border-color: var(--fosforo) !important; }
.estado-ia { margin: 0; font-size: 13px; color: var(--fosforo-tenue); min-height: 1.4em; }
.guia-ia { font-size: 13px; color: var(--fosforo-tenue); border-top: 1px solid var(--linea); padding-top: 8px; }
.guia-ia summary { cursor: pointer; color: var(--fosforo); }
.guia-ia p { margin: 6px 0 0; }

/* Evento con decisión (estilo Victoria 2): marco doble y opciones con sus efectos. */
.b-dilema {
  border: 3px double var(--fosforo);
  background: var(--fondo-2);
  padding: 14px 14px 12px;
  box-shadow: 0 0 0 1px var(--fondo), 0 0 24px rgba(98, 245, 154, 0.12);
}
.b-dilema .etiqueta { font-family: var(--f-terminal); font-size: 24px; line-height: 1.1; letter-spacing: 0.06em; color: var(--fosforo); margin-bottom: 8px; text-shadow: 0 0 8px var(--brillo); }
.b-dilema > p { margin-bottom: 12px; }
.dilema-opciones { display: flex; flex-direction: column; gap: 8px; }
.dilema-op {
  font: inherit;
  text-align: left;
  color: var(--fosforo);
  background: var(--fondo);
  border: 1px solid var(--fosforo-oscuro);
  padding: 9px 11px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
  touch-action: manipulation;
}
.dilema-op:hover:not(:disabled) { border-color: var(--fosforo); }
.dilema-op:disabled { cursor: default; opacity: 0.35; }
.dilema-op.elegida { opacity: 1; border-color: var(--fosforo); background: rgba(98, 245, 154, 0.08); }
.dilema-op .op-texto { font-weight: 600; font-size: 14px; }
.dilema-op .op-letra { color: var(--fosforo-tenue); margin-right: 6px; }
.dilema-op .op-efectos { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
.op-efectos .sube { color: var(--bien); }
.op-efectos .baja { color: var(--mal); }
.op-efectos .aviso { color: var(--aviso); }
.aviso-pendiente .boton { background: var(--fosforo-oscuro); border-color: var(--fosforo-oscuro); }

.opciones { display: flex; flex-direction: column; gap: 8px; }
.opcion, .chip, .boton {
  font: inherit;
  color: var(--fosforo);
  background: var(--fondo-2);
  border: 1px solid var(--fosforo-oscuro);
  cursor: pointer;
  touch-action: manipulation;
}
.opcion { text-align: left; padding: 10px 12px; font-size: 14px; }
.opcion::before { content: '[ ] '; color: var(--fosforo-tenue); }
.opcion:hover { border-color: var(--fosforo); }
.opcion:disabled { opacity: 0.4; cursor: default; }
.opcion.elegida { opacity: 1; border-color: var(--fosforo); }
.opcion.elegida::before { content: '[x] '; }

.cursor::after {
  content: '▌';
  animation: parpadeo 0.8s steps(2) infinite;
  margin-left: 1px;
}

/* ---------- Consola ---------- */
.consola {
  flex: none;
  border-top: 1px solid var(--linea);
  background: var(--fondo);
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 0 16px;
}
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 13px; padding: 5px 10px; white-space: nowrap; }
.chip.cmd { color: var(--fosforo-tenue); border-style: dashed; }
.chip:hover { border-color: var(--fosforo); }

.linea-orden { display: flex; align-items: stretch; gap: 8px; }
.prompt { font-family: var(--f-terminal); font-size: 26px; line-height: 44px; color: var(--fosforo-tenue); }
#decreto {
  flex: 1;
  min-width: 0;
  font-family: var(--f-texto);
  font-size: 16px;
  color: var(--fosforo);
  background: var(--fondo-2);
  border: 1px solid var(--fosforo-oscuro);
  padding: 0 10px;
  height: 44px;
  caret-color: var(--fosforo);
  border-radius: 0;
}
#decreto::placeholder { color: var(--fosforo-oscuro); }
.boton {
  flex: none;
  padding: 0 14px;
  height: 44px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.06em;
  background: var(--sello);
  color: var(--papel);
  border-color: var(--sello);
}
.boton:disabled { opacity: 0.5; }

:focus-visible { outline: 2px solid var(--aviso); outline-offset: 2px; }
#decreto:focus-visible { outline-offset: 0; }

@media (max-width: 420px) {
  .stat-nombre { font-size: 9px; letter-spacing: 0.02em; }
  .stat-valor { font-size: 24px; }
  .stats { gap: 8px; }
  .b-titulo { font-size: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  .stat-relleno { transition: none; }
  .stat.bajo .stat-valor, .cursor::after { animation: none; }
}

.b-consejo { border-left: 3px solid var(--fosforo-oscuro); padding: 8px 12px; }
.b-consejo .etiqueta { color: var(--fosforo-tenue); }
.b-consejo p { white-space: pre-line; }
.b-consejo p.pensando, .b-cronica p.pensando { color: var(--fosforo-tenue); font-style: italic; }

/* Botón para volver al final cuando el jugador ha subido a leer mientras se escribía texto nuevo. */
.ir-abajo {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; z-index: 5;
  font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer;
  color: var(--fondo); background: var(--fosforo); border: 0; box-shadow: 0 0 12px var(--brillo);
}
.ir-abajo[hidden] { display: none; }

/* Relaciones exteriores tras un decreto. */
.b-exterior { font-size: 12.5px; padding: 8px 10px; border-left: 2px solid var(--aviso); background: var(--fondo-2); }
.b-exterior .etiqueta { color: var(--aviso); }
.b-exterior p { white-space: pre-line; font-variant-numeric: tabular-nums; }
.b-suceso.diplomacia { border-left: 3px solid var(--aviso); }

/* Los bloques del registro nunca se encogen (si no, la Gaceta, que recorta su contenido, se quedaba en una línea). */
.registro > * { flex-shrink: 0; }

/* Letra pequeña del turno: plegada por defecto. */
.b-detalles details { border-top: 1px dashed var(--fosforo-oscuro); padding-top: 6px; }
.b-detalles summary { cursor: pointer; font-size: 12px; letter-spacing: 0.08em; color: var(--fosforo-tenue); text-transform: uppercase; list-style: none; }
.b-detalles summary::-webkit-details-marker { display: none; }
.b-detalles summary::before { content: '▸ '; }
.b-detalles details[open] summary::before { content: '▾ '; }
.b-detalles details > .bloque { margin-top: 10px; font-size: 13px; }

/* POR QUÉ: los conceptos que explican el decreto. */
.b-aprende { font-size: 12px; padding: 4px 12px; border-left: 2px dashed var(--fosforo-tenue); }

.b-porque p { white-space: pre-line; color: var(--fosforo); }
.b-porque p::first-letter { color: var(--fosforo); }

    </div>
  </form>
</div>

<script>
// js/texto.js
/*
 * Utilidades de texto: normalizar, separar palabras, raíces (stemming),
 * corrección de faltas y la mini-gramática que usa el Narrador.
 */
(function (RF) {
  'use strict';

  // Palabras que no aportan significado al decreto.
  const VACIAS = new Set((
    'el la los las lo un una unos unas de del al a en y e o u que se por para con sin ' +
    'su sus tu tus es son ser sea sean esta este estos estas ese esa eso esos esas ' +
    'aquel aquella muy pero como cuando donde desde hasta sobre entre hacia le les me te nos ' +
    'ha han he hay todo todos toda todas partir hoy dia adelante decreto decreta decreto ' +
    'ordeno ordena ordenamos quiero queremos sera seran va van vamos ahora nuevo nueva ' +
    'pais nacion nacional ciudadanos gente pueblo excelencia'
  ).split(/\s+/));

  // Negaciones que pueden dar la vuelta a un decreto ("ya no se vende el agua").
  const NEGACIONES = new Set(['no', 'nunca', 'jamas', 'dejar', 'dejen', 'deja', 'dejara', 'dejaran', 'basta']);

  const SUFIJOS = [
    'aciones', 'iciones', 'amiento', 'imiento', 'mente', 'acion', 'icion',
    'ando', 'iendo', 'ados', 'adas', 'idos', 'idas', 'ado', 'ada', 'ido', 'ida',
    'aran', 'eran', 'iran', 'aron', 'ieron', 'aras', 'eras', 'ara', 'era', 'ira',
    'ar', 'er', 'ir', 'an', 'en', 'as', 'es', 'os', 'a', 'e', 'o', 's'
  ];

  function normalizar(txt) {
    return String(txt || '')
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9%\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function palabras(txt) {
    const n = normalizar(txt);
    return n ? n.split(' ') : [];
  }

  function raiz(p) {
    if (p.length <= 4) return p;
    for (const s of SUFIJOS) {
      if (p.endsWith(s) && p.length - s.length >= 4) return p.slice(0, p.length - s.length);
    }
    return p;
  }

  function distancia(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let minFila = i;
      for (let j = 1; j <= b.length; j++) {
        const c = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c);
        if (cur[j] < minFila) minFila = cur[j];
      }
      if (minFila > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  // Corrige una palabra desconocida con la más parecida del vocabulario.
  // Palabras reales que el bot no conoce pero no son faltas: no se "corrigen" ("caminar" no es "cambiar",
  // "volar" no es "votar"). Son las que más salen en los decretos absurdos.
  const REALES = new Set((
    'caminar camine caminen volar vuele vuelen nadar bailar bailen cantar canten llorar reir rian correr saltar dormir duerman ' +
    'soñar besar abrazar silbar gritar hablar hablen callar comer coman beber fumar respirar pensar leer escribir jugar pescar ' +
    'cazar cocinar llover llueva nevar sonreir estornudar bostezar toser rezar mentir amar odiar sentarse parpadear aplaudir ' +
    'peinar peinarse vestir desnudo desnudos desnudas lunes martes miercoles jueves viernes sabado sabados domingo domingos ' +
    'luna sol lluvia nubes nube viento vientos gatos gato perro perros loro loros palomas paloma patos pato vaca vacas cabra ' +
    'cabras gallina gallinas burro burros caballo caballos mono monos peces sombrero sombreros bigote bigotes barba barbas ' +
    'calcetines zapatos corbata corbatas pijama pijamas colores rojo azul verde amarillo rosado morado musica himno baile ' +
    'chiste chistes risa risas tristeza gravedad tiempo reloj relojes numero numeros impares pares letra letras nombre ' +
    'nombres apellido apellidos cumpleaños navidad siesta queso helado helados chocolate mango mangos piña espejo espejos ' +
    'paraguas bicicleta bicicletas patines globo globos pelota pelotas futbol beisbol dados cartas ajedrez hacia atras ' +
    'adelante izquierda derecha cabeza pies manos ojos orejas nariz dientes calvo calvos zurdo zurdos gordo ' +
    'gordos flaco flacos feos bonitos altos bajos abuelas abuelos niños niñas bebes payaso payasos magos brujas fantasmas ' +
    'extraterrestres marcianos dragones unicornios sirenas vampiros zombis piratas ninjas robots'
  ).split(' '));

  function corregir(p, vocab) {
    if (p.length < 4 || vocab.has(p) || VACIAS.has(p) || NEGACIONES.has(p) || REALES.has(p) || /\d/.test(p)) return p;
    const max = p.length <= 6 ? 1 : 2;
    let mejor = p, mejorD = max + 1;
    for (const v of vocab) {
      if (v[0] !== p[0]) continue; // las faltas reales casi nunca cambian la primera letra
      const d = distancia(p, v, max);
      if (d < mejorD) { mejor = v; mejorD = d; if (d === 1 && max === 1) break; }
    }
    return mejorD <= max ? mejor : p;
  }

  function azar(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

  // Mini-gramática: [a|b|c] elige una opción al azar, {var} inserta variables.
  function expandir(plantilla, vars) {
    let t = plantilla;
    const re = /\[([^\[\]]*)\]/;
    let m, guardia = 0;
    while ((m = re.exec(t)) && guardia++ < 200) {
      t = t.slice(0, m.index) + azar(m[1].split('|')) + t.slice(m.index + m[0].length);
    }
    // Variables globales (nombres de los ministros actuales) + las de esta llamada.
    const todas = Object.assign({}, RF.VARS || {}, vars || {});
    return t.replace(/\{(\w+)\}/g, (_, k) => (todas[k] != null ? todas[k] : '{' + k + '}'))
      .replace(/\b([Aa]) el\b/g, '$1l').replace(/\b([Dd])e el\b/g, '$1el'); // "a el aire" -> "al aire"
  }

  function de(nombre) { return /^el /i.test(nombre) ? 'del ' + nombre.slice(3) : 'de ' + nombre; }
  function a(nombre) { return /^el /i.test(nombre) ? 'al ' + nombre.slice(3) : 'a ' + nombre; }
  function mayus(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }

  RF.VARS = RF.VARS || {
    garrote: 'Jang', n_garrote: 'Mariscal Jang Tae-bok', cifuentes: 'Pak', n_cifuentes: 'Pak Mi-ran',
    sombra: 'Ryu', n_sombra: 'Ryu Chang-sok', paredes: 'Kang', n_paredes: 'Kang Myong-dal',
    montiel: 'Ri', n_montiel: 'Ri Song-mi', ventura: 'Yun', n_ventura: 'Dr. Yun Jae-hyon', lider: 'Líder Supremo'
  };

  RF.texto = { VACIAS, NEGACIONES, normalizar, palabras, raiz, distancia, corregir, azar, expandir, de, a, mayus };
})(globalThis.RF = globalThis.RF || {});

    {

    {

/*
 * EL APRENDIZ
 * El intérprete local aprende de la IA. Cada vez que el Consejo con IA entiende un decreto, devuelve
 * también su "clave": cómo lo clasificaría el bot local (acción + objeto, o tema + dirección) y qué
 * conceptos de la biblioteca explican sus consecuencias. El aprendiz la guarda y la usa de dos formas:
 *   - como EJEMPLO: se añade a los clasificadores Naive Bayes, que se reentrenan con él (y sus palabras
 *     entran en el vocabulario, para que el corrector no las "arregle");
 *   - como RECUERDO: si luego se escribe un decreto igual o muy parecido, se entiende igual que lo
 *     entendió la IA, con sus mismos conceptos, aunque la IA esté apagada.
 * El comando "entrenar" le pone un examen: la IA inventa decretos variados, el bot intenta entenderlos,
 * y los que falla se aprenden.
 * Lo aprendido vive en este navegador (localStorage); datos/aprendidos.js trae una base ya enseñada.
 */

  'use strict';
  const T = RF.texto;
  const CLAVE = 'pionyang-aprendiz-v1';
  const MAX = 600;
  const SIMILAR = 0.65;
  const NIEGAN = new Set(['no', 'nunca', 'jamas', 'nadie', 'ningun', 'ninguna', 'sin']);

  let propios = null; // lo aprendido en este navegador

  function raices(texto) {
    return new Set(T.palabras(T.normalizar(texto)).filter(p => !T.VACIAS.has(p) || NIEGAN.has(p)).map(T.raiz));
  }

  function similitud(a, b) {
    if (!a.size || !b.size) return 0;
    let comun = 0;
    for (const r of a) if (b.has(r)) comun++;
    return comun / (a.size + b.size - comun);
  }

  // Una etiqueta solo vale si usa las piezas que el motor conoce.
  function validar(et) {
    if (!et || typeof et !== 'object') return null;
    const up = x => (typeof x === 'string' ? x.trim().toUpperCase() : '');
    const conceptos = (Array.isArray(et.conceptos) ? et.conceptos : [])
      .filter(id => typeof id === 'string' && (RF.CONCEPTOS || []).some(k => k.id === id)).slice(0, 3);
    const tema = up(et.tema);
    if (tema && RF.TEMAS && RF.TEMAS[tema]) {
      const dir = et.dir === 'contra' ? 'contra' : et.dir === 'privada' && RF.TEMAS[tema].privada ? 'privada' : 'favor';
      return { tema, dir, conceptos };
    }
    const accion = up(et.accion), objeto = up(et.objeto);
    if (RF.ACCIONES[accion] && RF.OBJETOS[objeto] && !['OTRO', 'ULTIMA'].includes(objeto)) return { accion, objeto, conceptos };
    return null;
  }

    if (propios) return propios;

      const d = JSON.parse(localStorage.getItem(CLAVE) || '[]');
      if (Array.isArray(d)) for (const x of d) { const et = validar(x); if (et && x.texto) propios.push(completar(x.texto, et, x.origen || 'ia')); }

      // En democracia, el Congreso puede tumbar una ley polémica si no tienes votos.
      res.bloqueada = true;
      RF.director.forzar(estado, 'congreso_bloquea', { interp: Object.assign({}, interp), medida: laMedida });
      res.dilema = 'congreso_bloquea';
      res.notas.push('La ley necesita pasar por el Congreso y no tienes votos: solo cuentas con el ' + Math.round(estado.politica.apoyo) + '% de apoyo.');
    } else {
      // Represión en secreto: la gente no sabe lo que pasa (todavía).
      if (interp.secreto && accion === 'CASTIGAR' && o.gente) {
        if (def.porTurno.felicidad) def.porTurno.felicidad *= 0.4;
        if (def.inicial.felicidad) def.inicial.felicidad *= 0.3;
        def.secreta = true;
        laMedida = 'la persecución secreta ' + T.de(nombre);
        RF.politica.registrarSecreto(estado, { tipo: 'represion', descripcion: laMedida, gravedad: 3, clave: def.clave });
        res.secreto = true;
        res.notas.push('Nadie lo sabe... todavía. Cada turno existe la posibilidad de que salga a la luz.');
      }
      const p = RF.leyes.promulgar(estado, def, accion, laMedida);
      Object.assign(inicial, p.inicial);
      res.ley = p.ley;
      res.porTurno = RF.leyes.efectoNominal(p.ley);
      res.curvas = p.ley.curvas;
      res.notas.push(...p.notas, ...def.notas);
      if (p.sustituye && RF.ACCIONES[accion].inversa === p.sustituye.accion) sumar(inicial, 'estabilidad', -1);
      if (def.texto) res.especial = def.texto;
      // Lo que traen los temas duros más adelante (sanciones, fugas, inundaciones...).
      programarTema(estado, def, res);
      if (def.economia) ajustarEconomia(estado, def.economia, res.notas);
      if (def.relaciones && RF.diplomacia) res.relaciones = RF.diplomacia.ajustar(estado, def.relaciones, res.notas);
      RF.politica.tras(estado, def, accion, objId);
      const lat = RF.politica.efectoLateral(estado, accion, objId);
      if (lat) res.cambioRegimen = lat;
    }
    res.medida = laMedida;
    if (def && def.prensa) res.prensa = def.prensa;
    // Un cambio de régimen con padrino extranjero: el padrino lo agradece; sus rivales, no tanto.
    if (interp.padrino && res.cambioRegimen && RF.diplomacia) {
      const pad = interp.padrino, P = RF.PAIS.relaciones[pad];
      const cambios = { [pad]: 12 };
      if (pad !== 'china') cambios.china = -6; else cambios.eeuu = -6;
      RF.diplomacia.ajustar(estado, cambios, res.notas);
      res.notas.push('Lo haces con el apoyo de ' + P.nombre + ': en su capital lo celebran como un éxito propio. ' + (pad !== 'china' ? 'En Pekín, no tanto.' : 'En Washington, no tanto.'));
      aplicarEfectos(estado, pad === 'eeuu' ? { dinero: 10, ejercito: -4 } : { dinero: 5 }, res.deltas);
    }
    // El arsenal nuclear, y el país contra el que apunta un misil o una guerra ("lanzar un misil a Japón").
    if (RF.diplomacia && interp.tema && !res.bloqueada) {
      const D = RF.diplomacia.iniciar(estado);
      if (interp.tema === 'NUCLEAR') D.arsenal = accion !== 'PROHIBIR';
      const blanco = ['MISILES', 'GUERRA', 'NUCLEAR'].includes(interp.tema) && accion !== 'PROHIBIR' && RF.diplomacia.objetivo(T.normalizar(interp.texto || ''));
      if (blanco) {
        const extra = RF.diplomacia.ajustar(estado, { [blanco]: interp.tema === 'GUERRA' ? -25 : -12 }, res.notas);
        res.relaciones = Object.assign(res.relaciones || {}, { [blanco]: ((res.relaciones || {})[blanco] || 0) + (extra[blanco] || 0) });
      }
    }
    res.vars = { objeto: nombre, Objeto: T.mayus(nombre), medida: laMedida, Medida: T.mayus(laMedida), lider: 'Líder Supremo' };

    // Combinaciones con historia propia ("vender el aire").
    const especial = !res.derogada && RF.ESPECIALES[accion + ':' + objId];
    if (especial) {
      for (const [k, v] of Object.entries(convertir(especial.efectos))) sumar(inicial, k, v);
      if (especial.texto && !res.especial) res.especial = T.expandir(especial.texto, res.vars);
      for (const p of especial.programar || []) estado.pendientes.push(Object.assign({}, p, { texto: T.expandir(p.texto, res.vars), dia: estado.dia + p.en }));
      res.programadas = (especial.programar || []).length;
    }

    // Decretos sobre algo que el juego no conoce: el Estado los cumple con una lógica absurda pero coherente.
    const grupo = { PROHIBIR: 'prohibir', CASTIGAR: 'prohibir', OBLIGAR: 'obligar', CREAR: 'crear', INVERTIR: 'crear', GLORIFICAR: 'crear', SUBSIDIAR: 'crear', LEGALIZAR: 'crear', ENFOCAR: 'crear', PRIVATIZAR: 'vender', SUBIR_IMPUESTO: 'impuesto' }[accion];
    const logica = (objId === 'OTRO' || ['CALENDARIO', 'ROPA', 'MASCOTAS'].includes(objId)) && !especial && !res.derogada && !res.bloqueada && def && !def.derogar && RF.ABSURDO.logica[grupo];
    if (logica) {
      if (!res.especial) res.especial = T.expandir(T.azar(logica.gaceta), res.vars);
      const c = T.azar(logica.consecuencias);
      estado.pendientes.push({ dia: estado.dia + c.en, titulo: T.expandir(c.titulo, res.vars), texto: T.expandir(T.azar(c.textos), res.vars), efectos: c.efectos });
      res.programadas = 1;
    }

    const factor = op.secundario ? 0.75 : 1;
    for (const k of Object.keys(inicial)) inicial[k] *= factor;
    // Los conceptos: mecanismos reales que ajustan un poco las consecuencias según la situación, y explican el porqué.
    if (RF.conceptosDe && !res.bloqueada) {
      const k = RF.conceptosDe({ e: estado, accion, objeto: objId, o, tema: interp.tema, dir: interp.dir, n: T.normalizar(interp.texto || ''), res, extra: interp.conceptosExtra });
      aplicarConceptos(estado, k, res, inicial);
    }
    aplicarEfectos(estado, inicial, res.deltas);

    // Lo que ha cambiado en las relaciones exteriores con este decreto (venga de donde venga).
    if (antesRel) {
      const ahora = estado.diplomacia.relaciones, dif = {};
      for (const k of Object.keys(ahora)) { const d = Math.round(ahora[k] - antesRel[k]); if (d) dif[k] = d; }
      res.relaciones = Object.keys(dif).length ? dif : null;
    }
    estado.historial.push({ dia: estado.dia, accion, objeto: objId, nombreObjeto: nombre, medida: laMedida, texto: interp.texto });
    res.numero = estado.historial.length;
    reacciones(estado, res, objId);
    if (op.avanzar !== false) avanzarDia(estado, res);
    return res;
  }

  /*
   * Decreto sobre una persona: "matar a Jang", "encarcelar a Chol-su", "premiar a la canciller".
   * Algunos dejan huella varios turnos (un mártir, el miedo en Palacio, el luto de un barrio).
   */
  function decretarPersona(estado, interp, op) {
    op = op || {};
    const t = RF.poder.tratar(estado, interp.persona, interp.trato, interp.caido, interp.secreto);
    const res = { dia: estado.dia, tipo: 'persona', persona: interp.persona, trato: interp.trato, deltas: {}, sucesos: [], notas: t.notas.slice(), vars: { lider: 'Líder Supremo' } };
    if (t.nulo) { res.nulo = t.nulo; return res; }
    res.medida = t.medida;
    res.nombreObjeto = t.nombre;
    res.vars = { objeto: t.nombre, Objeto: t.nombre, medida: t.medida, Medida: T.mayus(t.medida), lider: 'Líder Supremo' };
    res.especial = t.texto;
    res.sucesor = t.sucesor || null;
    // En democracia, un crimen a la vista de todos pesa más.
    const tipoPersona = RF.PERSONAS[interp.persona].tipo;
    const publico = !t.secreto && (interp.trato === 'matar' || (['encarcelar', 'exiliar'].includes(interp.trato) && tipoPersona !== 'ciudadano'));
    const factor = (op.secundario ? 0.75 : 1) * (publico && RF.politica.esDemocracia(estado) ? 1.3 : 1);
    const efectos = convertir(t.efectos);
    for (const k of Object.keys(efectos)) efectos[k] *= factor;
    if (RF.conceptosDe) aplicarConceptos(estado, RF.conceptosDe({ e: estado, accion: 'PERSONA', objeto: interp.persona, o: null, n: T.normalizar(interp.texto || ''), res: Object.assign(res, { trato: interp.trato, persona: interp.persona }) }), res, efectos);
    aplicarEfectos(estado, efectos, res.deltas);
    if (t.ley) {
      const p = RF.leyes.promulgar(estado, t.ley, 'PERSONA', t.ley.nombre);
      res.ley = p.ley;
      res.porTurno = RF.leyes.efectoNominal(p.ley);
      res.notas.push('Esto dejará huella durante ' + t.ley.duracion + ' turnos: ' + t.ley.nombre + '.');
    }
    for (const clave of t.derogar || []) RF.leyes.derogar(estado, clave);
    if (t.secreto) {
      RF.politica.registrarSecreto(estado, t.secreto);
      res.secreto = true;
      res.notas.push('Oficialmente fue un accidente. Cada turno existe la posibilidad de que se descubra la verdad.');
    } else if (publico) {
      const gravedad = { opositor: 3, extranjero: 3, ministro: 2, ciudadano: 2 }[tipoPersona] || 2;
      if (RF.politica.crimenPublico(estado, gravedad)) {
        res.dilema = 'juicio_politico';
        res.notas.push('En una democracia, hacer esto a la vista de todos tiene un precio: el Congreso abre un juicio político contra ti.');
      }
    }
    if (t.cadena) estado.dilemas.cadena.push({ id: t.cadena.id, dia: estado.dia + t.cadena.en });
    estado.historial.push({ dia: estado.dia, accion: 'PERSONA', objeto: interp.persona, nombreObjeto: t.nombre, medida: t.medida, texto: interp.texto });
    res.numero = estado.historial.length;
    const tipo = RF.PERSONAS[interp.persona].tipo;
    reacciones(estado, res, tipo === 'opositor' ? 'OPOSICION' : tipo === 'extranjero' ? 'EXTRANJEROS' : 'LIDER');
    if (op.avanzar !== false) avanzarDia(estado, res);
    return res;
  }

  // Aplica los ajustes de los conceptos activos y guarda sus explicaciones.
  function aplicarConceptos(estado, k, res, inicial) {
    for (const { a } of k.ajustes) {
      if (!a) continue;
      if (a.efectos) for (const [kk, v] of Object.entries(convertir(a.efectos))) sumar(inicial, kk, v);
      if (a.economia) ajustarEconomia(estado, a.economia, null);
      if (a.relaciones && RF.diplomacia) RF.diplomacia.ajustar(estado, a.relaciones);
      if (a.factorLey && res.ley) res.ley.factor = Math.round((res.ley.factor || 1) * a.factorLey * 100) / 100;
    }
    res.porque = k.porque;
    res.conceptos = k.activos.map(x => x.id);
  }

  // Lo que un tema trae más adelante (con sus sanciones y relaciones).
  function programarTema(estado, def, res) {
    for (const pr of def.programar || []) estado.pendientes.push(Object.assign({}, pr, { dia: estado.dia + pr.en, texto: T.expandir(pr.texto) }));
    if ((def.programar || []).length) res.programadas = def.programar.length;
  }

  /*
   * Un gesto diplomático: "negociar con Estados Unidos", "insultar a Japón", "pedir ayuda a China".
   * Cambia relaciones (y a veces divisas, precios o el ánimo del ejército) y queda en el historial.
   */
  function decretarDiplomacia(estado, interp, op) {
    const g = RF.diplomacia.gesto(estado, interp.pais, interp.dir);
    const nombre = RF.PAIS.relaciones[interp.pais].nombre;
    const res = { tipo: 'diplomacia', dia: estado.dia, pais: interp.pais, dir: interp.dir, deltas: {}, porTurno: null, sucesos: [], notas: g.notas.slice(),
      medida: g.medida, nombreObjeto: nombre, especial: g.texto };
    res.vars = { objeto: nombre, Objeto: nombre, medida: g.medida, Medida: T.mayus(g.medida), lider: 'Líder Supremo' };
    const efectos = convertir(g.efectos);
    if (op.secundario) for (const k of Object.keys(efectos)) efectos[k] *= 0.75;
    aplicarEfectos(estado, efectos, res.deltas);
    res.relaciones = RF.diplomacia.ajustar(estado, g.relaciones, res.notas);
    if (g.sanciones) ajustarEconomia(estado, { sanciones: g.sanciones }, res.notas);
    estado.historial.push({ dia: estado.dia, accion: 'DIPLOMACIA', objeto: interp.pais, nombreObjeto: nombre, medida: g.medida, texto: interp.texto });
    res.numero = estado.historial.length;
    reacciones(estado, res, 'EXTRANJEROS');
    if (op.avanzar !== false) avanzarDia(estado, res);
    return res;
  }

  // Pasa un turno: leyes vigentes, economía, consecuencias, personajes, alertas y eventos.
  function avanzarDia(estado, res) {
    const s = estado.stats;
    asegurar(estado);
    const sec = estado.sectores, ec = estado.economia, P = RF.PAIS.economia;
    estado.dia++;

    // 1. Todas las leyes vigentes actúan.
    const L = RF.leyes.turno(estado);
    res.leyesTurno = L.detalle;

    // 2. La economía de fondo y cómo se afectan las cuatro cosas entre sí.
    const m = RF.politica.mods(estado);
    // Lo que va por el mercado negro no paga impuestos; las sanciones cuestan divisas cada turno.
    const ingresos = P.ingresos * (1 - ec.mercadoNegro / 200) * m.recaudacion * Math.max(0.5, Math.min(1.3, 0.6 + s.estabilidad / 150)) * Math.max(0.4, 1 - s.inflacion / 250);
    const gastos = P.gastos * (1 + s.inflacion / 100);
    const sanciones = ec.sanciones * P.costeSancion;
    const miedo = RF.leyes.miedo(estado);
    const crisis = { total: 0, lista: [] };
    const golpe = (v, t) => { crisis.total += v; crisis.lista.push(t); };
    if (sec.ejercito <= 10) golpe((11 - sec.ejercito) * 0.6, 'El ejército está al borde del golpe: los cuarteles no obedecen y la estabilidad se desploma.');
    if (sec.elite <= 10) golpe((11 - sec.elite) * 0.5, 'El Palacio conspira abiertamente: la estabilidad se desploma.');
    if (s.felicidad <= 10) golpe((11 - s.felicidad) * 0.6 * (1 - miedo), 'La población está en las calles' + (miedo > 0.3 ? ', aunque el miedo contiene a muchos' : '') + ': la estabilidad se desploma.');
    if (s.inflacion >= 200) golpe(Math.min(8, (s.inflacion - 150) / 60), 'Hiperinflación: nadie acepta wones y el Estado no puede pagar a nadie.');
    if (estado.diasEnQuiebra >= 1) golpe(4 + 2 * estado.diasEnQuiebra, 'Quiebra: no hay con qué pagar a soldados ni funcionarios.');
    res.miedo = miedo;
    const deuda = s.dinero < 0;
    const presion = L.total.inflacion + (deuda ? Math.min(12, -s.dinero / 15) : 0) + Math.max(0, s.inflacion - 40) * 0.12;
    const nuevaInflacion = Math.max(0, s.inflacion * 0.8 + 0.8 + presion);
    const fondo = {
      dinero: ingresos - gastos + m.dineroTurno - sanciones,
      // El mercado negro ayuda a la gente a sobrevivir cuando el Estado no llega.
      felicidad: -Math.max(0, s.inflacion - 8) / 18 + (50 - s.felicidad) * 0.04 + m.felicidadTurno + (ec.mercadoNegro - 40) / 100,
      // La estabilidad depende de los tres sectores: la población, el ejército y el Palacio.
      // El miedo (la represión) tapa el descontento de la gente: estabilidad artificial.
      estabilidad: (m.estabilidadBase - s.estabilidad) * 0.03
        + (s.felicidad < 40 ? -(40 - s.felicidad) / 8 * (1 - miedo) : s.felicidad > 70 ? 0.5 : 0)
        + (sec.ejercito - 50) * 0.04 + (sec.elite - 50) * 0.03
        + (s.inflacion > 30 ? -(s.inflacion - 30) / 20 : 0)
        + (deuda ? -1 : 0) + (s.dinero < -100 ? -2 : 0)
        // Crisis: ya no terminan la partida por sí solas, pero hunden la estabilidad hasta que caes.
        - crisis.total,
      // Los sectores vuelven poco a poco a su punto de equilibrio. Sin sueldo, el ejército se enfada;
      // sin lujos importados, la élite también. Los cuadros viven de los sobornos del mercado negro.
      ejercito: (50 - sec.ejercito) * 0.04 + (deuda ? -1.5 : 0) + (s.inflacion > 30 ? -0.5 : 0) + (RF.politica.regimen(estado) === 'JUNTA' ? 0.5 : 0),
      elite: (50 - sec.elite) * 0.04 + (deuda ? -0.5 : 0) - ec.sanciones * 0.2 + (ec.mercadoNegro > 50 ? 0.3 : 0)
    };
    res.fondo = fondo;
    res.causas = [];
    if (deuda) res.causas.push('Hay deuda: el Banco Central imprime para pagarla (más inflación) y los soldados y funcionarios cobran tarde.');
    if (sanciones) res.causas.push('Sanciones de nivel ' + ec.sanciones + ': cuestan ' + Math.round(sanciones * 10) / 10 + 'M de divisas cada turno y la élite se queda sin lujos.');
    if (sec.ejercito < 30) res.causas.push('El ejército está descontento: resta estabilidad cada turno. Si se hunde, empujará al golpe.');
    if (sec.elite < 30) res.causas.push('En Palacio se conspira: la élite resta estabilidad cada turno. Si se hunde, te traicionarán.');
    if (s.inflacion > 30) res.causas.push('La inflación del ' + Math.round(s.inflacion) + '% encarece todo y amarga a la gente.');
    if (s.felicidad < 40) res.causas.push(miedo >= 0.3 ? 'La población no aguanta más, pero la represión la mantiene callada: el descontento apenas resta estabilidad.' : 'La población no aguanta más: el descontento resta estabilidad cada turno.');
    res.causas.push(...crisis.lista);
    if (s.inflacion > 40) res.causas.push('Los precios se retroalimentan: todos suben precios porque esperan que suban.');

    // Las potencias vecinas: comercio con China, petróleo, ayuda del Sur, sanciones de Washington.
    const ext = RF.diplomacia ? RF.diplomacia.turno(estado, res) : { dinero: 0, inflacion: 0, felicidad: 0, elite: 0 };
    res.exterior = ext;
    const cambio = {
      dinero: fondo.dinero + L.total.dinero + ext.dinero,
      inflacion: nuevaInflacion - s.inflacion + ext.inflacion,
      felicidad: fondo.felicidad + L.total.felicidad + ext.felicidad,
      estabilidad: fondo.estabilidad + L.total.estabilidad,
      ejercito: fondo.ejercito + (L.total.ejercito || 0),
      elite: fondo.elite + (L.total.elite || 0) + ext.elite
    };
    res.cambioTurno = {};
    aplicarEfectos(estado, cambio, res.cambioTurno);
    res.balance = cambio.dinero;
    estado.balance = cambio.dinero;
    for (const c of Object.values(estado.ciudadanos)) c.animo = Math.max(-100, Math.min(100, c.animo + (res.cambioTurno.felicidad || 0) * 0.8));

    if (estado.politica.regimen !== 'DEMOCRACIA') res.causas.push(m.nombre + ': recaudación ' + Math.round(m.recaudacion * 100) + '%, ' + (m.dineroTurno < 0 ? 'sanciones y gastos del régimen ' + m.dineroTurno + 'M' : 'sin ayudas del exterior') + ', población ' + (m.felicidadTurno >= 0 ? '+' : '') + m.felicidadTurno + ' por turno.');

    // El sistema político: el Congreso, los secretos que salen a la luz, las legislativas.
    RF.politica.turno(estado, res);

    // 3. Consecuencias programadas que tocan hoy.
    const hoy = estado.pendientes.filter(p => p.dia <= estado.dia);
    estado.pendientes = estado.pendientes.filter(p => p.dia > estado.dia);
    for (const p of hoy) {
      const reg = {};
      aplicarEfectos(estado, p.efectos, reg);
      if (p.sanciones) ajustarEconomia(estado, { sanciones: p.sanciones });
      if (p.relaciones && RF.diplomacia) RF.diplomacia.ajustar(estado, p.relaciones);
      res.sucesos.push({ tipo: 'consecuencia', titulo: p.titulo, texto: T.expandir(p.texto), deltas: reg });
    }

    // 4. La gente de a pie.
    for (const [id, c] of Object.entries(estado.ciudadanos)) {
      if (c.estado !== 'libre') continue;
      for (const h of RF.CIUDADANOS[id].hitos) {
        if (c.hitos.includes(h.id)) continue;
        if ((h.bajo != null && c.animo <= h.bajo) || (h.alto != null && c.animo >= h.alto)) {
          c.hitos.push(h.id);
          const reg = {};
          aplicarEfectos(estado, h.efectos, reg);
          res.sucesos.push({ tipo: 'hito', titulo: RF.CIUDADANOS[id].nombre, texto: T.expandir(h.texto), deltas: reg });
        }
      }
    }

    // 5. Alertas cuando algo cruza una línea roja.
    for (const u of RF.UMBRALES) {
      const v = u.stat in s ? s[u.stat] : estado.sectores[u.stat];
      const cruza = u.bajo != null ? v < u.bajo : v > u.alto;
      const vuelve = u.bajo != null ? v >= u.bajo + 10 : v <= u.alto * 0.7;
      if (cruza && !estado.umbrales[u.id]) {
        estado.umbrales[u.id] = true;
        const reg = {};
        aplicarEfectos(estado, u.efectos, reg);
        res.sucesos.push({ tipo: 'umbral', titulo: u.titulo, texto: T.expandir(u.texto), deltas: reg });
      } else if (vuelve) estado.umbrales[u.id] = false;
    }

    // 6. Eventos con decisiones y noticias sueltas.
    const dilema = !comprobarFin(estado) && RF.director ? RF.director.comprobar(estado) : null;
    if (dilema) res.dilema = dilema.id;
    else if (RF.director.pendiente(estado)) res.dilema = RF.director.pendiente(estado).id;
    if (res.sucesos.length || dilema) estado.diasSinEvento = 0;
    else estado.diasSinEvento++;
    // Las noticias sueltas al azar no pintan nada cuando la IA lleva la historia.
    if (!dilema && !estado.iaActiva && estado.diasSinEvento >= 4 && Math.random() < 0.4) {
      const ev = T.azar(RF.AZAR);
      const reg = {};
      aplicarEfectos(estado, ev.efectos, reg);
      res.sucesos.push({ tipo: 'azar', titulo: ev.titulo, texto: T.expandir(ev.texto), deltas: reg });
      estado.diasSinEvento = 0;

      },
      {
        tipo: 'sistema', titulo: 'CÓMO SE JUEGA',
        texto: 'Escribe cualquier orden y pulsa Decretar: "vender carbón a China", "lanzar un misil", "prohibir los lunes", "negociar con Estados Unidos".\n' +
          'Todo se cumple, y cada ley sigue actuando cada turno. Solo pierdes si la ESTABILIDAD llega a 0.\n' +
          'Escribe "ayuda" para las reglas completas, "estado" para ver el país.'
      },
      {
        // Quién es quién: plegado, para quien quiera leerlo.
        tipo: 'detalles', titulo: 'Quién es quién',
        hijos: [
          {
            tipo: 'cupula', titulo: 'TU GABINETE',
            texto: Object.entries(RF.GABINETE).map(([id, m]) => RF.poder.ministro(estado, id).nombre + ', ' + m.cargo.toLowerCase()).join('. ') + '.'
          },
          {
            tipo: 'prensa', titulo: 'LOS DE FUERA Y LOS DE DENTRO',
            texto: 'Song Dae-ho dirige una red clandestina que reparte memorias USB con series del Sur. China compra tu carbón y te presta paciencia. La ONU prepara otra ronda de sanciones. El embajador sueco observa con cara de preocupación.'
          },
          {
            tipo: 'calle', titulo: 'EN LA CALLE',
            texto: Object.values(RF.CIUDADANOS).map(c => c.presentacion).join('\n\n')
          }
        ]
      }
    ];
  }

  // ---------- Las secciones del turno: RADIO, PALACIO, EJÉRCITO y POBLACIÓN ----------
  // Cada sector tiene un ánimo que empuja la estabilidad; la cabecera de su sección lo enseña.
  function cabecera(estado, id, res) {
    const S = RF.PAIS.sectores[id];
    const v = id === 'poblacion' ? estado.stats.felicidad : (estado.sectores || {})[id];
    const k = id === 'poblacion' ? 'felicidad' : id;
    const cambio = ((((res && res.deltas) || {})[k]) || 0) + 3 * ((((res && res.porTurno) || {})[k]) || 0);
    const flecha = cambio >= 1 ? ' ▲' : cambio <= -1 ? ' ▼' : '';
    return S.seccion + ' · ÁNIMO ' + Math.round(v) + flecha;
  }

  function radio(res, tipo) {
    const R = RF.RADIO;
    const frases = R.tipos[tipo] || R.tipos.general;
    // Corta: la frase del día y, a veces, un saludo o una despedida (nunca las dos).
    let t = T.expandir(T.azar(frases), res.vars);
    const r = Math.random();
    if (r < 0.2) t = T.azar(R.saludo) + ' ' + t;
    else if (r < 0.4) t += ' ' + T.azar(R.despedida);
    return T.expandir(t);
  }

  function lineaEjercito(estado, res) {
    const d = res.deltas || {}, pt = res.porTurno || {};
    const impacto = (d.ejercito || 0) + 3 * (pt.ejercito || 0) + 0.5 * (d.estabilidad || 0);
    const pool = impacto >= 1.5 ? RF.VOCES_EJERCITO.pos : impacto <= -1.5 ? RF.VOCES_EJERCITO.neg : RF.VOCES_EJERCITO.neu;
    return T.expandir(T.azar(pool), res.vars);
  }

  // La radio y UNA sección: la del sector al que más le ha tocado este turno (menos texto, más jugo).
  function secciones(estado, res, tipo) {
    const out = [{ tipo: 'radio', titulo: RF.PAIS.radio, texto: radio(res, tipo) }];
    const d = res.deltas || {}, pt = res.porTurno || {};
    const peso = k => Math.abs(d[k] || 0) + 3 * Math.abs(pt[k] || 0);
    const lc = lineaCiudadano(estado, res);
    const candidatos = [
      { id: 'poblacion', v: peso('felicidad') + 0.5, bloque: () => lc && { tipo: 'calle', titulo: cabecera(estado, 'poblacion', res), texto: lc.texto } },
      { id: 'ejercito', v: peso('ejercito'), bloque: () => ({ tipo: 'ejercito', titulo: cabecera(estado, 'ejercito', res), texto: lineaEjercito(estado, res) }) },
      { id: 'elite', v: peso('elite') + 0.3, bloque: () => ({ tipo: 'cupula', titulo: cabecera(estado, 'elite', res), texto: lineaMinistro(estado, res).texto }) }
    ].sort((a, b) => b.v - a.v);
    for (const c of candidatos) { const b = c.bloque(); if (b) { out.push(b); break; } }
    return out;
  }

  /*
   * Lo que se ve de un turno: lo divertido arriba y la letra pequeña plegada.
   * Visible: la Gaceta, los efectos, el Informe del Consejo, la radio y la sección, los sucesos, los eventos,
   * los cambios de régimen, las alertas graves y el final. Plegado: intérprete, notas, relaciones, leyes, causas.
   */
  const VISIBLES = new Set(['gaceta', 'efectos', 'logica', 'porque', 'radio', 'cupula', 'ejercito', 'calle', 'suceso', 'dilema', 'regimen', 'fin', 'cronica', 'eco', 'aprende']);
  const GRAVE = /desploma|quiebra|golpe|Congreso|bloque|juicio|secreto|Nadie lo sabe/i;
  function compactar(bloques) {
    const vis = [], letra = [];
    for (const b of bloques) {
      if (b.tipo === 'amanecer') continue; // el número de turno ya está arriba
      if (b.tipo === 'efectos' && b.rotulo === 'Resultado del turno') { letra.push(b); continue; }
      if (VISIBLES.has(b.tipo) || (b.tipo === 'nota' && GRAVE.test(b.texto || '') && vis.filter(x => x.tipo === 'nota').length < 2)) vis.push(b);
      else letra.push(b);
    }
    if (letra.length) {
      const d = { tipo: 'detalles', titulo: 'Letra pequeña', hijos: letra };
      const i = vis.findIndex(b => b.tipo === 'dilema' || b.tipo === 'fin');
      vis.splice(i === -1 ? vis.length : i, 0, d);
    }
    return vis;
  }

  function lineaMinistro(estado, res) {
    const m = res.ministro;
    if (!m) return { titulo: 'EL GABINETE', texto: 'El gabinete escucha el decreto en silencio. Nadie sabe muy bien para qué sirve, pero todos aplauden.' };
    const min = RF.GABINETE[m.id];
    let texto = T.expandir(T.azar(m.delta > 0 ? min.pos : min.neg), res.vars);
    if (RF.consejero.lealtad(estado, m.id) < 30 && Math.random() < 0.6) texto += ' ' + T.expandir(T.azar(min.bajo), res.vars);
    return { titulo: RF.poder.ministro(estado, m.id).nombre.toUpperCase() + ' · ' + min.cargo.toUpperCase(), texto };
  }

  function lineaCiudadano(estado, res) {
    if (!res.ciudadano) return null;
    const id = res.ciudadano.id;
    const c = RF.CIUDADANOS[id];
    const est = estado.ciudadanos[id];
    let texto = T.expandir(T.azar(c[res.ciudadano.sentimiento]), res.vars);
    est.presentado = true; // ya se presentan todos en la introducción
    return { titulo: 'LA CALLE · ' + c.nombre.toUpperCase(), texto };
  }

  // Tipo de decreto, para elegir titulares y voces que encajen.
  function tipoDecreto(accion, objId) {
    const o = RF.consejero.objetoDe(objId);
    const E = o.esencial || 0, L = o.libertad || 0;
    if (objId === 'OTRO' || ((accion === 'PROHIBIR' || accion === 'OBLIGAR') && ['CALENDARIO', 'ROPA', 'MASCOTAS', 'AIRE'].includes(objId))) return 'absurdo';
    if (accion === 'GLORIFICAR') return 'culto';
    if (accion === 'ENFOCAR' || objId === 'DINERO') return 'economia';
    if (o.institucion) return ['ESCUADRON', 'MILICIA', 'ESPIAS'].includes(objId) ? 'represion' : 'culto';
    if (o.regimen) return o.regimen === 'DEMOCRACIA' || ['PROHIBIR', 'DEROGAR'].includes(accion) ? 'regalo' : 'libertad';
    if (o.politico) return ['LEGALIZAR', 'CREAR', 'INVERTIR'].includes(accion) ? 'regalo' : 'libertad';
    if (accion === 'CASTIGAR' && o.gente) return 'represion';
    if ((accion === 'PROHIBIR' || accion === 'OBLIGAR' || accion === 'CASTIGAR') && L >= 1) return 'libertad';
    if (['PRIVATIZAR', 'RECORTAR', 'PROHIBIR'].includes(accion) && E >= 2) return 'esencial';
    if (accion === 'SUBSIDIAR' || (accion === 'BAJAR_IMPUESTO' && o.faccion !== 'cupula') || accion === 'LEGALIZAR') return 'regalo';
    if (accion === 'SUBIR_IMPUESTO') return 'impuesto';
    if (accion === 'INVERTIR') return 'obra';
    if (accion === 'PRIVATIZAR' || accion === 'NACIONALIZAR' || accion === 'BAJAR_IMPUESTO') return 'economia';
    return 'general';
  }

  function deFuente(fuente, tipo) {
    const f = RF.PRENSA[fuente];
    return f[tipo] || f.general;
  }

  function titulares(res, tipo) {
    const lineas = [RF.PRENSA.oficial.nombre + ': ' + T.expandir(T.azar(deFuente('oficial', tipo)), res.vars)];
    const d = res.deltas;
    const pt = res.porTurno || {};
    const est = (d.estabilidad || 0) + 3 * (pt.estabilidad || 0);
    if (Math.abs(est) >= 2 || Math.random() < 0.5) lineas.push(RF.PRENSA.extranjera.nombre + ': ' + T.expandir(T.azar(deFuente('extranjera', tipo)), res.vars));
    if ((res.impacto || 0) < 0 || tipo === 'culto' || tipo === 'absurdo' || Math.random() < 0.3) lineas.push(RF.PRENSA.pirata.nombre + ': ' + T.expandir(T.azar(deFuente('pirata', tipo)), res.vars));
    return lineas.join('\n');
  }

  function vozDeLaCalle(res, tipo) {
    if (tipo === 'absurdo' && Math.random() < 0.5) return T.expandir(T.azar(RF.ABSURDO.calle), res.vars);
    const sent = (res.impacto || 0) >= 2 ? 'pos' : 'neg';
    const pool = RF.VOCES[sent][tipo] || RF.VOCES[sent].general;
    return '—' + T.expandir(T.azar(pool), res.vars) + ' — dice ' + T.azar(RF.VOCES_QUIEN) + '.';
  }

  function eco(estado, res) {
    const previos = estado.historial.slice(0, -1).slice(-6).filter(h => h.medida !== res.medida);
    if (!previos.length) return null;
    return T.expandir(T.azar(RF.ECOS), { anterior: T.azar(previos).medida });
  }

  function ambiente(estado) {
    const s = estado.stats;
    let pool = RF.AMBIENTE.normal;
    if (s.inflacion > 30) pool = RF.AMBIENTE.inflacion;
    else if (s.dinero < 0) pool = RF.AMBIENTE.tesoro;
    else if (s.estabilidad < 30) pool = Math.random() < 0.5 ? RF.AMBIENTE.ejercito : RF.AMBIENTE.orden;
    else if (s.felicidad < 30) pool = RF.AMBIENTE.pueblo;
    else if (s.felicidad > 60 && s.estabilidad > 55) pool = RF.AMBIENTE.bien;
    return T.expandir(T.azar(pool));
  }

  // Todo lo que cuenta un decreto: Gaceta, números, prensa, gabinete y calle.
  const TIPO_TRATO = { matar: 'represion', encarcelar: 'represion', exiliar: 'libertad', destituir: 'general', premiar: 'culto', liberar: 'regalo' };

  function decretoPersona(estado, interp, res) {
    const bloques = [];
    const partes = ['INTÉRPRETE › ' + RF.poder.nombreTrato(res.trato).toUpperCase() + ' + ' + res.nombreObjeto.toUpperCase()];
    if (interp.heredada) partes.push('orden heredada de la frase anterior');
    bloques.push({ tipo: 'bot', texto: partes.join(' · ') });
    bloques.push({ tipo: 'gaceta', titulo: (res.secreto ? 'ORDEN RESERVADA Nº ' : 'ORDEN EJECUTIVA Nº ') + res.numero + ' · TURNO ' + res.dia, texto: T.mayus(res.medida) + '. ' + res.especial });
    bloques.push({ tipo: 'efectos', deltas: res.deltas, porTurno: res.porTurno });
    const pq = bloquePorque(res);
    if (pq) bloques.push(pq);
    for (const nota of res.notas) bloques.push({ tipo: 'nota', texto: nota });
    const tipo = res.secreto ? 'secreto' : TIPO_TRATO[res.trato] || 'general';
    bloques.push(...secciones(estado, res, tipo));
    return bloques;
  }

  // Cómo han cambiado las relaciones con las potencias vecinas.
  function bloqueExterior(estado, relaciones) {
    const ids = Object.keys(relaciones || {}).filter(id => relaciones[id]);
    if (!ids.length || !RF.diplomacia) return null;
    const lineas = ids.map(id => {
      const v = Math.round(RF.diplomacia.rel(estado, id));
      const d = relaciones[id];
      return RF.PAIS.relaciones[id].nombre + ': ' + (d > 0 ? '+' : '−') + Math.abs(d) + ' → ' + v + ' (' + RF.diplomacia.etiqueta(v) + ')';
    });
    return { tipo: 'exterior', titulo: 'RELACIONES EXTERIORES', texto: lineas.join('\n') };
  }

  // POR QUÉ: los conceptos que han actuado en este decreto.
  function bloquePorque(res) {
    if (!res.porque || !res.porque.length) return null;
    return { tipo: 'porque', titulo: 'POR QUÉ', texto: res.porque.map(p => p.texto).join('\n') };
  }

  function decretoDiplomacia(estado, interp, res) {
    const bloques = [{ tipo: 'bot', texto: 'INTÉRPRETE › DIPLOMACIA · ' + res.medida.toUpperCase() }];
    bloques.push({ tipo: 'gaceta', titulo: 'NOTA DIPLOMÁTICA Nº ' + res.numero + ' · TURNO ' + res.dia, texto: T.mayus(res.medida) + '. ' + res.especial });
    bloques.push({ tipo: 'efectos', deltas: res.deltas, porTurno: null });
    for (const nota of res.notas) bloques.push({ tipo: 'nota', texto: nota });
    const ex = bloqueExterior(estado, res.relaciones);
    if (ex) bloques.push(ex);
    bloques.push(...secciones(estado, res, res.dir === 'hostil' ? 'culto' : 'regalo'));
    return bloques;
  }

  function decreto(estado, interp, res) {
    if (res.tipo === 'persona') return decretoPersona(estado, interp, res);
    if (res.tipo === 'diplomacia') return decretoDiplomacia(estado, interp, res);
    const bloques = [];
    const partes = [interp.tema ? 'INTÉRPRETE › ' + res.medida.toUpperCase() : 'INTÉRPRETE › ' + RF.ACCIONES[res.accion].nombre.toUpperCase() + ' + ' + (res.objeto === 'OTRO' ? '"' + res.nombreObjeto + '" (desconocido)' : res.nombreObjeto.toUpperCase())];
    if (interp.confianza != null) partes.push(interp.confianza + '% seguro');
    if (interp.heredada) partes.push('acción heredada de la frase anterior');
    if (interp.negado) partes.push('negación detectada');
    if (interp.intensidad > 1) partes.push('intensidad alta');
    if (interp.intensidad < 1) partes.push('intensidad baja');
    if (interp.aprendido) partes.push(interp.aprendido.origen === 'palabras' ? 'usé palabras que me enseñó la IA' : 'lo recordé: me lo enseñó la IA' + (interp.aprendido.sim < 1 ? ' con otras palabras («' + interp.aprendido.de + '»)' : ''));
    if (interp.corregidas && interp.corregidas.length) partes.push('corregí ' + interp.corregidas.map(([a, b]) => a + '→' + b).join(', '));
    bloques.push({ tipo: 'bot', texto: partes.join(' · ') });

    const tipo = res.secreto ? 'secreto' : res.prensa || tipoDecreto(res.accion, res.objeto);
    let gaceta = T.mayus(res.medida) + '.';
    if (res.especial) gaceta += ' ' + res.especial;
    else if (res.objeto === 'OTRO') gaceta += ' ' + T.expandir(T.azar(RF.ABSURDO.gaceta), res.vars);
    const cabecera = res.bloqueada ? 'PROYECTO DE LEY Nº ' : res.secreto ? 'ORDEN RESERVADA Nº ' : 'DECRETO Nº ';
    if (res.bloqueada) gaceta += ' El proyecto llega al Congreso... y se atasca.';
    bloques.push({ tipo: 'gaceta', titulo: cabecera + res.numero + ' · TURNO ' + res.dia, texto: gaceta });
    bloques.push({ tipo: 'efectos', deltas: res.deltas, porTurno: res.porTurno, curvas: res.curvas, nivel: res.ley && res.ley.nivel });
    const pq = bloquePorque(res);
    if (pq) bloques.push(pq);
    for (const nota of res.notas) bloques.push({ tipo: 'nota', texto: nota });

    const ex = bloqueExterior(estado, res.relaciones);
    if (ex) bloques.push(ex);
    bloques.push(...secciones(estado, res, tipo));
    if (res.cambioRegimen) bloques.push(bloqueRegimen(res.cambioRegimen));
    return bloques;
  }

  // El parte del turno: qué ha hecho cada ley vigente, la economía de fondo y el resultado.
  function parteLeyes(estado, res) {
    const lineas = [];
    const detalle = (res.leyesTurno || []).slice().sort((a, b) => Math.abs(b.efectos.dinero || 0) - Math.abs(a.efectos.dinero || 0));
    for (const l of detalle.slice(0, 8)) {
      lineas.push(T.mayus(l.nombre) + (l.nivel > 1 ? ' (nivel ' + l.nivel + ')' : ''));
      lineas.push('   ' + RF.leyes.resumenLey(l.efectos));
    }
    if (detalle.length > 8) lineas.push('… y ' + (detalle.length - 8) + ' leyes más (escribe "leyes")');
    const f = res.fondo || {};
    lineas.push('Impuestos y gastos del Estado', '   ' + RF.leyes.resumenLey({ dinero: f.dinero, estabilidad: f.estabilidad, felicidad: f.felicidad }));
    return lineas.join('\n');
  }

  // Lo que pasa al terminar el turno: el parte de las leyes, las causas, los sucesos y cómo amanece.
  function cierreDia(estado, res) {
    const bloques = [];
    bloques.push({ tipo: 'leyes', titulo: 'LEYES VIGENTES · ESTE TURNO', texto: parteLeyes(estado, res) });
    bloques.push({ tipo: 'efectos', rotulo: 'Resultado del turno', deltas: res.cambioTurno || {} });
    for (const c of res.causas || []) bloques.push({ tipo: 'nota', texto: c });
    for (const s of res.sucesos) {
      const etiqueta = { consecuencia: 'CONSECUENCIA', hito: 'HISTORIAS', umbral: 'ALERTA', azar: 'NOTICIA', escandalo: 'ESCÁNDALO', politica: 'POLÍTICA', mundo: 'EN EL PAÍS', diplomacia: 'EXTERIOR' }[s.tipo] || 'NOTICIA';
      bloques.push({ tipo: 'suceso', clase: s.tipo, titulo: etiqueta + ' · ' + s.titulo.toUpperCase(), texto: s.texto, deltas: s.deltas });
    }
    if (res.fin) return bloques.concat(final(estado));
    if (res.programadas && !res.sucesos.length) bloques.push({ tipo: 'nota', texto: 'Radio Pasillo: dicen que esto todavía va a traer cola.' });
    bloques.push({ tipo: 'amanecer', titulo: 'TURNO ' + estado.dia, texto: ambiente(estado) });
    return bloques;
  }

  function turno(estado, interp, res) {
    return decreto(estado, interp, res).concat(cierreDia(estado, res));
  }

  // Tarjeta de un dilema: el juego la dibuja con botones.
  function dilema(estado, d) {
    return {
      tipo: 'dilema', id: d.id, titulo: 'EVENTO · ' + d.titulo.toUpperCase(), texto: RF.director.texto(d, estado),
      opciones: d.opciones.map(op => ({ texto: T.expandir(op.texto), resumen: RF.director.resumen(op) }))
    };
  }

  function bloqueRegimen(cambio) {
    const a = RF.REGIMENES[cambio.a];
    return { tipo: 'regimen', titulo: 'CAMBIO DE RÉGIMEN · ' + RF.REGIMENES[cambio.de].corto + ' → ' + a.corto, texto: a.descripcion };
  }

  function decision(estado, r) {
    const bloques = [{ tipo: 'suceso', clase: 'decision', titulo: 'DECISIÓN · ' + (r.textoOpcion || T.expandir(r.opcion.texto)).toUpperCase(), texto: r.resultado, deltas: r.deltas }];
    if (r.decreto && r.decreto.porTurno) bloques.push({ tipo: 'efectos', rotulo: 'Ley aprobada', deltas: {}, porTurno: r.decreto.porTurno, curvas: r.decreto.curvas });
    const ex = bloqueExterior(estado, r.relaciones);
    if (ex) bloques.push(ex);
    if (r.cambio) bloques.push(bloqueRegimen(r.cambio));
    if (r.fin) bloques.push(...final(estado));
    return bloques;
  }

  function diplomacia(estado) {
    return [{ tipo: 'sistema', titulo: 'RELACIONES EXTERIORES', texto: RF.diplomacia.resumen(estado), mono: true }];
  }

  function sistema(estado) {
    return [{ tipo: 'sistema', titulo: 'EL SISTEMA POLÍTICO', texto: RF.politica.resumen(estado) }];
  }

  function confuso(interp) {
    return [
      { tipo: 'bot', texto: 'INTÉRPRETE › no entendí el decreto' },
      { tipo: 'cupula', titulo: 'EL GABINETE', texto: T.expandir(T.azar(CONFUSOS)) },
      { tipo: 'nota', texto: 'Prueba algo como "' + T.azar(EJEMPLOS) + '".' }
    ];
  }

  function pregunta(interp) {
    if (interp.estado === 'preguntar_objeto') {
      return {
        bloques: [
          { tipo: 'bot', texto: 'INTÉRPRETE › entendí ' + RF.ACCIONES[interp.accion].nombre.toUpperCase() + ', pero no sobre qué' },
          { tipo: 'cupula', titulo: 'EL SECRETARIO', texto: '"' + RF.ACCIONES[interp.accion].nombre + '... ¿el qué, Líder Supremo?" El secretario espera con la pluma en el aire.' }
        ],
        opciones: []
      };
    }
    const opciones = interp.estado === 'preguntar_trato'
      ? interp.opciones.map(op => ({ etiqueta: RF.poder.nombreTrato(op.trato) + ' a ' + op.nombreObjeto, interp: op }))
      : interp.opciones.map(op => ({
        etiqueta: T.mayus(RF.consejero.medida(op.accion, op.nombreObjeto)),
        interp: Object.assign({}, interp, { estado: 'ok', accion: op.accion, objeto: op.objeto, nombreObjeto: op.nombreObjeto })
      }));
    const texto = opciones.length > 2
      ? '"¿Qué hacemos con ' + interp.nombreObjeto + ', Líder Supremo?"'
      : '"Disculpe, Líder Supremo. ¿Se refiere a ' + opciones.map(o => o.etiqueta.toLowerCase()).join(' o a ') + '?"';
    return {
      bloques: [
        { tipo: 'bot', texto: 'INTÉRPRETE › tengo dudas, pregunto antes de firmar' },
        { tipo: 'cupula', titulo: 'EL SECRETARIO', texto }
      ],
      opciones
    };
  }

  function formatoStat(id, v) {
