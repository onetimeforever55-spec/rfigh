<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a100c">
<title>Consola de Pionyang</title>
<meta name="description" content="Gobierna Corea del Norte escribiendo decretos en una consola. Tus órdenes cambian el país y la vida de su gente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=VT323&display=swap">
<style>
/* Terminal presidencial: fósforo verde sobre negro; los decretos salen impresos en papel. */
:root {
  color-scheme: dark;
  --fondo: #0a100c;
  --fondo-2: #101a13;
  --linea: #1d3324;
  --fosforo: #62f59a;
  --fosforo-tenue: #3fa86c;
  --fosforo-oscuro: #22583a;
  --brillo: rgba(98, 245, 154, 0.35);
  --papel: #e9eddc;
  --tinta: #1f261d;
  --sello: #d0452f;
  --bien: #7fdcff;
  --mal: #ff6b52;
  --aviso: #ff9f43;
  --f-terminal: 'VT323', 'Courier New', monospace;
  --f-texto: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --f-papel: 'Special Elite', 'Courier New', Courier, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--fosforo);
  font-family: var(--f-texto);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.app {
  height: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    repeating-linear-gradient(to bottom, rgba(98, 245, 154, 0.025) 0 1px, transparent 1px 3px),
    var(--fondo);
}

/* ---------- Cabecera y barras del país ---------- */
.cabecera {
  flex: none;
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--linea);
  background: var(--fondo);
}
.cabecera-fila {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
/* Etiqueta del régimen junto al nombre del país: se pulsa para ver el sistema político. */
.regimen {
  font: inherit;
  font-family: var(--f-texto);
  font-size: 10px;
  letter-spacing: 0.1em;
  vertical-align: middle;
  margin-left: 6px;
  padding: 2px 6px;
  border: 1px solid var(--fosforo-oscuro);
  background: none;
  color: var(--fosforo-tenue);
  cursor: pointer;
  text-shadow: none;
}
.regimen:hover { color: var(--fosforo); border-color: var(--fosforo); }
.regimen.r-iliberal { color: var(--aviso); border-color: var(--aviso); }
.regimen.r-juche, .regimen.r-dictadura, .regimen.r-junta, .regimen.r-monarquia, .regimen.r-teocracia { color: var(--mal); border-color: var(--mal); }

.marca {
  font-family: var(--f-terminal);
  font-size: 26px;
  line-height: 1;
  letter-spacing: 0.04em;
  margin: 0;
  font-weight: 400;
  text-shadow: 0 0 8px var(--brillo);
}
.dia {
  white-space: nowrap;
  font-family: var(--f-terminal);
  font-size: 22px;
  line-height: 1;
  color: var(--fosforo-tenue);
  font-variant-numeric: tabular-nums;
}
.stats {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-nombre { font-size: 10px; letter-spacing: 0.08em; color: var(--fosforo-tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-valor { font-family: var(--f-terminal); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-barra { height: 4px; background: var(--linea); position: relative; overflow: hidden; }
.stat-relleno { position: absolute; inset: 0 auto 0 0; background: var(--fosforo); transition: width 0.6s ease; }
.stat.medio .stat-relleno { background: var(--aviso); }
.stat.medio .stat-valor { color: var(--aviso); }
.stat.bajo .stat-relleno { background: var(--mal); }
.stat.bajo .stat-valor { color: var(--mal); animation: parpadeo 1.2s steps(2) infinite; }
.stat .cambio {
  font-size: 10px; height: 12px; line-height: 12px; text-align: right;
  font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 0.3s;
}
.stat .cambio.visible { opacity: 1; }
.cambio.sube { color: var(--bien); }
.cambio.baja { color: var(--mal); }

@keyframes parpadeo { 50% { opacity: 0.45; } }

/* Línea del mercado bajo las barras: se pulsa para ver la economía. */
.ticker {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 3px 0 0;
  border: 0;
  border-top: 1px dashed var(--linea);
  background: none;
  color: var(--fosforo-tenue);
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.ticker:hover { color: var(--fosforo); }
.ticker.alerta { color: var(--aviso); }
.b-suceso.mercado .etiqueta { color: var(--bien); }
.b-suceso.institucion { border-style: dashed; }

/* ---------- Historia ---------- */
.registro {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.bloque { max-width: 65ch; }
.bloque p { margin: 0; white-space: pre-wrap; }
.etiqueta {
  display: block;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fosforo-tenue);
  margin-bottom: 2px;
}

.b-titulo {
  font-family: var(--f-terminal);
  font-size: 40px;
  line-height: 1;
  text-align: left;
  text-wrap: balance;
  text-shadow: 0 0 12px var(--brillo);
  margin-top: 8px;
}

.b-eco, .b-bot { display: flex; gap: 1ch; }
.b-eco { color: var(--fosforo); font-weight: 600; margin-top: 6px; }
.b-eco::before { content: '>'; color: var(--fosforo-tenue); flex: none; }

.b-bot { font-size: 12px; color: var(--fosforo-tenue); opacity: 0.75; letter-spacing: 0.02em; }
.b-bot::before { content: '▸'; flex: none; }

.b-nota { font-size: 13px; font-style: italic; color: var(--fosforo-tenue); }

/* La Gaceta Oficial: un papel impreso dentro de la terminal. */
.b-gaceta {
  position: relative;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--f-papel);
  padding: 14px 16px 16px;
  box-shadow: 0 2px 0 var(--fosforo-oscuro), 0 10px 24px rgba(0, 0, 0, 0.5);
  transform: rotate(-0.4deg);
  overflow: hidden;
}
.b-gaceta .etiqueta {
  padding-right: 110px;
  color: var(--tinta);
  opacity: 0.7;
  border-bottom: 1px dashed rgba(31, 38, 29, 0.4);
  padding-bottom: 4px;
  margin-bottom: 8px;
  font-family: var(--f-texto);
}
.b-gaceta p { font-size: 15px; line-height: 1.5; }
.sello {
  position: absolute;
  right: 10px;
  top: 8px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.1em;
  color: var(--sello);
  border: 2px solid var(--sello);
  padding: 0 6px;
  transform: rotate(8deg);
  opacity: 0.85;
  pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) {
  .sello { animation: sellar 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
}
@keyframes sellar {
  from { transform: rotate(8deg) scale(2.2); opacity: 0; }
  to { transform: rotate(8deg) scale(1); opacity: 0.85; }
}

.b-efectos { display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.b-efectos-grupo { display: flex; flex-direction: column; gap: 6px; }
.por-turno .efecto { border-style: dashed; }

/* Parte de las leyes vigentes: la lista de lo que cada ley ha hecho este turno. */
.b-leyes { font-size: 12.5px; padding: 8px 10px; border-left: 2px solid var(--fosforo-oscuro); background: var(--fondo-2); }
.b-logica { font-size: 13px; padding: 8px 12px; border: 1px dashed var(--fosforo-oscuro); background: var(--fondo-2); }
.b-logica .etiqueta { color: var(--fosforo-tenue); letter-spacing: 0.08em; }
.b-logica p { white-space: pre-line; color: var(--fosforo); }
.b-leyes p { color: var(--fosforo-tenue); font-variant-numeric: tabular-nums; }
.efecto { padding: 1px 7px; border: 1px solid var(--linea); background: var(--fondo-2); white-space: nowrap; }
.efecto.sube { color: var(--bien); }
.efecto.baja { color: var(--mal); }
.efecto.neutro { color: var(--fosforo-tenue); }

.b-cupula, .b-calle { padding-left: 12px; border-left: 2px solid var(--fosforo-oscuro); }
.b-calle { border-left-style: dotted; }

.b-suceso { padding: 10px 12px; background: var(--fondo-2); border: 1px solid var(--linea); }
.b-suceso.umbral { border-color: var(--mal); }
.b-suceso.umbral .etiqueta { color: var(--mal); }
.b-suceso.hito .etiqueta { color: var(--aviso); }
.b-suceso.mundo { border-left: 3px solid var(--fosforo-tenue); }
.b-suceso .mini { margin-top: 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.mini .sube { color: var(--bien); }
.mini .baja { color: var(--mal); }

.b-sistema { padding: 10px 12px; border: 1px dashed var(--fosforo-oscuro); font-size: 13px; }
.b-sistema.mono p { font-variant-numeric: tabular-nums; overflow-x: auto; white-space: pre; }

.b-fin {
  border: 3px double var(--sello);
  padding: 16px;
  color: var(--papel);
  background: rgba(208, 69, 47, 0.08);
}
.b-fin .etiqueta { font-family: var(--f-terminal); font-size: 30px; line-height: 1.1; letter-spacing: 0.06em; color: var(--sello); margin-bottom: 8px; }

/* Titulares de prensa: tres voces, tres tipografías de periódico en miniatura. */
.b-prensa { font-size: 13px; }
.b-prensa p { color: var(--fosforo-tenue); }
.b-prensa p::first-line { color: var(--fosforo); }

/* Separador de día: amanece. */
.b-amanecer { border-top: 1px solid var(--linea); padding-top: 10px; margin-top: 6px; }
.b-amanecer .etiqueta { font-family: var(--f-terminal); font-size: 22px; letter-spacing: 0.08em; color: var(--fosforo); }
.b-amanecer p { font-style: italic; color: var(--fosforo-tenue); font-size: 14px; }

.b-suceso.decision { border-color: var(--fosforo-oscuro); border-left: 3px solid var(--fosforo); }

/* Cambio de régimen: un aviso solemne entre el decreto y la calle. */
.b-regimen { border-top: 3px double var(--mal); border-bottom: 3px double var(--mal); padding: 10px 0; }
.b-regimen .etiqueta { font-family: var(--f-terminal); font-size: 22px; line-height: 1.15; letter-spacing: 0.06em; color: var(--mal); margin-bottom: 6px; }
.b-suceso.escandalo { border-color: var(--mal); background: rgba(255, 107, 82, 0.06); }
.b-suceso.escandalo .etiqueta { color: var(--mal); }

/* Crónica escrita por la IA: el texto principal del turno. */
.b-cronica { padding: 12px 14px; border-left: 3px solid var(--fosforo); background: var(--fondo-2); }
.b-cronica .etiqueta { color: var(--fosforo); }
.b-cronica p { font-size: 15px; line-height: 1.65; }

/* Panel de la clave de la API. */
.cabecera-der { display: flex; align-items: baseline; gap: 10px; }
/* Botón de la IA en la cabecera: apagado en tenue, encendido brilla. */
.boton-ia {
  font: inherit; font-family: var(--f-terminal); font-size: 18px; line-height: 1;
  padding: 3px 8px; background: none; cursor: pointer; white-space: nowrap;
  color: var(--fosforo-tenue); border: 1px dashed var(--fosforo-oscuro);
}
.boton-ia:hover, .boton-ia:focus-visible { color: var(--fosforo); border-color: var(--fosforo); }
.boton-ia.aviso { color: var(--fosforo); border-color: var(--fosforo); animation: latido 1.6s ease-in-out infinite; }
@keyframes latido { 50% { box-shadow: 0 0 12px var(--brillo); } }
@media (prefers-reduced-motion: reduce) { .boton-ia.aviso { animation: none; } }
.boton-ia.on { color: var(--fondo); background: var(--fosforo); border: 1px solid var(--fosforo); box-shadow: 0 0 10px var(--brillo); }

/* El cuadro donde se pega la clave. */
.modal-ia {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(3, 8, 5, 0.82);
  display: flex; align-items: flex-start; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px 16px;
  overflow-y: auto;
}
.modal-ia[hidden] { display: none; }
.caja-ia {
  width: 100%; max-width: 480px; margin-top: 6vh;
  background: var(--fondo-2); border: 1px solid var(--fosforo);
  box-shadow: 0 0 0 4px var(--fondo), 0 0 0 5px var(--fosforo-oscuro), 0 0 30px rgba(98, 245, 154, 0.15);
  padding: 14px 16px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.cab-ia { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--linea); padding-bottom: 8px; }
.cab-ia h2 { margin: 0; font-family: var(--f-terminal); font-weight: 400; font-size: 24px; line-height: 1; letter-spacing: 0.05em; text-shadow: 0 0 8px var(--brillo); }
.cerrar-ia { font: inherit; font-size: 18px; background: none; border: 0; color: var(--fosforo-tenue); cursor: pointer; padding: 4px 8px; min-width: 44px; min-height: 36px; }
.cerrar-ia:hover { color: var(--fosforo); }
.intro-ia { margin: 0; font-size: 14px; }
.aviso-ia { margin: 0; font-size: 12px; color: var(--aviso); }
.form-ia { display: flex; flex-direction: column; gap: 6px; }
.form-ia label { font-size: 12px; color: var(--fosforo-tenue); letter-spacing: 0.04em; }
.fuentes-ia { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fuentes-ia[hidden], .seccion-ia[hidden] { display: none; }
.fuentes-ia legend { font-size: 12px; color: var(--fosforo-tenue); letter-spacing: 0.04em; padding: 0; margin-bottom: 4px; }
.fuente-ia { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--fosforo-oscuro); cursor: pointer; color: var(--fosforo) !important; font-size: 14px !important; }
.fuente-ia:has(input:checked) { border-color: var(--fosforo); background: rgba(98, 245, 154, 0.06); }
.fuente-ia input { margin-top: 3px; accent-color: var(--fosforo); width: 18px; height: 18px; flex: none; }
.fuente-ia strong { display: block; font-weight: 600; }
.fuente-ia small { display: block; font-size: 12px; color: var(--fosforo-tenue); }
.seccion-ia { display: flex; flex-direction: column; gap: 6px; }
.fila-clave { display: flex; gap: 6px; }
.fila-clave input { flex: 1; min-width: 0; }
.form-ia input[type="password"], .form-ia input[type="text"], .form-ia select {
  font: inherit; font-size: 16px; color: var(--fosforo); background: var(--fondo);
  border: 1px solid var(--fosforo-oscuro); padding: 10px; border-radius: 0; width: 100%;
}
.form-ia input:focus, .form-ia select:focus { outline: none; border-color: var(--fosforo); box-shadow: 0 0 0 1px var(--fosforo); }
.form-ia select:disabled { opacity: 0.5; }
.detectado-ia { margin: 0; min-height: 1.4em; font-size: 13px; color: var(--fosforo); }
.detectado-ia.mal { color: var(--aviso); }
.form-ia .fila-ia { font-size: 14px; color: var(--fosforo); display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.form-ia .sub-ia { font-size: 12px; color: var(--fosforo-tenue); margin-left: 24px; margin-top: 0; }
.form-ia .sub-ia:has(input:disabled) { opacity: 0.5; }
.consola.ocupada .boton { opacity: 0.5; }
.form-ia .fila-ia input { width: 18px; height: 18px; accent-color: var(--fosforo); }
.botones-ia { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.guardar-ia { color: var(--fondo) !important; background: var(--fosforo) !important; border-color: var(--fosforo) !important; }
.estado-ia { margin: 0; font-size: 13px; color: var(--fosforo-tenue); min-height: 1.4em; }
.guia-ia { font-size: 13px; color: var(--fosforo-tenue); border-top: 1px solid var(--linea); padding-top: 8px; }
.guia-ia summary { cursor: pointer; color: var(--fosforo); }
.guia-ia p { margin: 6px 0 0; }

/* Evento con decisión (estilo Victoria 2): marco doble y opciones con sus efectos. */
.b-dilema {
  border: 3px double var(--fosforo);
  background: var(--fondo-2);
  padding: 14px 14px 12px;
  box-shadow: 0 0 0 1px var(--fondo), 0 0 24px rgba(98, 245, 154, 0.12);
}
.b-dilema .etiqueta { font-family: var(--f-terminal); font-size: 24px; line-height: 1.1; letter-spacing: 0.06em; color: var(--fosforo); margin-bottom: 8px; text-shadow: 0 0 8px var(--brillo); }
.b-dilema > p { margin-bottom: 12px; }
.dilema-opciones { display: flex; flex-direction: column; gap: 8px; }
.dilema-op {
  font: inherit;
  text-align: left;
  color: var(--fosforo);
  background: var(--fondo);
  border: 1px solid var(--fosforo-oscuro);
  padding: 9px 11px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
  touch-action: manipulation;
}
.dilema-op:hover:not(:disabled) { border-color: var(--fosforo); }
.dilema-op:disabled { cursor: default; opacity: 0.35; }
.dilema-op.elegida { opacity: 1; border-color: var(--fosforo); background: rgba(98, 245, 154, 0.08); }
.dilema-op .op-texto { font-weight: 600; font-size: 14px; }
.dilema-op .op-letra { color: var(--fosforo-tenue); margin-right: 6px; }
.dilema-op .op-efectos { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
.op-efectos .sube { color: var(--bien); }
.op-efectos .baja { color: var(--mal); }
.op-efectos .aviso { color: var(--aviso); }
.aviso-pendiente .boton { background: var(--fosforo-oscuro); border-color: var(--fosforo-oscuro); }

.opciones { display: flex; flex-direction: column; gap: 8px; }
.opcion, .chip, .boton {
  font: inherit;
  color: var(--fosforo);
  background: var(--fondo-2);
  border: 1px solid var(--fosforo-oscuro);
  cursor: pointer;
  touch-action: manipulation;
}
.opcion { text-align: left; padding: 10px 12px; font-size: 14px; }
.opcion::before { content: '[ ] '; color: var(--fosforo-tenue); }
.opcion:hover { border-color: var(--fosforo); }
.opcion:disabled { opacity: 0.4; cursor: default; }
.opcion.elegida { opacity: 1; border-color: var(--fosforo); }
.opcion.elegida::before { content: '[x] '; }

.cursor::after {
  content: '▌';
  animation: parpadeo 0.8s steps(2) infinite;
  margin-left: 1px;
}

/* ---------- Consola ---------- */
.consola {
  flex: none;
  border-top: 1px solid var(--linea);
  background: var(--fondo);
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 0 16px;
}
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 13px; padding: 5px 10px; white-space: nowrap; }
.chip.cmd { color: var(--fosforo-tenue); border-style: dashed; }
.chip:hover { border-color: var(--fosforo); }

.linea-orden { display: flex; align-items: stretch; gap: 8px; }
.prompt { font-family: var(--f-terminal); font-size: 26px; line-height: 44px; color: var(--fosforo-tenue); }
#decreto {
  flex: 1;
  min-width: 0;
  font-family: var(--f-texto);
  font-size: 16px;
  color: var(--fosforo);
  background: var(--fondo-2);
  border: 1px solid var(--fosforo-oscuro);
  padding: 0 10px;
  height: 44px;
  caret-color: var(--fosforo);
  border-radius: 0;
}
#decreto::placeholder { color: var(--fosforo-oscuro); }
.boton {
  flex: none;
  padding: 0 14px;
  height: 44px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.06em;
  background: var(--sello);
  color: var(--papel);
  border-color: var(--sello);
}

  /*
   * CONDICIONES con los cuatro indicadores (dinero, inflación, estabilidad, felicidad) y las leyes vigentes.
   * Sustituyen a las de arriba cuando existen.
   */
  const S = e => e.stats;
  const regimen = e => (e.politica ? e.politica.regimen : 'DEMOCRACIA');
  const ley = (e, clave, accion) => (e.leyes || []).find(l => l.clave === clave && (!accion || l.accion === accion));
  const edad = (e, clave) => { const l = ley(e, clave); return l ? e.dia - l.desde : -1; };
  const modelo = (e, m) => (e.leyes || []).find(l => l.clave === 'MODELO' && l.modelo === m);
  const narco = e => ley(e, 'NARCO', 'PRIVATIZAR') || ley(e, 'NARCO', 'LEGALIZAR') || ley(e, 'NARCO', 'NACIONALIZAR') || modelo(e, 'narco');
  const edadNarco = e => { const l = narco(e); return l ? e.dia - l.desde : -1; };
  const represion = e => (e.leyes || []).filter(l => l.accion === 'CASTIGAR' || ['ESCUADRON', 'MILICIA', 'ESPIAS'].includes(l.clave)).length;
  const recortes = e => (e.leyes || []).filter(l => l.accion === 'RECORTAR').length;

  const CONDICIONES = {
    huelga_general: e => S(e).felicidad < 38,
    garrote_tanques: e => S(e).estabilidad < 45,
    rumor_golpe: e => S(e).estabilidad < 30,
    desfalco: e => S(e).dinero > 140 && e.dia > 4,
    cifuentes_conspira: e => S(e).dinero < 20 && S(e).estabilidad < 45,
    periodista: e => e.dia > 3 && represion(e) >= 1,
    fmi: e => S(e).dinero < 0,
    ultimatum: e => represion(e) >= 2 && S(e).estabilidad < 50,
    epidemia: e => !!(ley(e, 'SALUD', 'RECORTAR') || ley(e, 'SALUD', 'PRIVATIZAR') || ley(e, 'AGUA', 'PRIVATIZAR') || ley(e, 'AIRE', 'PRIVATIZAR')) && S(e).felicidad < 45,
    plaza_ocupada: e => S(e).estabilidad < 40,
    aniversario: e => S(e).felicidad > 60 && e.dia > 8,
    contrabando_aire: e => !!ley(e, 'AIRE', 'PRIVATIZAR'),
    hackers: e => !!(ley(e, 'INTERNET', 'PROHIBIR') || ley(e, 'PRENSA', 'PROHIBIR') || ley(e, 'PRENSA', 'CASTIGAR')),

    if (!est.presentado) { texto = c.presentacion + ' ' + texto; est.presentado = true; }
    return { titulo: 'LA CALLE · ' + c.nombre.toUpperCase(), texto };
  }

  // Tipo de decreto, para elegir titulares y voces que encajen.
  function tipoDecreto(accion, objId) {
    const o = RF.consejero.objetoDe(objId);
    const E = o.esencial || 0, L = o.libertad || 0;
    if (objId === 'OTRO' || ((accion === 'PROHIBIR' || accion === 'OBLIGAR') && ['CALENDARIO', 'ROPA', 'MASCOTAS', 'AIRE'].includes(objId))) return 'absurdo';
    if (accion === 'GLORIFICAR') return 'culto';
    if (accion === 'ENFOCAR' || objId === 'DINERO') return 'economia';
    if (o.institucion) return ['ESCUADRON', 'MILICIA', 'ESPIAS'].includes(objId) ? 'represion' : 'culto';
    if (o.regimen) return o.regimen === 'DEMOCRACIA' || ['PROHIBIR', 'DEROGAR'].includes(accion) ? 'regalo' : 'libertad';
    if (o.politico) return ['LEGALIZAR', 'CREAR', 'INVERTIR'].includes(accion) ? 'regalo' : 'libertad';
    if (accion === 'CASTIGAR' && o.gente) return 'represion';
    if ((accion === 'PROHIBIR' || accion === 'OBLIGAR' || accion === 'CASTIGAR') && L >= 1) return 'libertad';
    if (['PRIVATIZAR', 'RECORTAR', 'PROHIBIR'].includes(accion) && E >= 2) return 'esencial';
    if (accion === 'SUBSIDIAR' || (accion === 'BAJAR_IMPUESTO' && o.faccion !== 'cupula') || accion === 'LEGALIZAR') return 'regalo';
    if (accion === 'SUBIR_IMPUESTO') return 'impuesto';
    if (accion === 'INVERTIR') return 'obra';
    if (accion === 'PRIVATIZAR' || accion === 'NACIONALIZAR' || accion === 'BAJAR_IMPUESTO') return 'economia';
    return 'general';
  }

  function deFuente(fuente, tipo) {
    const f = RF.PRENSA[fuente];
    return f[tipo] || f.general;
  }

  function titulares(res, tipo) {
    const lineas = [RF.PRENSA.oficial.nombre + ': ' + T.expandir(T.azar(deFuente('oficial', tipo)), res.vars)];
    const d = res.deltas;
    const pt = res.porTurno || {};
    const est = (d.estabilidad || 0) + 3 * (pt.estabilidad || 0);
    if (Math.abs(est) >= 2 || Math.random() < 0.5) lineas.push(RF.PRENSA.extranjera.nombre + ': ' + T.expandir(T.azar(deFuente('extranjera', tipo)), res.vars));
    if ((res.impacto || 0) < 0 || tipo === 'culto' || tipo === 'absurdo' || Math.random() < 0.3) lineas.push(RF.PRENSA.pirata.nombre + ': ' + T.expandir(T.azar(deFuente('pirata', tipo)), res.vars));
    return lineas.join('\n');
  }

  function vozDeLaCalle(res, tipo) {
    if (tipo === 'absurdo' && Math.random() < 0.5) return T.expandir(T.azar(RF.ABSURDO.calle), res.vars);
    const sent = (res.impacto || 0) >= 2 ? 'pos' : 'neg';
    const pool = RF.VOCES[sent][tipo] || RF.VOCES[sent].general;
    return '—' + T.expandir(T.azar(pool), res.vars) + ' — dice ' + T.azar(RF.VOCES_QUIEN) + '.';
  }

  function eco(estado, res) {
    const previos = estado.historial.slice(0, -1).slice(-6).filter(h => h.medida !== res.medida);
    if (!previos.length) return null;
    return T.expandir(T.azar(RF.ECOS), { anterior: T.azar(previos).medida });
  }

  function ambiente(estado) {
    const s = estado.stats;
    let pool = RF.AMBIENTE.normal;
    if (s.inflacion > 30) pool = RF.AMBIENTE.inflacion;
    else if (s.dinero < 0) pool = RF.AMBIENTE.tesoro;
    else if (s.estabilidad < 30) pool = Math.random() < 0.5 ? RF.AMBIENTE.ejercito : RF.AMBIENTE.orden;
    else if (s.felicidad < 30) pool = RF.AMBIENTE.pueblo;
    else if (s.felicidad > 60 && s.estabilidad > 55) pool = RF.AMBIENTE.bien;
    return T.expandir(T.azar(pool));
  }

  // Todo lo que cuenta un decreto: Gaceta, números, prensa, gabinete y calle.
  const TIPO_TRATO = { matar: 'represion', encarcelar: 'represion', exiliar: 'libertad', destituir: 'general', premiar: 'culto', liberar: 'regalo' };

  function decretoPersona(estado, interp, res) {
    const bloques = [];
    const partes = ['INTÉRPRETE › ' + RF.poder.nombreTrato(res.trato).toUpperCase() + ' + ' + res.nombreObjeto.toUpperCase()];
    if (interp.heredada) partes.push('orden heredada de la frase anterior');
    bloques.push({ tipo: 'bot', texto: partes.join(' · ') });
    bloques.push({ tipo: 'gaceta', titulo: (res.secreto ? 'ORDEN RESERVADA Nº ' : 'ORDEN EJECUTIVA Nº ') + res.numero + ' · TURNO ' + res.dia, texto: T.mayus(res.medida) + '. ' + res.especial });
    bloques.push({ tipo: 'efectos', deltas: res.deltas, porTurno: res.porTurno });
    for (const nota of res.notas) bloques.push({ tipo: 'nota', texto: nota });
    const tipo = res.secreto ? 'secreto' : TIPO_TRATO[res.trato] || 'general';
    bloques.push({ tipo: 'prensa', titulo: 'TITULARES', texto: titulares(res, tipo) });
    const lm = lineaMinistro(estado, res);
    bloques.push({ tipo: 'cupula', titulo: lm.titulo, texto: lm.texto });
    const lc = lineaCiudadano(estado, res);
    if (lc) bloques.push({ tipo: 'calle', titulo: lc.titulo, texto: lc.texto + (Math.random() < 0.6 ? '\n\n' + vozDeLaCalle(res, tipo) : '') });
    return bloques;
  }

  function decreto(estado, interp, res) {
    if (res.tipo === 'persona') return decretoPersona(estado, interp, res);
    const bloques = [];
    const partes = [interp.tema ? 'INTÉRPRETE › ' + res.medida.toUpperCase() : 'INTÉRPRETE › ' + RF.ACCIONES[res.accion].nombre.toUpperCase() + ' + ' + (res.objeto === 'OTRO' ? '"' + res.nombreObjeto + '" (desconocido)' : res.nombreObjeto.toUpperCase())];
    if (interp.confianza != null) partes.push(interp.confianza + '% seguro');
    if (interp.heredada) partes.push('acción heredada de la frase anterior');
    if (interp.negado) partes.push('negación detectada');
    if (interp.intensidad > 1) partes.push('intensidad alta');
    if (interp.intensidad < 1) partes.push('intensidad baja');
    if (interp.corregidas && interp.corregidas.length) partes.push('corregí ' + interp.corregidas.map(([a, b]) => a + '→' + b).join(', '));
    bloques.push({ tipo: 'bot', texto: partes.join(' · ') });

    const tipo = res.secreto ? 'secreto' : res.prensa || tipoDecreto(res.accion, res.objeto);
    let gaceta = T.mayus(res.medida) + '.';
    if (res.especial) gaceta += ' ' + res.especial;
    else if (res.objeto === 'OTRO') gaceta += ' ' + T.expandir(T.azar(RF.ABSURDO.gaceta), res.vars);
    const cabecera = res.bloqueada ? 'PROYECTO DE LEY Nº ' : res.secreto ? 'ORDEN RESERVADA Nº ' : 'DECRETO Nº ';
    if (res.bloqueada) gaceta += ' El proyecto llega al Congreso... y se atasca.';
    bloques.push({ tipo: 'gaceta', titulo: cabecera + res.numero + ' · TURNO ' + res.dia, texto: gaceta });
    bloques.push({ tipo: 'efectos', deltas: res.deltas, porTurno: res.porTurno, curvas: res.curvas, nivel: res.ley && res.ley.nivel });
    for (const nota of res.notas) bloques.push({ tipo: 'nota', texto: nota });

    bloques.push({ tipo: 'prensa', titulo: 'TITULARES', texto: titulares(res, tipo) });
    const lm = lineaMinistro(estado, res);
    bloques.push({ tipo: 'cupula', titulo: lm.titulo, texto: lm.texto });
    const lc = lineaCiudadano(estado, res);
    if (lc) {
      let calle = lc.texto;
      if (Math.random() < 0.6) calle += '\n\n' + vozDeLaCalle(res, tipo);
      bloques.push({ tipo: 'calle', titulo: lc.titulo, texto: calle });
    }
    if (Math.random() < 0.3) { const e = eco(estado, res); if (e) bloques.push({ tipo: 'nota', texto: e }); }
    if (res.cambioRegimen) bloques.push(bloqueRegimen(res.cambioRegimen));
    return bloques;
  }

  // El parte del turno: qué ha hecho cada ley vigente, la economía de fondo y el resultado.
  function parteLeyes(estado, res) {
    const lineas = [];
    const detalle = (res.leyesTurno || []).slice().sort((a, b) => Math.abs(b.efectos.dinero || 0) - Math.abs(a.efectos.dinero || 0));
    for (const l of detalle.slice(0, 8)) {
      lineas.push(T.mayus(l.nombre) + (l.nivel > 1 ? ' (nivel ' + l.nivel + ')' : ''));
      lineas.push('   ' + RF.leyes.resumenLey(l.efectos));
    }
    if (detalle.length > 8) lineas.push('… y ' + (detalle.length - 8) + ' leyes más (escribe "leyes")');
    const f = res.fondo || {};
    lineas.push('Impuestos y gastos del Estado', '   ' + RF.leyes.resumenLey({ dinero: f.dinero, estabilidad: f.estabilidad, felicidad: f.felicidad }));
    return lineas.join('\n');
  }

  // Lo que pasa al terminar el turno: el parte de las leyes, las causas, los sucesos y cómo amanece.
  function cierreDia(estado, res) {
    const bloques = [];
    bloques.push({ tipo: 'leyes', titulo: 'LEYES VIGENTES · ESTE TURNO', texto: parteLeyes(estado, res) });
    bloques.push({ tipo: 'efectos', rotulo: 'Resultado del turno', deltas: res.cambioTurno || {} });
    for (const c of res.causas || []) bloques.push({ tipo: 'nota', texto: c });
    for (const s of res.sucesos) {
      const etiqueta = { consecuencia: 'CONSECUENCIA', hito: 'HISTORIAS', umbral: 'ALERTA', azar: 'NOTICIA', escandalo: 'ESCÁNDALO', politica: 'POLÍTICA', mundo: 'EN EL PAÍS' }[s.tipo] || 'NOTICIA';
      bloques.push({ tipo: 'suceso', clase: s.tipo, titulo: etiqueta + ' · ' + s.titulo.toUpperCase(), texto: s.texto, deltas: s.deltas });
    }
    if (res.fin) return bloques.concat(final(estado));
    if (res.programadas && !res.sucesos.length) bloques.push({ tipo: 'nota', texto: 'Radio Pasillo: dicen que esto todavía va a traer cola.' });
    bloques.push({ tipo: 'amanecer', titulo: 'TURNO ' + estado.dia, texto: ambiente(estado) });
    return bloques;
  }

  function turno(estado, interp, res) {
    return decreto(estado, interp, res).concat(cierreDia(estado, res));
  }

  // Tarjeta de un dilema: el juego la dibuja con botones.
  function dilema(estado, d) {

      tipo: 'dilema', id: d.id, titulo: 'EVENTO · ' + d.titulo.toUpperCase(), texto: RF.director.texto(d, estado),
      opciones: d.opciones.map(op => ({ texto: T.expandir(op.texto), resumen: RF.director.resumen(op) }))
    };
  }

  function bloqueRegimen(cambio) {
    const a = RF.REGIMENES[cambio.a];
    return { tipo: 'regimen', titulo: 'CAMBIO DE RÉGIMEN · ' + RF.REGIMENES[cambio.de].corto + ' → ' + a.corto, texto: a.descripcion };
  }

  function decision(estado, r) {
    const bloques = [{ tipo: 'suceso', clase: 'decision', titulo: 'DECISIÓN · ' + (r.textoOpcion || T.expandir(r.opcion.texto)).toUpperCase(), texto: r.resultado, deltas: r.deltas }];
    if (r.decreto && r.decreto.porTurno) bloques.push({ tipo: 'efectos', rotulo: 'Ley aprobada', deltas: {}, porTurno: r.decreto.porTurno, curvas: r.decreto.curvas });
    if (r.cambio) bloques.push(bloqueRegimen(r.cambio));
    if (r.fin) bloques.push(...final(estado));
    return bloques;
  }

  function sistema(estado) {
    return [{ tipo: 'sistema', titulo: 'EL SISTEMA POLÍTICO', texto: RF.politica.resumen(estado) }];
  }

  function confuso(interp) {
    return [
      { tipo: 'bot', texto: 'INTÉRPRETE › no entendí el decreto' },
      { tipo: 'cupula', titulo: 'EL GABINETE', texto: T.expandir(T.azar(CONFUSOS)) },
      { tipo: 'nota', texto: 'Prueba algo como "' + T.azar(EJEMPLOS) + '".' }
    ];
  }

  function pregunta(interp) {
    if (interp.estado === 'preguntar_objeto') {
      return {
        bloques: [
          { tipo: 'bot', texto: 'INTÉRPRETE › entendí ' + RF.ACCIONES[interp.accion].nombre.toUpperCase() + ', pero no sobre qué' },
          { tipo: 'cupula', titulo: 'EL SECRETARIO', texto: '"' + RF.ACCIONES[interp.accion].nombre + '... ¿el qué, Líder Supremo?" El secretario espera con la pluma en el aire.' }
        ],
        opciones: []
      };
    }
    const opciones = interp.estado === 'preguntar_trato'
      ? interp.opciones.map(op => ({ etiqueta: RF.poder.nombreTrato(op.trato) + ' a ' + op.nombreObjeto, interp: op }))
      : interp.opciones.map(op => ({
        etiqueta: T.mayus(RF.consejero.medida(op.accion, op.nombreObjeto)),
        interp: Object.assign({}, interp, { estado: 'ok', accion: op.accion, objeto: op.objeto, nombreObjeto: op.nombreObjeto })
      }));
    const texto = opciones.length > 2
      ? '"¿Qué hacemos con ' + interp.nombreObjeto + ', Líder Supremo?"'
      : '"Disculpe, Líder Supremo. ¿Se refiere a ' + opciones.map(o => o.etiqueta.toLowerCase()).join(' o a ') + '?"';
    return {
      bloques: [
        { tipo: 'bot', texto: 'INTÉRPRETE › tengo dudas, pregunto antes de firmar' },
        { tipo: 'cupula', titulo: 'EL SECRETARIO', texto }
      ],
      opciones
    };
  }

  function formatoStat(id, v) {
    if (id === 'dinero') return (v < 0 ? '−' : '') + Math.abs(Math.round(v)) + 'M';
    if (id === 'inflacion') return Math.round(v) + '%';
    return String(Math.round(v));
  }

  function estadoPais(estado) {
    const s = estado.stats;
    const lineas = [
      'Régimen      ' + RF.politica.mods(estado).nombre + (estado.politica.congreso === 'libre' ? ' · Congreso: ' + Math.round(estado.politica.apoyo) + '% de apoyo' : ''),
      'Dinero       ' + formatoStat('dinero', s.dinero),
      'Inflación    ' + formatoStat('inflacion', s.inflacion),
      'Estabilidad  ' + String(s.estabilidad).padStart(3) + '  ' + barra(s.estabilidad),
      'Felicidad    ' + String(s.felicidad).padStart(3) + '  ' + barra(s.felicidad)
    ];

    lineas.push('', 'Tus ' + RF.leyes.lista(estado).length + ' leyes suman cada turno:', '   ' + RF.leyes.resumenLey(t));
    lineas.push('Turno ' + estado.dia + ' · Decretos: ' + estado.historial.length);
    const humor = Object.entries(estado.ciudadanos).map(([id, c]) => RF.CIUDADANOS[id].nombre + ': ' + (c.estado && c.estado !== 'libre' ? DESTINOS[c.estado] : c.animo > 25 ? 'te apoya' : c.animo < -25 ? 'te detesta' : 'desconfía'));
    lineas.push('', 'La calle:', ...humor.map(h => '  ' + h));
    return [{ tipo: 'sistema', titulo: 'INFORME DE SITUACIÓN', texto: lineas.join('\n'), mono: true }];
  }

  const DESTINOS = { muerto: 'muerto', preso: 'en la cárcel', exiliado: 'en el exilio', fuera: 'destituido', libre: 'libre', aliado: 'tu aliado' };

  function gabinete(estado) {
    const lineas = Object.entries(RF.GABINETE).map(([id, m]) => {
      const v = RF.consejero.lealtad(estado, id);
      const actitud = v >= 60 ? 'leal' : v >= 35 ? 'inquieto' : 'conspira';
      const g = RF.poder.ministro(estado, id);
      const caidos = g.caidos.map(c => c.nombre + ' (' + DESTINOS[c.destino] + ')').join(', ');
      return g.nombre + ' (' + m.cargo + '): ' + actitud + (caidos ? '\n   antes: ' + caidos : '');
    });
    const inst = RF.leyes.lista(estado).filter(l => l.institucion).map(l => '  ' + T.mayus(RF.INSTITUCIONES[l.clave].nombre) + ' · nivel ' + l.nivel + ' · desde el turno ' + l.desde);
    lineas.push('', 'Instituciones del régimen:', ...(inst.length ? inst : ['  ninguna (prueba "crear una red de espías")']));
    const per = estado.personas || {};
    lineas.push('', 'Song Dae-ho, líder de la oposición: ' + (DESTINOS[per.valiente] || 'libre'));
    const gente = Object.entries(estado.ciudadanos).map(([id, c]) => RF.CIUDADANOS[id].nombre + ': ' + (DESTINOS[c.estado || 'libre']));
    lineas.push('La gente de a pie: ' + gente.join(' · '));
    return [{ tipo: 'sistema', titulo: 'EL PODER EN COREA DEL NORTE', texto: lineas.join('\n') }];
  }

  // Todas las leyes vigentes y lo que hacen ahora mismo cada turno.
  function leyes(estado) {
    const lista = RF.leyes.lista(estado);
    if (!lista.length) return [{ tipo: 'nota', texto: 'No hay leyes vigentes. Cada decreto que firmes se quedará aquí actuando todos los turnos.' }];
    const lineas = [];
    for (const l of lista) {
      const edad = estado.dia - l.desde;
      lineas.push(T.mayus(l.nombre) + (l.nivel > 1 ? ' (nivel ' + l.nivel + ')' : ''));
      lineas.push('   desde el turno ' + l.desde + (l.duracion ? ', dura ' + Math.max(0, l.duracion - edad) + ' turnos más' : '') + ': ' + RF.leyes.resumenLey(RF.leyes.efectoActual(estado, l)));
    }
    lineas.push('', 'Para quitar una ley: "derogar …" o "dejar de …".');
    return [{ tipo: 'sistema', titulo: 'LEYES VIGENTES', texto: lineas.join('\n') }];
  }

  function historial(estado) {
    if (!estado.historial.length) return [{ tipo: 'nota', texto: 'Todavía no has firmado ningún decreto.' }];
    return [{ tipo: 'sistema', titulo: 'ARCHIVO DE DECRETOS', texto: estado.historial.map((h, i) => 'Nº ' + (i + 1) + ' · Turno ' + h.dia + ': ' + T.mayus(h.medida)).join('\n') }];
  }

  function barra(v) { const n = Math.round(v / 10); return '█'.repeat(n) + '░'.repeat(10 - n); }

  function final(estado) {
    const f = RF.FINALES[estado.fin];
    const EPITAFIOS = {
      muerto: '{n} no llegó a ver el final de tu gobierno. En su barrio aún dejan flores cada aniversario.',
      preso: '{n} seguía en la cárcel cuando todo terminó. Salió años después, con el pelo blanco y la memoria intacta.',
      exiliado: '{n} vivió el final de tu gobierno desde el exilio. Nunca volvió a Corea del Norte.'
    };
    const epilogos = Object.entries(estado.ciudadanos).map(([id, c]) => {
      if (c.estado && c.estado !== 'libre') return T.expandir(EPITAFIOS[c.estado], { n: RF.CIUDADANOS[id].nombre });
      const tipo = c.animo > 25 ? 'bien' : c.animo < -25 ? 'mal' : 'neutro';
      return T.expandir(RF.CIUDADANOS[id].finales[tipo]);
    });
    const v = (estado.personas || {}).valiente;
    if (v === 'muerto') epilogos.push('Las plazas de medio país llevan hoy el nombre de Song Dae-ho. Ninguna lleva el tuyo.');
    else if (v === 'aliado') epilogos.push('Song Dae-ho acabó sus días como ministro de un gobierno que había jurado combatir. Nunca se lo perdonó.');
    else if (v === 'preso' || v === 'exiliado') epilogos.push('Song Dae-ho volvió a la vida pública en cuanto caíste. Ganó las siguientes elecciones.');
    const dias = estado.dia - 1;
    const s = estado.stats;
    return [
      { tipo: 'fin', titulo: 'FIN · ' + f.titulo, texto: T.expandir(f.texto) },
      { tipo: 'calle', titulo: 'QUÉ FUE DE ELLOS', texto: epilogos.join('\n\n') },
      { tipo: 'sistema', titulo: 'TU LEGADO', texto: 'Turnos en el poder: ' + dias + '. Decretos firmados: ' + estado.historial.length + '.\nDivisas ' + formatoStat('dinero', s.dinero) + ' · Arroz ' + formatoStat('inflacion', s.inflacion) + ' · Lealtad ' + s.estabilidad + ' · Pueblo ' + s.felicidad + '.\nEscribe "reiniciar" para gobernar otra vez.' }
    ];
  }

  RF.narrador = { intro, turno, decreto, cierreDia, dilema, decision, tipoDecreto, confuso, pregunta, estadoPais, gabinete, leyes, sistema, historial, ayuda, final, formatoStat, EJEMPLOS };

  const MODELOS = [
    { id: 'claude-opus-5', nombre: 'Claude Opus 5 · la mejor prosa', effort: 'low', fallbacks: true },
    { id: 'claude-sonnet-5', nombre: 'Claude Sonnet 5 · más barato', effort: 'low' },
    { id: 'claude-haiku-4-5', nombre: 'Claude Haiku 4.5 · el más barato y rápido' }
  ];

  // Los proveedores que hablan el formato de OpenAI. "modelo" es el que se usa si el jugador no elige.
  const PROVEEDORES = {
    cuenta: { nombre: 'Claude (tu cuenta de claude.ai)' }, // sin clave: solo dentro de claude.ai
    anthropic: { nombre: 'Claude (Anthropic)', clave: /^sk-ant-/, ejemplo: 'sk-ant-…' },
    openrouter: { nombre: 'OpenRouter', clave: /^sk-or-/, ejemplo: 'sk-or-…', base: 'https://openrouter.ai/api/v1', soloGratis: true },
    gemini: { nombre: 'Google Gemini', clave: /^AIza/, ejemplo: 'AIza…', base: 'https://generativelanguage.googleapis.com/v1beta/openai', modelo: 'gemini-2.5-flash' },
    groq: { nombre: 'Groq', clave: /^gsk_/, ejemplo: 'gsk_…', base: 'https://api.groq.com/openai/v1', modelo: 'llama-3.3-70b-versatile' }
  };

  function detectar(clave) {
    for (const [id, p] of Object.entries(PROVEEDORES)) if (p.clave && p.clave.test((clave || '').trim())) return id;
    return null;
  }

  // Las piezas de texto que la crónica sustituye (los números y los eventos se quedan).
  const NARRATIVOS = new Set(['prensa', 'cupula', 'calle', 'amanecer']);

  let config = { activa: false, clave: '', proveedor: '', modelo: '' };
  try { Object.assign(config, JSON.parse(localStorage.getItem(CLAVE_CONFIG) || '{}')); } catch (e) { /* sin almacenamiento */ }

  function guardar(nueva) {
    Object.assign(config, nueva);
    try { localStorage.setItem(CLAVE_CONFIG, JSON.stringify(config)); } catch (e) { /* sin almacenamiento */ }
  }

  // ---------- Tu cuenta de Claude (solo dentro de claude.ai) ----------
  // Los niveles de modelo que ofrece claude.ai a las páginas.
  const NIVELES = [
    { id: 'default', nombre: 'Normal · buena prosa' },
    { id: 'quick', nombre: 'Rápido · al instante' },
    { id: 'complex', nombre: 'El mejor · más lento' }
  ];
  let cuentaFn = null, cuentaLista = false;
  const cuentaPromesa = (async () => {
    try {
      if (!globalThis.claude || typeof globalThis.claude.use !== 'function') return null;
      cuentaFn = await globalThis.claude.use('sample');
    } catch (e) { cuentaFn = null; }
    return cuentaFn;
  })().finally(() => { cuentaLista = true; });
  // true / false; o null mientras claude.ai no ha respondido.
  function cuentaDisponible() { return cuentaFn ? true : cuentaLista ? false : null; }

  function activa() {
    if (proveedor() === 'cuenta') return !!config.activa && cuentaDisponible() !== false;
    return !!(config.activa && config.clave);
  }
  function proveedor() { return config.proveedor || detectar(config.clave) || 'anthropic'; }
  // El modelo en uso. En Claude es una ficha de MODELOS; en los demás, el nombre que dé el proveedor.
  function modelo() {
    if (proveedor() === 'cuenta') { const n = NIVELES.find(x => x.id === config.nivel) || NIVELES[0]; return { id: n.id, nombre: n.nombre.split(' · ')[0] }; }
    if (proveedor() === 'anthropic') return MODELOS.find(m => m.id === config.modelo) || MODELOS[0];
    const id = config.modelo || PROVEEDORES[proveedor()].modelo || '';
    return { id, nombre: id || 'automático' };
  }

  // ---------- Qué sabe Claude del mundo (fijo: se puede cachear) ----------
  const SISTEMA = [
    'Eres el cronista de "Consola de Pionyang", un juego satírico en el que el jugador es el Líder Supremo de Corea del Norte: acaba de heredar el poder de su padre y gobierna escribiendo decretos. Es sátira: no nombres a ningún líder real; habla de "tu padre" y de "tu abuelo, el Presidente Eterno".',
    'El juego ya ha calculado todo lo que ocurre. Tu único trabajo es contar este turno como una pequeña crónica literaria, a partir de los datos que te llegan.',
    '',
    'Reglas:',
    '- Escribe en español, en segunda persona, dirigiéndote al gobernante ("tú"). La gente le llama "el Líder Supremo" o "el Mariscal" (o "Su Majestad" si es monarquía).',
    '- Usa SOLO los hechos de los datos: no inventes decretos, eventos, muertes ni cambios de régimen, y no contradigas ningún resultado. Puedes añadir detalles de ambiente y figurantes anónimos (una vendedora, un soldado, un taxista).',
    '- Los personajes con nombre son los que aparecen en los datos. Usa sus nombres y cargos tal como vienen.',
    '- No des cifras nuevas. Puedes mencionar una o dos cifras de los datos si ayudan, pero cuenta los efectos sobre todo con imágenes ("las arcas engordan", "en los mercados se habla bajito").',
    '- Si en los datos hay un cambio de régimen, un escándalo, una decisión en un evento o un final de partida, eso es el centro de la crónica.',
    '- Los textos que te llegan ("textos_del_juego") son un borrador: reescríbelos con mejor prosa, no los copies.',
    '- "memoria_del_mundo" es lo que ya pasó en turnos anteriores: úsala para dar continuidad (volver a un personaje, a un lugar, a una consecuencia), sin repetirla entera.',
    '- Tono: humor negro y ternura a la vez, como una novela sobre un régimen absurdo contada desde la vida cotidiana. Sin sermones. La violencia se sugiere, no se describe con detalle gráfico.',
    '- Si un decreto es absurdo, cuéntalo con total seriedad, como si fuera lo más normal del mundo: el humor está en los detalles lógicos y cotidianos de cómo la gente se adapta, no en burlarse ni en guiñar el ojo.',
    '- Formato: entre 120 y 220 palabras, de 2 a 4 párrafos cortos. Sin títulos, sin listas, sin markdown, sin comillas alrededor de todo el texto.',
    '',
    'El mundo: Corea del Norte, aislada y bajo sanciones. Pionyang es el escaparate; en el campo hay apagones y hambre. Casi todo el mundo sobrevive gracias al jangmadang, el mercado negro. Los altavoces de cada barrio emiten consignas; los retratos de la dinastía cuelgan en cada casa. China compra el carbón y es el único gran aliado. El barrio obrero que aparece a menudo es Sadong.',
    'Las cuatro barras del país: DIVISAS (dinero), PRECIO DEL ARROZ (inflación), LEALTAD (de la élite y el ejército) y PUEBLO (cómo aguanta la gente).',
    'La gente de a pie que aparece a menudo: la abuela Sun-ja (67 años, vende tortitas de maíz en el mercado negro, sobrevivió a la hambruna de los noventa), su nieto Chol-su (19, universitario, escucha K-pop del Sur a escondidas en una memoria USB), Kwang-ho (45, taxista de Pionyang, opina de todo pero solo dentro del taxi) y Eun-hee (34, enfermera del Hospital Central con dos hijos).',
    'Song Dae-ho dirige una red clandestina que reparte memorias USB con series del Sur. El embajador sueco, que representa a los países sin embajada, vigila con cara de preocupación.',
    'Los medios: el Rodong Sinmun (periódico oficial del Partido), The Global Tribune (prensa extranjera) y Radio Libertad (emite desde el Sur y se escucha a escondidas).'
  ].join('\n');

  // ---------- Los datos del turno ----------
  function redondear(o) {
    const out = {};
    for (const [k, v] of Object.entries(o || {})) if (v) out[k] = Math.round(v * 10) / 10;
    return out;
  }

  function datosTurno(estado, bloques) {
    const s = estado.stats;
    const p = estado.politica || {};
    const hechos = [];
    const textos = [];
    for (const b of bloques) {
      if (b.tipo === 'efectos') hechos.push({ tipo: b.rotulo || 'efectos del decreto', cambios: redondear(b.deltas), cada_turno: b.porTurno ? redondear(b.porTurno) : undefined });
      else if (NARRATIVOS.has(b.tipo)) textos.push((b.titulo ? b.titulo + ': ' : '') + b.texto);
      else if (b.tipo === 'dilema') hechos.push({ tipo: 'evento pendiente de decisión', titulo: b.titulo, texto: b.texto, opciones: b.opciones.map(o => o.texto) });
      else if (b.tipo === 'bot' || b.tipo === 'eco' || b.tipo === 'sistema' || b.tipo === 'titulo') continue;
      else if (b.texto) hechos.push({ tipo: b.tipo, titulo: b.titulo || undefined, texto: b.texto, cambios: b.deltas ? redondear(b.deltas) : undefined });
    }
    return {
      turno: estado.dia,
      regimen: RF.REGIMENES && p.regimen ? RF.REGIMENES[p.regimen].nombre : 'Democracia',
      pais: { dinero_millones: s.dinero, inflacion_pct: Math.round(s.inflacion), estabilidad: s.estabilidad, felicidad: s.felicidad },
      gabinete: Object.entries(RF.GABINETE).map(([id, m]) => (estado.gabinete && estado.gabinete[id] ? estado.gabinete[id].nombre : m.nombre) + ' (' + m.cargo + ')'),
      gente: Object.entries(estado.ciudadanos || {}).map(([id, c]) => RF.CIUDADANOS[id].nombre + ': ' + ({ muerto: 'muerto/a', preso: 'en la cárcel', exiliado: 'en el exilio' }[c.estado] || (c.animo > 25 ? 'te apoya' : c.animo < -25 ? 'te detesta' : 'desconfía'))),
      leyes_vigentes: (estado.leyes || []).slice(-8).map(l => l.nombre),
      memoria_del_mundo: (estado.memoria || []).slice(-10).map(m => 'Turno ' + m.dia + ': ' + m.texto),
      hechos,
      textos_del_juego: textos
    };
  }

  // ---------- Conexión ----------
  let sdk = null;
  async function cargarSDK() {
    if (!sdk) sdk = await import(/* webpackIgnore: true */ SDK_URL);
    return sdk.default || sdk;
  }

  async function cliente() {
    const Anthropic = await RF.narradorIA.cargarSDK();
    // opcionesCliente permite a las pruebas pasar un fetch simulado.
    const opciones = Object.assign({ apiKey: config.clave, dangerouslyAllowBrowser: true, maxRetries: 1, timeout: 60000 }, RF.narradorIA.opcionesCliente || {});
    return { Anthropic, client: new Anthropic(opciones) };
  }

  function peticion(contenido, maxTokens, sistema) {
    const m = modelo();
    const params = {
      model: m.id,
      max_tokens: maxTokens,
      system: [{ type: 'text', text: sistema || SISTEMA, cache_control: { type: 'ephemeral' } }],
      messages: [{ role: 'user', content: contenido }]
    };
    if (m.effort) params.output_config = { effort: m.effort };
    // En Claude Opus 5, si un filtro de seguridad rechaza la petición, la API la repite con el modelo recomendado.
    if (m.fallbacks) { params.betas = ['server-side-fallback-2026-07-01']; params.fallbacks = 'default'; }
    return params;
  }

  // Traduce los errores del SDK a algo que el jugador entienda.
  function explicar(err, Anthropic) {
    if (Anthropic && err instanceof Anthropic.AuthenticationError) return 'La clave de la API no es válida. Revísala en el botón IA.';
    if (Anthropic && err instanceof Anthropic.PermissionDeniedError) return 'Tu clave no tiene permiso para usar este modelo. Prueba otro en el botón IA.';
    if (Anthropic && err instanceof Anthropic.RateLimitError) return 'Demasiadas peticiones seguidas a la API. Espera un momento.';
    if (Anthropic && err instanceof Anthropic.BadRequestError) return 'La API rechazó la petición: ' + (err.message || 'petición no válida') + '.';
    if (Anthropic && err instanceof Anthropic.APIConnectionError) return 'No se pudo conectar con la API. Si estás jugando dentro de la página de Claude, el visor bloquea las conexiones externas: abre el juego desde GitHub Pages o el archivo dist/pionyang.html.';
    if (Anthropic && err instanceof Anthropic.APIError) return 'La API respondió con un error (' + (err.status || '?') + ').';
    if (err && err.refusal) return 'El modelo prefirió no narrar este turno.';
    return 'No se pudo cargar el narrador con IA (' + (err && err.message ? err.message : 'error desconocido') + '). Si estás dentro de la página de Claude, abre el juego desde GitHub Pages o el archivo dist/pionyang.html.';
  }

  /*
   * Narra un turno. alTexto(textoAcumulado) se llama con cada trozo que llega.
   * Devuelve { texto, uso } o lanza un error con .mensaje listo para mostrar.
   */
  function contenidoTurno(estado, bloques) {
    return 'Datos del turno (JSON):\n' + JSON.stringify(datosTurno(estado, bloques)) + '\n\nEscribe la crónica de este turno.';
  }

  async function generarClaude(sistema, contenido, alTexto, maxTokens) {
    let Anthropic = null;
    try {
      const c = await cliente();
      Anthropic = c.Anthropic;
      const params = peticion(contenido, maxTokens || 4000, sistema);
      const stream = params.betas ? c.client.beta.messages.stream(params) : c.client.messages.stream(params);
      let texto = '';
      stream.on('text', (delta) => { texto += delta; if (alTexto) alTexto(texto); });
      const final = await stream.finalMessage();
      if (final.stop_reason === 'refusal') { const e = new Error('refusal'); e.refusal = true; throw e; }
      if (!texto.trim()) throw new Error('respuesta vacía');
      const u = final.usage || {};
      return { texto: texto.trim(), uso: { entrada: (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0), cache: u.cache_read_input_tokens || 0, salida: u.output_tokens || 0 }, modelo: final.model };
    } catch (err) {
      err.mensaje = explicar(err, Anthropic);
      throw err;
    }
  }

  // Una petición mínima para comprobar que la clave y la conexión funcionan.
  async function probarClaude() {
    let Anthropic = null;
    try {
      const c = await cliente();
      Anthropic = c.Anthropic;
      const params = peticion('Responde solo con la palabra: Listo', 200);
      const final = await (params.betas ? c.client.beta.messages.create(params) : c.client.messages.create(params));
      if (final.stop_reason === 'refusal') return { ok: false, mensaje: 'El modelo rechazó la prueba.' };
      return { ok: true, mensaje: 'Conexión correcta con ' + final.model + '. La crónica con IA está lista.' };
    } catch (err) {
      return { ok: false, mensaje: explicar(err, Anthropic) };
    }
  }

  // ---------- Proveedores con formato OpenAI (OpenRouter, Gemini, Groq) ----------
  function cabeceras(clave, prov) {
    const h = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (clave || config.clave) };
    if ((prov || proveedor()) === 'openrouter') h['X-Title'] = 'Consola de Pionyang';
    return h;
  }

  function errorHTTP(status, detalle) {
    const e = new Error(detalle || ('HTTP ' + status));
    e.status = status;
    return e;
  }

  function explicarCompatible(err) {
    const p = PROVEEDORES[proveedor()].nombre;
    if (err.refusal) return 'El modelo prefirió no narrar este turno.';
    if (err.status === 401 || err.status === 403) return 'La clave de ' + p + ' no es válida o no tiene permiso. Revísala en el botón IA.';
    if (err.status === 429) return p + ' dice que has llegado al límite de peticiones (en los modelos gratis es bajo). Espera un rato o elige otro modelo en el botón IA.';
    if (err.status === 402) return p + ' pide saldo para este modelo. Elige uno gratis en el botón IA.';
    if (err.status === 400 || err.status === 404) return p + ' no aceptó el modelo "' + modelo().id + '"' + (err.message ? ' (' + err.message.slice(0, 120) + ')' : '') + '. Elige otro en el botón IA.';
    if (err.status) return p + ' respondió con un error (' + err.status + ').';
    if (err instanceof TypeError) return 'No se pudo conectar con ' + p + '. Si estás jugando dentro de la página de Claude, el visor bloquea las conexiones externas: abre el juego desde GitHub Pages o el archivo dist/pionyang.html.';
    return 'La IA falló (' + (err.message || 'error desconocido') + ').';
  }

  async function leerError(r) {
    let detalle = '';
    try { const j = await r.json(); detalle = (j.error && (j.error.message || j.error)) || j.message || ''; if (Array.isArray(j) && j[0] && j[0].error) detalle = j[0].error.message; } catch (e) { /* sin cuerpo */ }
    return errorHTTP(r.status, typeof detalle === 'string' ? detalle : JSON.stringify(detalle));
  }

  // Los modelos del proveedor (por defecto, el de la clave guardada). En OpenRouter, solo los gratis.
  async function listarModelos(clave, prov) {
    prov = prov || proveedor();
    const p = PROVEEDORES[prov];
    if (!p.base) return [];
    const r = await fetch(p.base + '/models', { headers: cabeceras(clave, prov) });
    if (!r.ok) throw await leerError(r);
    const j = await r.json();
    let lista = (j.data || j.models || []).map(m => ({ id: String(m.id || m.name || '').replace(/^models\//, ''), gratis: /:free$/.test(m.id || '') || (m.pricing && Number(m.pricing.prompt) === 0 && Number(m.pricing.completion) === 0), contexto: m.context_length || 0 }));
    lista = lista.filter(m => m.id && !/embed|whisper|tts|guard|image|vision-only|audio|imagen|veo|aqa/i.test(m.id));
    if (p.soloGratis) lista = lista.filter(m => m.gratis);
    return lista.map(m => m.id);
  }

  // Si no hay modelo elegido, se escoge uno: en OpenRouter, el gratis que mejor escribe de los conocidos.
  const PREFERIDOS = [/deepseek.*(v3|chat)/i, /llama-3\.3-70b/i, /gemini/i, /qwen.*(72|235|max)/i, /mistral.*(medium|large|small-3)/i, /llama/i, /qwen/i];
  async function asegurarModelo() {
    if (proveedor() === 'anthropic' || modelo().id) return modelo().id;
    const lista = await listarModelos();
    if (!lista.length) throw errorHTTP(404, 'no hay modelos gratis disponibles ahora mismo');
    const elegido = PREFERIDOS.map(re => lista.find(id => re.test(id) && !/r1|think|reason/i.test(id))).find(Boolean) || lista[0];
    guardar({ modelo: elegido, auto: true });
    return elegido;
  }

  function cuerpo(contenido, maxTokens, stream, sistema) {
    return JSON.stringify({
      model: modelo().id,
      messages: [{ role: 'system', content: sistema || SISTEMA }, { role: 'user', content: contenido }],
      max_tokens: maxTokens,
      temperature: 0.9,
      stream
    });
  }

  // Algunos modelos gratis piensan en voz alta dentro de <think>…</think>: eso no es crónica.
  const limpiar = t => t.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').replace(/^\s+/, '');

  async function generarCompatible(sistema, contenido, alTexto, maxTokens) {
    try {
      await asegurarModelo();
      const r = await fetch(PROVEEDORES[proveedor()].base + '/chat/completions', { method: 'POST', headers: cabeceras(), body: cuerpo(contenido, maxTokens || 1500, true, sistema) });
      if (!r.ok) throw await leerError(r);
      const lector = r.body.getReader();
      const dec = new TextDecoder();
      let pendiente = '', bruto = '', uso = null, fin = null, modeloReal = null;
      for (;;) {
        const { value, done } = await lector.read();
        if (done) break;
        pendiente += dec.decode(value, { stream: true });
        const lineas = pendiente.split('\n');
        pendiente = lineas.pop();
        for (const linea of lineas) {
          if (!linea.startsWith('data:')) continue; // comentarios como ": OPENROUTER PROCESSING"
          const dato = linea.slice(5).trim();
          if (!dato || dato === '[DONE]') continue;
          let j; try { j = JSON.parse(dato); } catch (e) { continue; }
          if (j.error) throw errorHTTP(j.error.code || 500, j.error.message);
          if (j.usage) uso = j.usage;
          if (j.model) modeloReal = j.model;
          const c = j.choices && j.choices[0];
          if (!c) continue;
          if (c.finish_reason) fin = c.finish_reason;
          const trozo = c.delta && c.delta.content;
          if (trozo) { bruto += trozo; if (alTexto) alTexto(limpiar(bruto)); }
        }
      }
      if (fin === 'content_filter') { const e = new Error('refusal'); e.refusal = true; throw e; }
      const texto = limpiar(bruto).trim();
      if (!texto) throw new Error('respuesta vacía');
      return { texto, uso: uso ? { entrada: uso.prompt_tokens || 0, cache: (uso.prompt_tokens_details && uso.prompt_tokens_details.cached_tokens) || 0, salida: uso.completion_tokens || 0 } : null, modelo: modeloReal || modelo().id };
    } catch (err) {
      err.mensaje = explicarCompatible(err);
      // Si el modelo lo eligió el juego y ya no está (los gratis cambian), el próximo turno se elige otro.
      if ((err.status === 400 || err.status === 404) && config.auto) { guardar({ modelo: '' }); err.mensaje += ' El próximo turno probaré con otro modelo gratis.'; }
      throw err;
    }
  }

  async function probarCompatible() {
    try {
      await asegurarModelo();
      const r = await fetch(PROVEEDORES[proveedor()].base + '/chat/completions', { method: 'POST', headers: cabeceras(), body: cuerpo('Responde solo con la palabra: Listo', 300, false) });
      if (!r.ok) throw await leerError(r);
      const j = await r.json();
      if (j.error) throw errorHTTP(j.error.code || 500, j.error.message);
      return { ok: true, mensaje: 'Conexión correcta con ' + PROVEEDORES[proveedor()].nombre + ' (' + (j.model || modelo().id) + '). La crónica con IA está lista.' };
    } catch (err) {
      return { ok: false, mensaje: explicarCompatible(err) };
    }
  }

  // ---------- Con tu cuenta de Claude ----------
  // Los errores que significan "aquí no se puede": se pausa la IA para no insistir.
  const CUENTA_NO = new Set(['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed']);
  function explicarCuenta(e) {
    const c = e && e.code;
    if (c === 'not_granted') return 'No diste permiso para que Claude narre desde esta página.';
    if (CUENTA_NO.has(c)) return 'Claude no está disponible para esta página ahora mismo.';
    if (c === 'unavailable') return 'Tu cuenta de Claude solo funciona abriendo el juego dentro de claude.ai.';
    if (c === 'rate_limited') return 'Has llegado al límite de uso de tu plan de Claude (o hay demasiadas peticiones seguidas). Prueba más tarde.';
    if (c === 'session_expired') return 'Tu sesión de claude.ai ha caducado: vuelve a iniciar sesión.';
    if (c === 'refused') return 'Claude prefirió no narrar este turno.';
    if (c === 'prompt_too_large') return 'Los datos del turno son demasiado largos para Claude.';
    return 'Claude no pudo terminar la crónica (' + (c || 'error') + ').';
  }

  async function llamarCuenta(texto, opciones) {
    const fn = cuentaFn || await cuentaPromesa;
    if (!fn) { const e = new Error('unavailable'); e.code = 'unavailable'; throw e; }
    return fn(texto, opciones);
  }

  async function generarCuenta(sistema, contenido, alTexto) {
    try {
      // Aquí no hay "system": las reglas van delante de los datos.
      const r = await llamarCuenta((sistema || SISTEMA) + '\n\n---\n\n' + contenido, {
        modelTier: modelo().id,
        onText: ({ text }) => { if (alTexto) alTexto(text); }
      });

    return r.inicial;
  }

  // Consecuencias que llegan más tarde (las cuenta el motor cuando toca).
  function programar(e, ficha, res, recortes) {
    for (const c of objetos(ficha.consecuencias, 2)) {
      const en = Math.max(1, Math.min(6, Math.round(Number(c.en_turnos) || 2)));
      const tit = limpiar(c.titulo, 80);
      if (!tit) continue;
      e.pendientes.push({ dia: e.dia + en, titulo: tit, texto: limpiar(c.texto, 400), efectos: efectos(c.efectos, TOPES.inicial, recortes) });
      res.programadas = (res.programadas || 0) + 1;
    }
  }

  // Un evento propio de la IA: no más de uno cada dos turnos y nunca encima de otro.
  function crearEvento(e, ev, res, recortes) {
    const D = e.dilemas;
    if (ev && typeof ev === 'object' && objetos(ev.opciones, 3).length >= 2 && !D.pendiente && (!D.ultimo || e.dia - D.ultimo >= 2)) {
      const id = 'ia_' + e.dia + '_' + Math.floor(Math.random() * 1e6);
      const opciones = objetos(ev.opciones, 3).map(o => {
        const din = Math.max(-15, Math.min(15, Number(o.por_turno_dinero) || 0));
        return { texto: limpiar(o.texto, 90) || 'Seguir adelante', resultado: limpiar(o.resultado, 400), efectos: efectos(o.efectos, TOPES.inicial, recortes), ingresos: din ? Math.round(din / 3 * 10) / 10 : 0, hecho: limpiar(o.hecho, 240) };
      });
      D.custom = D.custom || {};
      D.custom[id] = { id, titulo: limpiar(ev.titulo, 80) || 'Una decisión', texto: limpiar(ev.texto, 700), opciones, ia: true };
      RF.director.forzar(e, id, {});
      res.dilema = id;
    }
  }

  // Si el Congreso bloqueó una ley de la IA y luego sale adelante (por un evento).
  function aprobar(e, ficha) {
    const res = { deltas: {}, porTurno: null, notas: [], leyes: [] };
    const ini = {};
    for (const ley of ficha.leyes || []) for (const [k, v] of Object.entries(promulgarLey(e, ley, res, { forzar: true }))) ini[k] = (ini[k] || 0) + v;
    RF.consejero.aplicarEfectos(e, ini, res.deltas);
    return res;
  }

  /*
   * Aplica la ficha de la IA al estado, con el motor como árbitro.
   * Devuelve un resultado de turno (como los del Consejero) con lo que pasó de verdad.
   */
  function aplicar(e, ficha, texto) {
    const p = RF.politica.iniciar(e);
    RF.poder.iniciar(e);
    const recortes = [];
    const titulo = minuscula(limpiar(ficha.titulo, 140)) || 'un decreto';
    const res = { tipo: 'ia', dia: e.dia, deltas: {}, porTurno: null, sucesos: [], notas: [], leyes: [], medida: titulo, nombreObjeto: titulo };
    const inicial = {};
    const sumar = (o, f) => { for (const [k, v] of Object.entries(o || {})) inicial[k] = (inicial[k] || 0) + v * (f || 1); };
    const secreto = !!ficha.secreto;
    const gravedad = Math.max(1, Math.min(3, Math.round(Number(ficha.gravedad_secreto) || 2)));

    // 1. El sistema político.
    const destino = typeof ficha.regimen === 'string' ? ficha.regimen.toUpperCase() : null;
    let efectosRegimen = null;
    if (destino && RF.REGIMENES[destino] && destino !== p.regimen) {
      const r = RF.politica.instaurar(e, destino);
      if (!r.nulo) {
        res.cambioRegimen = r.cambio;
        efectosRegimen = r.efectos;
        if (r.cadena) e.dilemas.cadena.push({ id: r.cadena.id, dia: e.dia + r.cadena.en });
      }
    }
    // Las mismas reglas que con los decretos normales: sobornos, fraude, comisiones de la verdad, autogolpes.
    for (const [k, v] of Object.entries(ficha.instituciones && typeof ficha.instituciones === 'object' ? ficha.instituciones : {})) {
      if (!INSTITUCIONES.includes(k) || !VALORES_INST.includes(v) || p[k] === v) continue;
      p[k] = v;
      if (k === 'congreso' && v === 'controlado') {
        p.apoyo = 85;
        RF.leyes.promulgar(e, { clave: 'SOBORNOS', porTurno: { dinero: -4 } }, 'POLITICA', 'los sobornos a los diputados');
        RF.politica.registrarSecreto(e, { tipo: 'soborno', descripcion: 'los sobornos a los diputados', gravedad: 2 });
        res.notas.push('Ahora el Congreso aprueba todo. Mantenerlo contento cuesta 4 millones cada turno, y el secreto puede salir a la luz.');
      }
      if (k === 'congreso' && v === 'libre') { p.apoyo = e.stats.felicidad; RF.leyes.derogar(e, 'SOBORNOS'); }
      if (k === 'elecciones' && v === 'controlado') RF.politica.registrarSecreto(e, { tipo: 'fraude', descripcion: 'el amaño del sistema electoral', gravedad: 2 });
      if (k === 'tribunales' && v === 'libre' && (p.crimenes > 0 || p.secretos.length)) e.dilemas.cadena.push({ id: 'comision_verdad', dia: e.dia + 3 });
    }
    if (!res.cambioRegimen) {
      const c = RF.politica.actualizar(e);
      if (c) {
        res.cambioRegimen = c;
        if (c.a === 'DICTADURA' && (c.de === 'DEMOCRACIA' || c.de === 'ILIBERAL')) e.dilemas.cadena.push({ id: 'autogolpe_ejercito', dia: e.dia + 1 });
        if (c.a === 'DEMOCRACIA' && (p.crimenes > 0 || p.secretos.length)) e.dilemas.cadena.push({ id: 'comision_verdad', dia: e.dia + 3 });
      }
    }

    // 2. Las leyes (o un efecto puntual).
    for (const l of objetos(ficha.leyes, 3)) {
      sumar(promulgarLey(e, prepararLey(l, recortes), res, { secreto, gravedad }));
    }
    sumar(efectos(ficha.efecto_unico, TOPES.inicial, recortes));
    if (secreto && !objetos(ficha.leyes, 3).length && !objetos(ficha.personas, 3).length) {
      RF.politica.registrarSecreto(e, { tipo: 'represion', descripcion: titulo, gravedad });
    }

    // 3. Derogar leyes vigentes.
    for (const id of (Array.isArray(ficha.derogar) ? ficha.derogar : []).filter(x => typeof x === 'string').slice(0, 3)) {
      const r = RF.leyes.derogar(e, String(id));
      if (r) { sumar(r.choque); res.notas.push('Queda derogada ' + r.ley.nombre + '.'); }
    }

    // 4. Personas: el motor comprueba que la orden sea posible y aplica sucesores, mártires y juicios.
    for (const pe of objetos(ficha.personas, 3)) {
      const id = String(pe.id || '').toLowerCase();
      const accion = String(pe.accion || '').toLowerCase();
      if (!RF.PERSONAS[id]) continue;
      if (accion === 'animo') {
        const c = e.ciudadanos[id];
        if (c) c.animo = Math.max(-100, Math.min(100, c.animo + Math.max(-40, Math.min(40, Number(pe.valor) || 0))));
        continue;
      }
      if (!TRATOS.includes(accion)) continue;
      const t = RF.poder.tratar(e, id, accion, null, secreto && ['matar', 'encarcelar', 'exiliar'].includes(accion));
      if (t.nulo) { res.notas.push(t.nulo); continue; }
      sumar(RF.consejero.convertir(t.efectos));
      if (t.ley) { const r = RF.leyes.promulgar(e, t.ley, 'PERSONA', t.ley.nombre); res.leyes.push(r.ley); res.notas.push('Esto dejará huella durante ' + t.ley.duracion + ' turnos: ' + t.ley.nombre + '.'); }
      for (const cl of t.derogar || []) RF.leyes.derogar(e, cl);
      if (t.cadena) e.dilemas.cadena.push({ id: t.cadena.id, dia: e.dia + t.cadena.en });
      if (t.sucesor) res.notas.push('Su puesto lo ocupa ' + t.sucesor + '.');
      if (t.secreto) {
        RF.politica.registrarSecreto(e, t.secreto);
        res.secreto = true;
      } else {
        const tipo = RF.PERSONAS[id].tipo;
        const publico = accion === 'matar' || (['encarcelar', 'exiliar'].includes(accion) && tipo !== 'ciudadano');
        if (publico && RF.politica.crimenPublico(e, { opositor: 3, extranjero: 3, ministro: 2, ciudadano: 2 }[tipo] || 2)) {
          res.dilema = 'juicio_politico';
          res.notas.push('En una democracia, hacer esto a la vista de todos tiene un precio: el Congreso abre un juicio político contra ti.');
        }
      }
    }
    if (secreto) {
      res.secreto = true;
      res.notas.push('Nadie lo sabe... todavía. Cada turno existe la posibilidad de que salga a la luz.');
    }

    // 5. El apoyo en el Congreso.
    const apoyo = Math.max(-25, Math.min(10, Number(ficha.apoyo_congreso) || 0));
    if (apoyo && p.congreso === 'libre') p.apoyo = Math.max(0, Math.min(100, p.apoyo + apoyo));

    // Un cambio de régimen sin coste en la ficha tiene el coste de siempre.
    if (efectosRegimen && Object.values(inicial).reduce((a, v) => a + Math.abs(v), 0) < 3) sumar(efectosRegimen);

    RF.consejero.aplicarEfectos(e, inicial, res.deltas);

    // 6. Lo que llega más tarde y lo que hay que recordar.
    programar(e, ficha, res, recortes);
    for (const h of (Array.isArray(ficha.hechos) ? ficha.hechos : []).slice(0, 3)) recordar(e, h);
    if (res.bloqueada) recordar(e, 'El Congreso bloqueó ' + titulo + '.');
    if (res.cambioRegimen) recordar(e, 'Corea del Norte pasó de ' + RF.REGIMENES[res.cambioRegimen.de].nombre + ' a ' + RF.REGIMENES[res.cambioRegimen.a].nombre + '.');

    // 7. Un evento propio, si toca.
    crearEvento(e, ficha.evento, res, recortes);

    if (recortes.length) res.notas.push('El motor moderó las cifras del Consejo para que fueran realistas.');
    e.historial.push({ dia: e.dia, accion: 'IA', objeto: 'IA', nombreObjeto: titulo, medida: titulo, texto });
    res.numero = e.historial.length;
    res.vars = { medida: titulo, Medida: T.mayus(titulo), objeto: titulo, lider: 'Líder Supremo' };
    res.ficha = ficha;
    return res;
  }

  // ---------- Contar el decreto (sin crónica, o como borrador para la crónica) ----------
  function bloques(e, ficha, res) {
    const out = [];
    out.push({ tipo: 'bot', texto: 'CONSEJO DE ESTADO › ' + (limpiar(ficha.interpretacion, 200) || T.mayus(res.medida)) });
    const pasos = (Array.isArray(ficha.logica) ? ficha.logica : []).map(x => limpiar(x, 220)).filter(Boolean).slice(0, 4);
    if (pasos.length) out.push({ tipo: 'logica', titulo: 'INFORME DEL CONSEJO', texto: pasos.join('\n') });
    const cab = res.bloqueada && !res.leyes.length ? 'PROYECTO DE LEY Nº ' : res.secreto ? 'ORDEN RESERVADA Nº ' : 'DECRETO Nº ';
    let gaceta = T.mayus(res.medida) + '.';
    const g = limpiar(ficha.gaceta, 500);
    if (g) gaceta += ' ' + g;
    if (res.bloqueada) gaceta += ' El proyecto llega al Congreso... y se atasca.';
    out.push({ tipo: 'gaceta', titulo: cab + res.numero + ' · TURNO ' + res.dia, texto: gaceta });
    out.push({ tipo: 'efectos', deltas: res.deltas, porTurno: res.porTurno, curvas: res.curvas, nivel: res.leyes.length === 1 ? res.leyes[0].nivel : undefined });
    for (const n of res.notas) out.push({ tipo: 'nota', texto: n });
    out.push(...reacciones(e, ficha));
    if (res.cambioRegimen) {
      const a = RF.REGIMENES[res.cambioRegimen.a];
      out.push({ tipo: 'regimen', titulo: 'CAMBIO DE RÉGIMEN · ' + RF.REGIMENES[res.cambioRegimen.de].corto + ' → ' + a.corto, texto: a.descripcion });
    }
    return out;
  }

  // Titulares, un ministro y la calle (el borrador que la crónica reescribe).
  function reacciones(e, ficha) {
    const out = [];
    const titulares = (Array.isArray(ficha.titulares) ? ficha.titulares : []).map(x => limpiar(x, 200)).filter(Boolean).slice(0, 3);
    if (titulares.length) out.push({ tipo: 'prensa', titulo: 'TITULARES', texto: titulares.join('\n') });
    const gb = ficha.gabinete && typeof ficha.gabinete === 'object' ? ficha.gabinete : {};
    const gid = String(gb.id || '').toLowerCase();
    if (RF.GABINETE[gid] && limpiar(gb.dice)) out.push({ tipo: 'cupula', titulo: e.gabinete[gid].nombre.toUpperCase() + ' · ' + RF.GABINETE[gid].cargo.toUpperCase(), texto: limpiar(gb.dice) });
    const ca = ficha.calle && typeof ficha.calle === 'object' ? ficha.calle : {};
    const cid = String(ca.id || '').toLowerCase();
    if (RF.CIUDADANOS[cid] && limpiar(ca.dice) && (e.ciudadanos[cid].estado || 'libre') === 'libre') {
      e.ciudadanos[cid].ultimaVez = e.dia;
      out.push({ tipo: 'calle', titulo: 'LA CALLE · ' + RF.CIUDADANOS[cid].nombre.toUpperCase(), texto: limpiar(ca.dice) });
    }
    return out;
  }

  // ---------- Pedir la ficha ----------
  // Devuelve la ficha ya leída, o lanza un error con .mensaje.
  async function consultar(e, texto, alTexto) {
    const datos = contexto(e, texto);
    const contenido = 'Situación de Corea del Norte y decreto (JSON):\n' + JSON.stringify(datos) + '\n\nDevuelve solo la ficha JSON del decreto.';
    const r = await RF.narradorIA.generar(SISTEMA, contenido, alTexto, 3000);
    const ficha = extraerJSON(r.texto);
    if (!ficha || typeof ficha !== 'object') {
      const err = new Error('ficha ilegible');
      err.mensaje = 'El Consejo respondió algo que el motor no pudo leer.';
      throw err;
    }
    return ficha;
  }

  // ---------- Un turno sin decretos: el país sigue su curso ----------
  const MUNDO = 'Este turno el jugador NO firma ningún decreto: espera. Decide qué pasa en Corea del Norte por su propia inercia, como consecuencia lógica de las leyes vigentes, la memoria y la situación: la oposición se mueve, un ministro conspira, un sector protesta o prospera, el extranjero reacciona, algo que se sembró antes da fruto. Si hay leyes o hechos absurdos vigentes, lo que pase debe seguir su lógica (el siguiente paso lógico del disparate). Debe ser UNA cosa concreta, no un resumen. En la ficha: "titulo" es el nombre de lo que pasa ("la huelga de los estibadores"), "gaceta" lo cuenta en dos o tres frases, "efecto_unico" sus efectos (topes de "inicial"), y puedes usar "personas" solo con "accion": "animo", "consecuencias", "evento", "hechos", "titulares", "gabinete" y "calle". NO uses "leyes", "derogar", "instituciones" ni "regimen": el gobierno no ha hecho nada.';

  async function consultarMundo(e, alTexto) {
    const contenido = 'Situación de Corea del Norte (JSON):\n' + JSON.stringify(contexto(e, '(ninguno: el jugador espera)')) + '\n\n' + MUNDO + '\n\nDevuelve solo la ficha JSON.';
    const r = await RF.narradorIA.generar(SISTEMA, contenido, alTexto, 2500);
    const ficha = extraerJSON(r.texto);
    if (!ficha || typeof ficha !== 'object') {
      const err = new Error('ficha ilegible');
      err.mensaje = 'El Consejo respondió algo que el motor no pudo leer.';
      throw err;
    }
    return ficha;
  }

  // Aplica lo que pasa solo. El gobierno no ha decidido nada: sin leyes, ni instituciones, ni tratos a personas.
  function aplicarMundo(e, ficha, res) {
    const recortes = [];
    const titulo = limpiar(ficha.titulo, 100);
    const deltas = {};
    RF.consejero.aplicarEfectos(e, efectos(ficha.efecto_unico, TOPES.inicial, recortes), deltas);
    for (const pe of objetos(ficha.personas, 3)) {
      const c = e.ciudadanos[String(pe.id || '').toLowerCase()];
      if (c && String(pe.accion).toLowerCase() === 'animo') c.animo = Math.max(-100, Math.min(100, c.animo + Math.max(-40, Math.min(40, Number(pe.valor) || 0))));
    }
    const texto = limpiar(ficha.gaceta, 600);
    if (titulo && texto) res.sucesos.push({ tipo: 'mundo', titulo, texto, deltas });
    programar(e, ficha, res, recortes);
    crearEvento(e, ficha.evento, res, recortes);
    for (const h of (Array.isArray(ficha.hechos) ? ficha.hechos : []).slice(0, 3)) recordar(e, h);
    res.ficha = ficha;
    return res;
  }

  RF.consejoIA = { consultarMundo, aplicarMundo, reacciones, limpiarTexto: limpiar, SISTEMA, TOPES, contexto, consultar, aplicar, aprobar, bloques, extraerJSON, recordar, memoria };
})(globalThis.RF = globalThis.RF || {});
