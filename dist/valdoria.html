<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a100c">
<title>Consola de Valdoria</title>
<meta name="description" content="Gobierna un país escribiendo decretos en una consola. Tus órdenes cambian el país y la vida de su gente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=VT323&display=swap">
<style>
/* Terminal presidencial: fósforo verde sobre negro; los decretos salen impresos en papel. */
:root {
  color-scheme: dark;
  --fondo: #0a100c;
  --fondo-2: #101a13;
  --linea: #1d3324;
  --fosforo: #62f59a;
  --fosforo-tenue: #3fa86c;
  --fosforo-oscuro: #22583a;
  --brillo: rgba(98, 245, 154, 0.35);
  --papel: #e9eddc;
  --tinta: #1f261d;
  --sello: #d0452f;
  --bien: #7fdcff;
  --mal: #ff6b52;
  --aviso: #ff9f43;
  --f-terminal: 'VT323', 'Courier New', monospace;
  --f-texto: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --f-papel: 'Special Elite', 'Courier New', Courier, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--fosforo);
  font-family: var(--f-texto);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.app {
  height: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    repeating-linear-gradient(to bottom, rgba(98, 245, 154, 0.025) 0 1px, transparent 1px 3px),
    var(--fondo);
}

/* ---------- Cabecera y barras del país ---------- */
.cabecera {
  flex: none;
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--linea);
  background: var(--fondo);
}
.cabecera-fila {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.marca {
  font-family: var(--f-terminal);
  font-size: 26px;
  line-height: 1;
  letter-spacing: 0.04em;
  margin: 0;
  font-weight: 400;
  text-shadow: 0 0 8px var(--brillo);
}
.dia {
  font-family: var(--f-terminal);
  font-size: 22px;
  line-height: 1;
  color: var(--fosforo-tenue);
  font-variant-numeric: tabular-nums;
}
.stats {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 2px; }
.stat-nombre { font-size: 10px; letter-spacing: 0.08em; color: var(--fosforo-tenue); }
.stat-valor { font-family: var(--f-terminal); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-barra { height: 4px; background: var(--linea); position: relative; overflow: hidden; }
.stat-relleno { position: absolute; inset: 0 auto 0 0; background: var(--fosforo); transition: width 0.6s ease; }
.stat.medio .stat-relleno { background: var(--aviso); }
.stat.bajo .stat-relleno { background: var(--mal); }
.stat.bajo .stat-valor { color: var(--mal); animation: parpadeo 1.2s steps(2) infinite; }
.stat .cambio {
  font-size: 10px; height: 12px; line-height: 12px; text-align: right;
  font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 0.3s;
}
.stat .cambio.visible { opacity: 1; }
.cambio.sube { color: var(--bien); }
.cambio.baja { color: var(--mal); }

@keyframes parpadeo { 50% { opacity: 0.45; } }

/* ---------- Historia ---------- */
.registro {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.bloque { max-width: 65ch; }
.bloque p { margin: 0; white-space: pre-wrap; }
.etiqueta {
  display: block;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fosforo-tenue);
  margin-bottom: 2px;
}

.b-titulo {
  font-family: var(--f-terminal);
  font-size: 40px;
  line-height: 1;
  text-align: left;
  text-wrap: balance;
  text-shadow: 0 0 12px var(--brillo);
  margin-top: 8px;
}

.b-eco, .b-bot { display: flex; gap: 1ch; }
.b-eco { color: var(--fosforo); font-weight: 600; margin-top: 6px; }
.b-eco::before { content: '>'; color: var(--fosforo-tenue); flex: none; }

.b-bot { font-size: 12px; color: var(--fosforo-tenue); opacity: 0.75; letter-spacing: 0.02em; }
.b-bot::before { content: '▸'; flex: none; }

.b-nota { font-size: 13px; font-style: italic; color: var(--fosforo-tenue); }

/* La Gaceta Oficial: un papel impreso dentro de la terminal. */
.b-gaceta {
  position: relative;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--f-papel);
  padding: 14px 16px 16px;
  box-shadow: 0 2px 0 var(--fosforo-oscuro), 0 10px 24px rgba(0, 0, 0, 0.5);
  transform: rotate(-0.4deg);
  overflow: hidden;
}
.b-gaceta .etiqueta {
  color: var(--tinta);
  opacity: 0.7;
  border-bottom: 1px dashed rgba(31, 38, 29, 0.4);
  padding-bottom: 4px;
  margin-bottom: 8px;
  font-family: var(--f-texto);
}
.b-gaceta p { font-size: 15px; line-height: 1.5; }
.sello {
  position: absolute;
  right: 10px;
  top: 8px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.1em;
  color: var(--sello);
  border: 2px solid var(--sello);
  padding: 0 6px;
  transform: rotate(8deg);
  opacity: 0.85;
  pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) {
  .sello { animation: sellar 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
}
@keyframes sellar {
  from { transform: rotate(8deg) scale(2.2); opacity: 0; }
  to { transform: rotate(8deg) scale(1); opacity: 0.85; }
}

.b-efectos { display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.efecto { padding: 1px 7px; border: 1px solid var(--linea); background: var(--fondo-2); white-space: nowrap; }
.efecto.sube { color: var(--bien); }
.efecto.baja { color: var(--mal); }
.efecto.neutro { color: var(--fosforo-tenue); }

.b-cupula, .b-calle { padding-left: 12px; border-left: 2px solid var(--fosforo-oscuro); }
.b-calle { border-left-style: dotted; }

.b-suceso { padding: 10px 12px; background: var(--fondo-2); border: 1px solid var(--linea); }
.b-suceso.umbral { border-color: var(--mal); }
.b-suceso.umbral .etiqueta { color: var(--mal); }
.b-suceso.hito .etiqueta { color: var(--aviso); }
.b-suceso .mini { margin-top: 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.mini .sube { color: var(--bien); }
.mini .baja { color: var(--mal); }

.b-sistema { padding: 10px 12px; border: 1px dashed var(--fosforo-oscuro); font-size: 13px; }
.b-sistema.mono p { font-variant-numeric: tabular-nums; overflow-x: auto; white-space: pre; }

.b-fin {
  border: 3px double var(--sello);
  padding: 16px;
  color: var(--papel);
  background: rgba(208, 69, 47, 0.08);
}
.b-fin .etiqueta { font-family: var(--f-terminal); font-size: 30px; line-height: 1.1; letter-spacing: 0.06em; color: var(--sello); margin-bottom: 8px; }

/* Titulares de prensa: tres voces, tres tipografías de periódico en miniatura. */
.b-prensa { font-size: 13px; }
.b-prensa p { color: var(--fosforo-tenue); }
.b-prensa p::first-line { color: var(--fosforo); }

/* Separador de día: amanece. */
.b-amanecer { border-top: 1px solid var(--linea); padding-top: 10px; margin-top: 6px; }
.b-amanecer .etiqueta { font-family: var(--f-terminal); font-size: 22px; letter-spacing: 0.08em; color: var(--fosforo); }
.b-amanecer p { font-style: italic; color: var(--fosforo-tenue); font-size: 14px; }

.b-suceso.decision { border-color: var(--fosforo-oscuro); border-left: 3px solid var(--fosforo); }

/* Evento con decisión (estilo Victoria 2): marco doble y opciones con sus efectos. */
.b-dilema {
  border: 3px double var(--fosforo);
  background: var(--fondo-2);
  padding: 14px 14px 12px;
  box-shadow: 0 0 0 1px var(--fondo), 0 0 24px rgba(98, 245, 154, 0.12);
}
.b-dilema .etiqueta { font-family: var(--f-terminal); font-size: 24px; line-height: 1.1; letter-spacing: 0.06em; color: var(--fosforo); margin-bottom: 8px; text-shadow: 0 0 8px var(--brillo); }
.b-dilema > p { margin-bottom: 12px; }
.dilema-opciones { display: flex; flex-direction: column; gap: 8px; }
.dilema-op {
  font: inherit;
  text-align: left;
  color: var(--fosforo);
  background: var(--fondo);
  border: 1px solid var(--fosforo-oscuro);
  padding: 9px 11px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
  touch-action: manipulation;
}
.dilema-op:hover:not(:disabled) { border-color: var(--fosforo); }
.dilema-op:disabled { cursor: default; opacity: 0.35; }
.dilema-op.elegida { opacity: 1; border-color: var(--fosforo); background: rgba(98, 245, 154, 0.08); }
.dilema-op .op-texto { font-weight: 600; font-size: 14px; }
.dilema-op .op-letra { color: var(--fosforo-tenue); margin-right: 6px; }
.dilema-op .op-efectos { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
.op-efectos .sube { color: var(--bien); }
.op-efectos .baja { color: var(--mal); }
.op-efectos .aviso { color: var(--aviso); }
.aviso-pendiente .boton { background: var(--fosforo-oscuro); border-color: var(--fosforo-oscuro); }

.opciones { display: flex; flex-direction: column; gap: 8px; }
.opcion, .chip, .boton {
  font: inherit;
  color: var(--fosforo);
  background: var(--fondo-2);
  border: 1px solid var(--fosforo-oscuro);
  cursor: pointer;
  touch-action: manipulation;
}
.opcion { text-align: left; padding: 10px 12px; font-size: 14px; }
.opcion::before { content: '[ ] '; color: var(--fosforo-tenue); }
.opcion:hover { border-color: var(--fosforo); }
.opcion:disabled { opacity: 0.4; cursor: default; }
.opcion.elegida { opacity: 1; border-color: var(--fosforo); }
.opcion.elegida::before { content: '[x] '; }

.cursor::after {
  content: '▌';
  animation: parpadeo 0.8s steps(2) infinite;
  margin-left: 1px;
}

/* ---------- Consola ---------- */
.consola {
  flex: none;
  border-top: 1px solid var(--linea);
  background: var(--fondo);
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 0 16px;
}
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 13px; padding: 5px 10px; white-space: nowrap; }
.chip.cmd { color: var(--fosforo-tenue); border-style: dashed; }
.chip:hover { border-color: var(--fosforo); }

.linea-orden { display: flex; align-items: stretch; gap: 8px; }
.prompt { font-family: var(--f-terminal); font-size: 26px; line-height: 44px; color: var(--fosforo-tenue); }
#decreto {
  flex: 1;
  min-width: 0;
  font-family: var(--f-texto);
  font-size: 16px;
  color: var(--fosforo);
  background: var(--fondo-2);
  border: 1px solid var(--fosforo-oscuro);
  padding: 0 10px;
  height: 44px;
  caret-color: var(--fosforo);
  border-radius: 0;
}
#decreto::placeholder { color: var(--fosforo-oscuro); }
.boton {
  flex: none;
  padding: 0 14px;
  height: 44px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.06em;
  background: var(--sello);
  color: var(--papel);
  border-color: var(--sello);
}
.boton:disabled { opacity: 0.5; }

:focus-visible { outline: 2px solid var(--aviso); outline-offset: 2px; }
#decreto:focus-visible { outline-offset: 0; }

@media (max-width: 420px) {
  .stat-nombre { font-size: 9px; letter-spacing: 0.04em; }
  .stat-valor { font-size: 18px; }
  .stats { gap: 4px; }
  .b-titulo { font-size: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  .stat-relleno { transition: none; }
  .stat.bajo .stat-valor, .cursor::after { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="cabecera">
    <div class="cabecera-fila">
      <h1 class="marca">VALDORIA</h1>
      <span class="dia" id="dia">DÍA 1/30</span>
    </div>
    <ul class="stats" id="stats" aria-label="Estado del país"></ul>
  </header>

  <main class="registro" id="registro" aria-live="polite"></main>

  <form class="consola" id="consola" autocomplete="off">
    <div class="chips" id="chips" aria-label="Atajos de decreto"></div>
    <div class="linea-orden">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <label for="decreto" class="oculto" hidden>Decreto</label>
      <input id="decreto" name="decreto" type="text" placeholder="Escribe tu decreto…" enterkeyhint="send" autocapitalize="sentences" spellcheck="false" maxlength="200">
      <button class="boton" id="enviar" type="submit">DECRETAR</button>
    </div>
  </form>
</div>

<script>
// js/texto.js
/*
 * Utilidades de texto: normalizar, separar palabras, raíces (stemming),
 * corrección de faltas y la mini-gramática que usa el Narrador.
 */
(function (RF) {
  'use strict';

  // Palabras que no aportan significado al decreto.
  const VACIAS = new Set((
    'el la los las lo un una unos unas de del al a en y e o u que se por para con sin ' +
    'su sus tu tus es son ser sea sean esta este estos estas ese esa eso esos esas ' +
    'aquel aquella muy pero como cuando donde desde hasta sobre entre hacia le les me te nos ' +
    'ha han he hay todo todos toda todas partir hoy dia adelante decreto decreta decreto ' +
    'ordeno ordena ordenamos quiero queremos sera seran va van vamos ahora nuevo nueva ' +
    'pais nacion nacional ciudadanos gente pueblo excelencia'
  ).split(/\s+/));

  // Negaciones que pueden dar la vuelta a un decreto ("ya no se vende el agua").
  const NEGACIONES = new Set(['no', 'nunca', 'jamas', 'dejar', 'dejen', 'deja', 'dejara', 'dejaran', 'basta']);

  const SUFIJOS = [
    'aciones', 'iciones', 'amiento', 'imiento', 'mente', 'acion', 'icion',
    'ando', 'iendo', 'ados', 'adas', 'idos', 'idas', 'ado', 'ada', 'ido', 'ida',
    'aran', 'eran', 'iran', 'aron', 'ieron', 'aras', 'eras', 'ara', 'era', 'ira',
    'ar', 'er', 'ir', 'an', 'en', 'as', 'es', 'os', 'a', 'e', 'o', 's'
  ];

  function normalizar(txt) {
    return String(txt || '')
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9%\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function palabras(txt) {
    const n = normalizar(txt);
    return n ? n.split(' ') : [];
  }

  function raiz(p) {
    if (p.length <= 4) return p;
    for (const s of SUFIJOS) {
      if (p.endsWith(s) && p.length - s.length >= 4) return p.slice(0, p.length - s.length);
    }
    return p;
  }

  function distancia(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let minFila = i;
      for (let j = 1; j <= b.length; j++) {
        const c = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c);
        if (cur[j] < minFila) minFila = cur[j];
      }
      if (minFila > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  // Corrige una palabra desconocida con la más parecida del vocabulario.
  function corregir(p, vocab) {
    if (p.length < 4 || vocab.has(p) || VACIAS.has(p) || NEGACIONES.has(p) || /\d/.test(p)) return p;
    const max = p.length <= 5 ? 1 : 2;
    let mejor = p, mejorD = max + 1;
    for (const v of vocab) {
      if (v[0] !== p[0]) continue; // las faltas reales casi nunca cambian la primera letra
      const d = distancia(p, v, max);
      if (d < mejorD) { mejor = v; mejorD = d; if (d === 1 && max === 1) break; }
    }
    return mejorD <= max ? mejor : p;
  }

  function azar(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

  // Mini-gramática: [a|b|c] elige una opción al azar, {var} inserta variables.
  function expandir(plantilla, vars) {
    let t = plantilla;
    const re = /\[([^\[\]]*)\]/;
    let m, guardia = 0;
    while ((m = re.exec(t)) && guardia++ < 200) {
      t = t.slice(0, m.index) + azar(m[1].split('|')) + t.slice(m.index + m[0].length);
    }
    return t.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] != null ? vars[k] : '{' + k + '}'));
  }

  function de(nombre) { return /^el /i.test(nombre) ? 'del ' + nombre.slice(3) : 'de ' + nombre; }
  function a(nombre) { return /^el /i.test(nombre) ? 'al ' + nombre.slice(3) : 'a ' + nombre; }
  function mayus(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }

  RF.texto = { VACIAS, NEGACIONES, normalizar, palabras, raiz, distancia, corregir, azar, expandir, de, a, mayus };
})(globalThis.RF = globalThis.RF || {});

// js/datos/sinonimos.js
/*
 * SINÓNIMOS Y JERGA
 * El Intérprete traduce estas palabras antes de pensar. Así entiende "tombos", "birras" o "banear"
 * sin tener que aprender frases nuevas. Claves sin tildes ni mayúsculas.
 */
(function (RF) {
  'use strict';

  RF.SINONIMOS = {
    // Fuerzas de seguridad
    milicos: 'militares', milico: 'militar', guachos: 'soldados', tombos: 'policias', tombo: 'policia',
    pacos: 'policias', paco: 'policia', pasma: 'policia', polis: 'policias', poli: 'policia', maderos: 'policias',
    cana: 'policia', chota: 'policia', pitufos: 'policias', cuarteles: 'militares',
    // Dinero y trabajo
    plata: 'dinero', lana: 'dinero', guita: 'dinero', pasta: 'dinero', billete: 'dinero', varo: 'dinero',
    chamba: 'trabajo', curro: 'trabajo', pega: 'trabajo', laburo: 'trabajo', laburantes: 'trabajadores',
    chambeadores: 'trabajadores', currantes: 'trabajadores', sueldito: 'sueldo', quincena: 'sueldo',
    // Bebida, vicios
    birras: 'cervezas', birra: 'cerveza', chelas: 'cervezas', chela: 'cerveza', pola: 'cerveza', polas: 'cervezas',
    guaro: 'alcohol', trago: 'alcohol', tragos: 'alcohol', copas: 'alcohol', pucho: 'cigarro', puchos: 'cigarros',
    faso: 'cigarro', porro: 'marihuana', porros: 'marihuana', mota: 'marihuana', hierba: 'marihuana', weed: 'marihuana',
    cannabis: 'marihuana', cocaina: 'drogas', perico: 'drogas', vapeo: 'tabaco', vapear: 'fumar', vapers: 'tabaco',
    // Tecnología
    celu: 'celular', celus: 'celulares', cel: 'celular', movil: 'moviles', compu: 'computadoras', compus: 'computadoras',
    ordenadores: 'computadoras', pc: 'computadoras', redes: 'redes sociales', insta: 'instagram', face: 'facebook',
    tiktoks: 'tiktok', wasap: 'whatsapp', guasap: 'whatsapp', ia: 'inteligencia artificial', chatgpt: 'inteligencia artificial',
    // Transporte
    bondi: 'autobus', bondis: 'autobuses', guagua: 'autobus', guaguas: 'autobuses', micro: 'autobus', micros: 'autobuses',
    colectivo: 'autobus', colectivos: 'autobuses', buses: 'autobuses', bus: 'autobus', camioneta: 'coches',
    auto: 'coche', autos: 'coches', nafta: 'gasolina', bencina: 'gasolina',

/*
 * EL INTÉRPRETE
 * Un pequeño bot que entiende decretos escritos libremente.
 *
 * Usa dos clasificadores Naive Bayes (uno para la ACCIÓN y otro para el OBJETO)
 * entrenados con las frases de ejemplo de acciones.js y objetos.js.
 * Además corrige faltas de ortografía, detecta negaciones ("ya no se vende...")
 * e intensidad ("subir MUCHO los impuestos").
 */

  'use strict';

  const FUERTES = new Set(['mucho', 'muchisimo', 'muchos', 'doble', 'duplicar', 'triple', 'triplicar', 'totalmente',
    'completamente', 'absolutamente', 'ejecutar', 'fusilar', 'matar', 'muerte', 'exterminar', 'radical', 'brutal',
    'masivo', 'masivamente', 'enorme', 'extremo', 'terminantemente', 'aplastar']);

    'simbolico', 'temporalmente', 'leve', 'tantito']);

  // Convierte un texto en rasgos: raíces de palabras con significado + pares de raíces.
  function rasgos(palabras) {
    const utiles = palabras.filter(p => !T.VACIAS.has(p));
    const raices = utiles.map(T.raiz);
    const out = raices.slice();
    // La palabra exacta también cuenta ("impuesto" no es igual que "impuestos").
    utiles.forEach((p, i) => { if (p !== raices[i]) out.push('=' + p); });
    for (let i = 0; i < raices.length - 1; i++) out.push(raices[i] + '_' + raices[i + 1]);
    return out;
  }

  function crearClasificador() {
    return { cuentas: {}, totales: {}, vocab: new Set(), clases: [] };
  }

  function entrenarEjemplo(clf, clase, rs) {
    if (!clf.cuentas[clase]) { clf.cuentas[clase] = {}; clf.totales[clase] = 0; clf.clases.push(clase); }
    for (const r of rs) {
      clf.cuentas[clase][r] = (clf.cuentas[clase][r] || 0) + 1;
      clf.totales[clase]++;
      clf.vocab.add(r);
    }
  }

  // Un rasgo es "evidencia" de una clase si aparece sobre todo en esa clase.
  function calcularEvidencias(clf) {
    clf.evidencia = {};
    for (const r of clf.vocab) {
      if (r.includes('_')) continue;
      let suma = 0, mejor = null, mejorF = 0;
      for (const c of clf.clases) {
        const f = (clf.cuentas[c][r] || 0) / clf.totales[c];
        suma += f;
        if (f > mejorF) { mejorF = f; mejor = c; }
      }
      if (suma > 0 && mejorF / suma >= 0.6) clf.evidencia[r] = mejor;
    }
  }

  function clasificar(clf, rs) {
    const conocidos = rs.filter(r => clf.vocab.has(r));
    const V = clf.vocab.size;
    const puntos = clf.clases.map(c => {
      let lp = 0;
      for (const r of conocidos) lp += Math.log(((clf.cuentas[c][r] || 0) + ALFA) / (clf.totales[c] + ALFA * V));
      return { clase: c, lp };
    });
    const max = Math.max(...puntos.map(p => p.lp));
    let suma = 0;
    for (const p of puntos) { p.prob = Math.exp(p.lp - max); suma += p.prob; }
    for (const p of puntos) p.prob /= suma;
    puntos.sort((x, y) => y.prob - x.prob);

    for (const r of conocidos) if (clf.evidencia[r]) (evid[clf.evidencia[r]] = evid[clf.evidencia[r]] || []).push(r);
    return { ranking: puntos, evidencias: evid, conocidos: conocidos.length };

  function confianza(ra, ro) {
    const parte = r => {
      const [a, b] = r.ranking;

    const bloques = [{ tipo: 'suceso', clase: 'decision', titulo: 'DECISIÓN · ' + r.opcion.texto.toUpperCase(), texto: r.resultado, deltas: r.deltas }];
    if (r.fin) bloques.push(...final(estado));
    return bloques;
  }

  function confuso(interp) {
    return [
      { tipo: 'bot', texto: 'INTÉRPRETE › no entendí el decreto' },
      { tipo: 'cupula', titulo: 'EL GABINETE', texto: T.azar(CONFUSOS) },
      { tipo: 'nota', texto: 'Prueba algo como "' + T.azar(EJEMPLOS) + '".' }
    ];
  }

  function pregunta(interp) {
    if (interp.estado === 'preguntar_objeto') {
      return {
        bloques: [
          { tipo: 'bot', texto: 'INTÉRPRETE › entendí ' + RF.ACCIONES[interp.accion].nombre.toUpperCase() + ', pero no sobre qué' },
          { tipo: 'cupula', titulo: 'EL SECRETARIO', texto: '"' + RF.ACCIONES[interp.accion].nombre + '... ¿el qué, Excelencia?" El secretario espera con la pluma en el aire.' }
        ],
        opciones: []
      };
    }
    const opciones = interp.opciones.map(op => ({
      etiqueta: T.mayus(RF.consejero.medida(op.accion, op.nombreObjeto)),
      interp: Object.assign({}, interp, { estado: 'ok', accion: op.accion, objeto: op.objeto, nombreObjeto: op.nombreObjeto })
    }));
    const texto = opciones.length > 2
      ? '"¿Qué hacemos con ' + interp.nombreObjeto + ', Excelencia?"'
      : '"Disculpe, Excelencia. ¿Se refiere a ' + opciones.map(o => o.etiqueta.toLowerCase()).join(' o a ') + '?"';
    return {
      bloques: [
        { tipo: 'bot', texto: 'INTÉRPRETE › tengo dudas, pregunto antes de firmar' },
        { tipo: 'cupula', titulo: 'EL SECRETARIO', texto }
      ],
      opciones
    };
  }

  function estadoPais(estado) {
    const lineas = RF.STATS.map(s => s.nombre.padEnd(9, ' ') + String(estado.stats[s.id]).padStart(3, ' ') + '  ' + barra(estado.stats[s.id]));
    const ing = estado.ingresos - 1;
    lineas.push('Balance diario del tesoro: ' + (ing > 0 ? '+' : '') + ing);
    lineas.push('Día ' + Math.min(estado.dia, RF.PAIS.dias) + ' de ' + RF.PAIS.dias + ' · Decretos firmados: ' + estado.historial.length);
    const humor = Object.entries(estado.ciudadanos).map(([id, c]) => RF.CIUDADANOS[id].nombre + ': ' + (c.animo > 25 ? 'te apoya' : c.animo < -25 ? 'te detesta' : 'desconfía'));
    lineas.push('', 'La calle:', ...humor.map(h => '  ' + h));
    return [{ tipo: 'sistema', titulo: 'INFORME DE SITUACIÓN', texto: lineas.join('\n'), mono: true }];
  }

  function gabinete(estado) {
    const lineas = Object.values(RF.GABINETE).map(m => {
      const v = Math.round(m.stats.reduce((s, k) => s + estado.stats[k], 0) / m.stats.length);
      const actitud = v >= 60 ? 'leal' : v >= 35 ? 'inquieto' : 'conspira';
      return m.nombre + ' (' + m.cargo + '): ' + actitud;
    });
    return [{ tipo: 'sistema', titulo: 'TU GABINETE', texto: lineas.join('\n') }];
  }

  function historial(estado) {
    if (!estado.historial.length) return [{ tipo: 'nota', texto: 'Todavía no has firmado ningún decreto.' }];
    return [{ tipo: 'sistema', titulo: 'ARCHIVO DE DECRETOS', texto: estado.historial.map((h, i) => 'Nº ' + (i + 1) + ' · Día ' + h.dia + ': ' + T.mayus(h.medida)).join('\n') }];
  }

  function barra(v) { const n = Math.round(v / 10); return '█'.repeat(n) + '░'.repeat(10 - n); }

  function final(estado) {
    const f = RF.FINALES[estado.fin];
    const epilogos = Object.entries(estado.ciudadanos).map(([id, c]) => {
      const tipo = c.animo > 25 ? 'bien' : c.animo < -25 ? 'mal' : 'neutro';
      return RF.CIUDADANOS[id].finales[tipo];
    });
    const dias = Math.min(estado.dia, RF.PAIS.dias + 1) - 1;
    return [
      { tipo: 'fin', titulo: 'FIN · ' + f.titulo, texto: f.texto },
      { tipo: 'calle', titulo: 'QUÉ FUE DE ELLOS', texto: epilogos.join('\n\n') },
      { tipo: 'sistema', titulo: 'TU LEGADO', texto: 'Días en el poder: ' + dias + '. Decretos firmados: ' + estado.historial.length + '.\nEscribe "reiniciar" para gobernar otra vez.' }
    ];
  }

  RF.narrador = { intro, turno, decreto, cierreDia, dilema, decision, tipoDecreto, confuso, pregunta, estadoPais, gabinete, historial, ayuda, final, EJEMPLOS };
})(globalThis.RF = globalThis.RF || {});

// js/juego.js
/*
 * EL JUEGO: conecta la consola (pantalla) con el Intérprete, el Consejero y el Narrador.
 * Guarda la partida en el propio celular para poder seguir otro día.
 */
(function (RF) {
  'use strict';
  const CLAVE = 'valdoria.partida.v1';
  const MAX_REGISTRO = 160;
  const $ = (id) => document.getElementById(id);
  const reducirMovimiento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const ATAJOS = [
    ['Prohibir…', 'Prohibir '], ['Vender…', 'Vender '], ['Regalar…', 'Regalar '],
    ['Impuestos a…', 'Subir impuestos a '], ['Mano dura…', 'Mano dura contra '], ['Legalizar…', 'Legalizar '],
    ['Invertir en…', 'Invertir en '], ['Recortar…', 'Recortar '], ['Obligar…', 'Obligar a todos a '],
    ['Estatua de mí', 'Estatua de mí'],
    ['estado', 'estado', true], ['gabinete', 'gabinete', true], ['historial', 'historial', true], ['ayuda', 'ayuda', true]
  ];

  let estado, registro = [], cola = [], escribiendo = null, actual = null, saltar = false, pendienteReinicio = false, tarjetaAbierta = null;

  // ---------- Guardado ----------
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify({ estado, registro: registro.slice(-MAX_REGISTRO) })); } catch (e) { /* sin guardado */ }
  }
  function cargar() {
    try {
      const d = JSON.parse(localStorage.getItem(CLAVE) || 'null');
      if (d && d.estado && d.estado.version === 1) return d;
    } catch (e) { /* partida corrupta o sin acceso */ }
    return null;
  }

  // ---------- Barras del país ----------
  function montarStats() {
    $('stats').innerHTML = RF.STATS.map(s =>
      `<li class="stat" id="st-${s.id}" title="${s.nombre}">
        <div class="stat-cab"><span class="stat-nombre">${s.corto}</span><span class="stat-valor">0</span></div>
        <div class="stat-barra"><div class="stat-relleno"></div></div>
        <div class="cambio"></div>
      </li>`).join('');
  }
  function pintarStats(deltas) {
    for (const s of RF.STATS) {
      const v = estado.stats[s.id];
      const li = $('st-' + s.id);
      li.querySelector('.stat-valor').textContent = v;
      li.querySelector('.stat-relleno').style.width = v + '%';
      li.classList.toggle('bajo', v < 25);
      li.classList.toggle('medio', v >= 25 && v < 45);
      li.setAttribute('aria-label', s.nombre + ' ' + v);
      const c = li.querySelector('.cambio');
      const d = deltas && deltas[s.id];
      if (d) {
        c.textContent = (d > 0 ? '+' : '') + d;
        c.className = 'cambio visible ' + (d > 0 ? 'sube' : 'baja');
        clearTimeout(c._t);
        c._t = setTimeout(() => c.classList.remove('visible'), 4000);
      }
    }
    $('dia').textContent = 'DÍA ' + Math.min(estado.dia, RF.PAIS.dias) + '/' + RF.PAIS.dias;
  }

  // ---------- Registro (la historia) ----------
  function el(tag, clase, texto) {
    const e = document.createElement(tag);
    if (clase) e.className = clase;
    if (texto != null) e.textContent = texto;
    return e;
  }

  function nombreStat(id) { return RF.STATS.find(s => s.id === id).nombre; }

  function listaDeltas(deltas, clase) {
    const cont = el('div', clase);
    const orden = RF.STATS.map(s => s.id).filter(k => deltas && deltas[k]);
    for (const k of orden) {
      const v = deltas[k];
      cont.appendChild(el('span', (clase === 'mini' ? '' : 'efecto ') + (v > 0 ? 'sube' : 'baja'), nombreStat(k) + ' ' + (v > 0 ? '+' : '−') + Math.abs(v)));
    }
    return cont;
  }

  // Crea el elemento de un bloque. Devuelve {nodo, parrafo, texto} para el efecto máquina de escribir.
  function crearBloque(b) {
    const n = el('section', 'bloque b-' + b.tipo + (b.clase ? ' ' + b.clase : '') + (b.mono ? ' mono' : ''));
    let p = null, texto = null;
    if (b.tipo === 'efectos') {
      const cont = listaDeltas(b.deltas, 'b-efectos');
      if (!cont.childNodes.length && !b.economia) cont.appendChild(el('span', 'efecto neutro', 'Sin cambios visibles'));
      if (b.economia) cont.appendChild(el('span', 'efecto ' + (b.economia > 0 ? 'sube' : 'baja'), 'Caja del día ' + (b.economia > 0 ? '+' : '−') + Math.abs(b.economia)));
      if (b.cambioIngresos) cont.appendChild(el('span', 'efecto ' + (b.cambioIngresos > 0 ? 'sube' : 'baja'), 'Ingresos diarios ' + (b.cambioIngresos > 0 ? '+' : '−') + Math.abs(b.cambioIngresos)));
      n.className = 'bloque';
      n.appendChild(cont);
      return { nodo: n };
    }
    if (b.tipo === 'dilema') return crearDilema(b, n);
    if (b.titulo) n.appendChild(el('span', 'etiqueta', b.titulo));
    if (b.tipo === 'gaceta' && b.titulo && b.titulo.indexOf('DECRETO') === 0) n.appendChild(el('span', 'sello', 'DECRETADO'));
    if (b.texto != null) {
      p = el('p');
      n.appendChild(p);
      texto = b.texto;
    }
    if (b.tipo === 'suceso' && b.deltas && Object.keys(b.deltas).some(k => b.deltas[k])) n.appendChild(listaDeltas(b.deltas, 'mini'));
    return { nodo: n, parrafo: p, texto };
  }

  const LETRAS = ['A', 'B', 'C'];

  // Tarjeta de evento con sus opciones. Solo se puede pulsar si es el evento abierto ahora mismo.
  function crearDilema(b, n) {
    n.appendChild(el('span', 'etiqueta', b.titulo));
    const p = el('p');
    n.appendChild(p);
    const cont = el('div', 'dilema-opciones');
    const pend = RF.director.pendiente(estado);
    const abierto = b.elegida == null && pend && pend.id === b.id;
    b.opciones.forEach((op, i) => {
      const boton = el('button', 'dilema-op' + (b.elegida === i ? ' elegida' : ''));
      boton.type = 'button';
      boton.disabled = !abierto;
      const linea = el('span', 'op-texto');
      linea.appendChild(el('span', 'op-letra', LETRAS[i] + ')'));
      linea.appendChild(document.createTextNode(op.texto));
      boton.appendChild(linea);
      const efectos = el('span', 'op-efectos');
      for (const r of op.resumen) efectos.appendChild(el('span', r.tono, r.texto));
      boton.appendChild(efectos);
      boton.addEventListener('click', () => elegirOpcion(i));
      cont.appendChild(boton);
    });
    n.appendChild(cont);
    if (abierto) tarjetaAbierta = { b, cont };
    return { nodo: n, parrafo: p, texto: b.texto };
  }

  const ANIMADOS = new Set(['gaceta', 'cupula', 'calle', 'suceso', 'fin', 'dilema', 'amanecer', 'prensa']);

  function mostrar(bloques, animar) {
    for (const b of bloques) {
      registro.push(b);
      cola.push({ b, animar: animar && !reducirMovimiento && ANIMADOS.has(b.tipo) });
    }
    if (registro.length > MAX_REGISTRO * 1.5) registro = registro.slice(-MAX_REGISTRO);
    if (!escribiendo) siguiente();
  }

  function alFondo() { const r = $('registro'); r.scrollTop = r.scrollHeight; }

  function siguiente() {
    let item;
    while ((item = cola.shift())) {
      const { nodo, parrafo, texto } = crearBloque(item.b);
      $('registro').appendChild(nodo);
      if (!parrafo || !item.animar || saltar) { if (parrafo) parrafo.textContent = texto; continue; }
      let i = 0;
      actual = { parrafo, texto };
      parrafo.classList.add('cursor');
      const paso = () => {
        i = saltar ? texto.length : Math.min(texto.length, i + 4);
        parrafo.textContent = texto.slice(0, i);
        alFondo();
        if (i < texto.length) escribiendo = requestAnimationFrame(paso);
        else { parrafo.classList.remove('cursor'); actual = null; escribiendo = setTimeout(siguiente, saltar ? 0 : 180); }
      };
      escribiendo = requestAnimationFrame(paso);
      return;
    }
    alFondo();
    escribiendo = null;
    saltar = false;
  }

  // Termina de golpe todo lo que se estaba escribiendo.
  function vaciar() {
    if (escribiendo) { clearTimeout(escribiendo); cancelAnimationFrame(escribiendo); }
    if (actual) { actual.parrafo.textContent = actual.texto; actual.parrafo.classList.remove('cursor'); actual = null; }
    while (cola.length) {
      const { nodo, parrafo, texto } = crearBloque(cola.shift().b);
      if (parrafo) parrafo.textContent = texto;
      $('registro').appendChild(nodo);
    }
    escribiendo = null;
    saltar = false;
    alFondo();
  }

  function mostrarOpciones(opciones) {
    const cont = el('div', 'bloque opciones');
    for (const op of opciones) {
      const b = el('button', 'opcion', op.etiqueta);
      b.type = 'button';
      b.addEventListener('click', () => {
        cont.querySelectorAll('button').forEach(x => { x.disabled = true; });
        b.classList.add('elegida');
        vaciar();
        firmar([op.interp]);
      });
      cont.appendChild(b);
    }
    const esperar = () => { if (escribiendo || cola.length) setTimeout(esperar, 100); else { $('registro').appendChild(cont); alFondo(); } };
    esperar();
  }

  // ---------- Turno ----------
  function cambios(antes) {
    const c = {};
    for (const k of Object.keys(antes)) c[k] = estado.stats[k] - antes[k];
    return c;
  }

  // Firma uno o varios decretos (el mismo día) y cuenta lo que pasa.
  function firmar(lista) {
    const antes = Object.assign({}, estado.stats);
    const bloques = [];
    if (lista.length > 1) bloques.push({ tipo: 'nota', texto: 'Firmas ' + lista.length + ' decretos de una sentada. El secretario se masajea la muñeca.' });
    let ultimo = null;
    lista.forEach((interp, k) => {
      const esUltimo = k === lista.length - 1;
      ultimo = RF.consejero.decretar(estado, interp, { avanzar: esUltimo, secundario: k > 0 });
      bloques.push(...RF.narrador.decreto(estado, interp, ultimo));
    });
    bloques.push(...RF.narrador.cierreDia(estado, ultimo));
    const d = RF.director.pendiente(estado);
    if (d && ultimo.dilema) bloques.push(RF.narrador.dilema(estado, d));
    mostrar(bloques, true);
    pintarStats(cambios(antes));
    actualizarConsola();
    guardar();
  }

  function elegirOpcion(i) {
    const d = RF.director.pendiente(estado);
    if (!d || !d.opciones[i] || !tarjetaAbierta) return;
    vaciar();
    tarjetaAbierta.b.elegida = i;
    tarjetaAbierta.cont.querySelectorAll('button').forEach((x, k) => { x.disabled = true; x.classList.toggle('elegida', k === i); });
    tarjetaAbierta = null;
    const antes = Object.assign({}, estado.stats);
    const r = RF.director.resolver(estado, i);
    mostrar([{ tipo: 'eco', texto: LETRAS[i] + ') ' + d.opciones[i].texto }], false);
    mostrar(RF.narrador.decision(estado, r), true);
    pintarStats(cambios(antes));
    actualizarConsola();
    guardar();
  }

  // Mientras hay un evento abierto, la consola lo recuerda.
  function actualizarConsola() {
    const d = RF.director.pendiente(estado);
    $('consola').classList.toggle('aviso-pendiente', !!d);
    $('decreto').placeholder = d ? 'Elige A, B o C en el evento…' : estado.fin ? 'Escribe "reiniciar"…' : 'Escribe tu decreto…';
  }

  function reiniciar() {
    estado = RF.consejero.nuevoEstado();
    vaciar();
    tarjetaAbierta = null;
    registro = [];
    $('registro').innerHTML = '';
    pintarStats();
    mostrar(RF.narrador.intro(estado), false);
    actualizarConsola();
    guardar();
  }

  function procesar(entrada) {
    const texto = entrada.trim();
    if (!texto) return;
    const orden = RF.texto.normalizar(texto);
    mostrar([{ tipo: 'eco', texto }], false);

    if (pendienteReinicio) {
      pendienteReinicio = false;
      if (/^(si|s|confirmar|reiniciar)$/.test(orden)) { reiniciar(); return; }
      mostrar([{ tipo: 'nota', texto: 'Seguimos gobernando.' }], false);
      return;
    }
    if (/^(reiniciar|reset|nueva partida|empezar de nuevo)$/.test(orden)) {
      if (estado.fin) { reiniciar(); return; }
      pendienteReinicio = true;
      mostrar([{ tipo: 'nota', texto: '¿Seguro que quieres abandonar el poder y empezar de cero? Escribe "sí" para confirmar.' }], false);
      return;
    }
    if (/^(ayuda|help|\?)$/.test(orden)) { mostrar(RF.narrador.ayuda(), false); return; }
    if (/^(estado|informe|situacion)$/.test(orden)) { mostrar(RF.narrador.estadoPais(estado), false); return; }
    if (/^(gabinete|ministros)$/.test(orden)) { mostrar(RF.narrador.gabinete(estado), false); return; }
    if (/^(historial|decretos|archivo)$/.test(orden)) { mostrar(RF.narrador.historial(estado), false); return; }

    if (estado.fin) {
      mostrar([{ tipo: 'nota', texto: 'Tu gobierno ha terminado. Escribe "reiniciar" para empezar otra partida.' }], false);
      return;
    }

    const pend = RF.director.pendiente(estado);
    if (pend) {
      const m = orden.match(/^(?:opcion )?([1-3]|[abc])\)?$/);
      if (m) { const i = /\d/.test(m[1]) ? +m[1] - 1 : 'abc'.indexOf(m[1]); if (i < pend.opciones.length) { elegirOpcion(i); return; } }
      mostrar([{ tipo: 'nota', texto: 'Antes de firmar nada más, decide qué hacer con el evento "' + pend.titulo + '". Pulsa una opción o escribe A, B o C.' }], false);
      return;
    }

    const lista = RF.interprete.interpretarVarios(texto);
    if (lista.length > 1) { firmar(lista); return; }
    const interp = lista[0];
    if (interp.estado === 'ok') { firmar([interp]); return; }
    if (interp.estado === 'confuso') { mostrar(RF.narrador.confuso(interp), true); guardar(); return; }
    const q = RF.narrador.pregunta(interp);
    mostrar(q.bloques, true);
    if (q.opciones.length) mostrarOpciones(q.opciones);
    guardar();
  }

  // ---------- Controles ----------
  function montarAtajos() {
    const cont = $('chips');
    for (const [etiqueta, valor, esComando] of ATAJOS) {
      const b = el('button', 'chip' + (esComando ? ' cmd' : ''), etiqueta);
      b.type = 'button';
      b.addEventListener('click', () => {
        const input = $('decreto');
        if (esComando || !valor.endsWith(' ')) { vaciar(); procesar(valor); return; }
        input.value = valor;
        input.focus();
        try { input.setSelectionRange(valor.length, valor.length); } catch (e) { /* algunos navegadores no lo permiten */ }
      });
      cont.appendChild(b);
    }
  }

  function iniciar() {
    RF.interprete.entrenar();
    montarStats();
    montarAtajos();

    const guardada = cargar();
    if (guardada) {
      estado = guardada.estado;
      registro = [];
      mostrar(guardada.registro, false);
      mostrar([{ tipo: 'nota', texto: 'Partida recuperada. Bienvenido de vuelta a Palacio, Excelencia.' }], false);
      // Si había un evento abierto y su tarjeta no quedó en el registro, se vuelve a mostrar.
      const d = RF.director.pendiente(estado);
      if (d && !tarjetaAbierta) mostrar([RF.narrador.dilema(estado, d)], false);
      pintarStats();
      actualizarConsola();
    } else {
      reiniciar();
    }

    $('consola').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('decreto');
      const v = input.value;
      input.value = '';
      vaciar();
      procesar(v);
    });
    // Tocar la historia acelera el texto.
    $('registro').addEventListener('click', (e) => { if (!e.target.closest('button')) saltar = true; });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})(globalThis.RF = globalThis.RF || {});
</script>
