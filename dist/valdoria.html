<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a100c">
<title>Consola de Valdoria</title>
<meta name="description" content="Gobierna un país escribiendo decretos en una consola. Tus órdenes cambian el país y la vida de su gente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=VT323&display=swap">
<style>
/* Terminal presidencial: fósforo verde sobre negro; los decretos salen impresos en papel. */
:root {
  color-scheme: dark;
  --fondo: #0a100c;
  --fondo-2: #101a13;
  --linea: #1d3324;
  --fosforo: #62f59a;
  --fosforo-tenue: #3fa86c;
  --fosforo-oscuro: #22583a;
  --brillo: rgba(98, 245, 154, 0.35);
  --papel: #e9eddc;
  --tinta: #1f261d;
  --sello: #d0452f;
  --bien: #7fdcff;
  --mal: #ff6b52;
  --aviso: #ff9f43;
  --f-terminal: 'VT323', 'Courier New', monospace;
  --f-texto: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --f-papel: 'Special Elite', 'Courier New', Courier, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--fosforo);
  font-family: var(--f-texto);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.app {
  height: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    repeating-linear-gradient(to bottom, rgba(98, 245, 154, 0.025) 0 1px, transparent 1px 3px),
    var(--fondo);
}

/* ---------- Cabecera y barras del país ---------- */
.cabecera {
  flex: none;
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--linea);
  background: var(--fondo);
}
.cabecera-fila {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.marca {
  font-family: var(--f-terminal);
  font-size: 26px;
  line-height: 1;
  letter-spacing: 0.04em;
  margin: 0;
  font-weight: 400;
  text-shadow: 0 0 8px var(--brillo);
}
.dia {
  font-family: var(--f-terminal);
  font-size: 22px;
  line-height: 1;
  color: var(--fosforo-tenue);
  font-variant-numeric: tabular-nums;
}
.stats {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 2px; }
.stat-nombre { font-size: 10px; letter-spacing: 0.08em; color: var(--fosforo-tenue); }
.stat-valor { font-family: var(--f-terminal); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-barra { height: 4px; background: var(--linea); position: relative; overflow: hidden; }
.stat-relleno { position: absolute; inset: 0 auto 0 0; background: var(--fosforo); transition: width 0.6s ease; }
.stat.medio .stat-relleno { background: var(--aviso); }
.stat.bajo .stat-relleno { background: var(--mal); }
.stat.bajo .stat-valor { color: var(--mal); animation: parpadeo 1.2s steps(2) infinite; }
.stat .cambio {
  font-size: 10px; height: 12px; line-height: 12px; text-align: right;
  font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 0.3s;
}
.stat .cambio.visible { opacity: 1; }
.cambio.sube { color: var(--bien); }
.cambio.baja { color: var(--mal); }

@keyframes parpadeo { 50% { opacity: 0.45; } }

/* Línea del mercado bajo las barras: se pulsa para ver la economía. */
.ticker {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 3px 0 0;
  border: 0;
  border-top: 1px dashed var(--linea);
  background: none;
  color: var(--fosforo-tenue);
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.ticker:hover { color: var(--fosforo); }
.ticker.alerta { color: var(--aviso); }
.b-suceso.mercado .etiqueta { color: var(--bien); }
.b-suceso.institucion { border-style: dashed; }

/* ---------- Historia ---------- */
.registro {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.bloque { max-width: 65ch; }
.bloque p { margin: 0; white-space: pre-wrap; }
.etiqueta {
  display: block;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fosforo-tenue);
  margin-bottom: 2px;
}

.b-titulo {
  font-family: var(--f-terminal);
  font-size: 40px;
  line-height: 1;
  text-align: left;
  text-wrap: balance;
  text-shadow: 0 0 12px var(--brillo);
  margin-top: 8px;
}

.b-eco, .b-bot { display: flex; gap: 1ch; }
.b-eco { color: var(--fosforo); font-weight: 600; margin-top: 6px; }
.b-eco::before { content: '>'; color: var(--fosforo-tenue); flex: none; }

.b-bot { font-size: 12px; color: var(--fosforo-tenue); opacity: 0.75; letter-spacing: 0.02em; }
.b-bot::before { content: '▸'; flex: none; }

.b-nota { font-size: 13px; font-style: italic; color: var(--fosforo-tenue); }

/* La Gaceta Oficial: un papel impreso dentro de la terminal. */
.b-gaceta {
  position: relative;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--f-papel);
  padding: 14px 16px 16px;
  box-shadow: 0 2px 0 var(--fosforo-oscuro), 0 10px 24px rgba(0, 0, 0, 0.5);
  transform: rotate(-0.4deg);
  overflow: hidden;
}
.b-gaceta .etiqueta {
  color: var(--tinta);
  opacity: 0.7;
  border-bottom: 1px dashed rgba(31, 38, 29, 0.4);
  padding-bottom: 4px;
  margin-bottom: 8px;
  font-family: var(--f-texto);
}
.b-gaceta p { font-size: 15px; line-height: 1.5; }
.sello {
  position: absolute;
  right: 10px;
  top: 8px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.1em;
  color: var(--sello);
  border: 2px solid var(--sello);
  padding: 0 6px;
  transform: rotate(8deg);
  opacity: 0.85;
  pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) {
  .sello { animation: sellar 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
}
@keyframes sellar {
  from { transform: rotate(8deg) scale(2.2); opacity: 0; }
  to { transform: rotate(8deg) scale(1); opacity: 0.85; }
}

.b-efectos { display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.efecto { padding: 1px 7px; border: 1px solid var(--linea); background: var(--fondo-2); white-space: nowrap; }
.efecto.sube { color: var(--bien); }
.efecto.baja { color: var(--mal); }
.efecto.neutro { color: var(--fosforo-tenue); }

.b-cupula, .b-calle { padding-left: 12px; border-left: 2px solid var(--fosforo-oscuro); }
.b-calle { border-left-style: dotted; }

.b-suceso { padding: 10px 12px; background: var(--fondo-2); border: 1px solid var(--linea); }
.b-suceso.umbral { border-color: var(--mal); }
.b-suceso.umbral .etiqueta { color: var(--mal); }
.b-suceso.hito .etiqueta { color: var(--aviso); }
.b-suceso .mini { margin-top: 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.mini .sube { color: var(--bien); }
.mini .baja { color: var(--mal); }

.b-sistema { padding: 10px 12px; border: 1px dashed var(--fosforo-oscuro); font-size: 13px; }
.b-sistema.mono p { font-variant-numeric: tabular-nums; overflow-x: auto; white-space: pre; }

.b-fin {
  border: 3px double var(--sello);
  padding: 16px;
  color: var(--papel);
  background: rgba(208, 69, 47, 0.08);
}
.b-fin .etiqueta { font-family: var(--f-terminal); font-size: 30px; line-height: 1.1; letter-spacing: 0.06em; color: var(--sello); margin-bottom: 8px; }

/* Titulares de prensa: tres voces, tres tipografías de periódico en miniatura. */
.b-prensa { font-size: 13px; }
.b-prensa p { color: var(--fosforo-tenue); }
.b-prensa p::first-line { color: var(--fosforo); }

/* Separador de día: amanece. */
.b-amanecer { border-top: 1px solid var(--linea); padding-top: 10px; margin-top: 6px; }
.b-amanecer .etiqueta { font-family: var(--f-terminal); font-size: 22px; letter-spacing: 0.08em; color: var(--fosforo); }
.b-amanecer p { font-style: italic; color: var(--fosforo-tenue); font-size: 14px; }

.b-suceso.decision { border-color: var(--fosforo-oscuro); border-left: 3px solid var(--fosforo); }

/* Evento con decisión (estilo Victoria 2): marco doble y opciones con sus efectos. */
.b-dilema {
  border: 3px double var(--fosforo);
  background: var(--fondo-2);
  padding: 14px 14px 12px;
  box-shadow: 0 0 0 1px var(--fondo), 0 0 24px rgba(98, 245, 154, 0.12);
}
.b-dilema .etiqueta { font-family: var(--f-terminal); font-size: 24px; line-height: 1.1; letter-spacing: 0.06em; color: var(--fosforo); margin-bottom: 8px; text-shadow: 0 0 8px var(--brillo); }
.b-dilema > p { margin-bottom: 12px; }
.dilema-opciones { display: flex; flex-direction: column; gap: 8px; }
.dilema-op {
  font: inherit;
  text-align: left;
  color: var(--fosforo);
  background: var(--fondo);
  border: 1px solid var(--fosforo-oscuro);
  padding: 9px 11px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
  touch-action: manipulation;
}
.dilema-op:hover:not(:disabled) { border-color: var(--fosforo); }
.dilema-op:disabled { cursor: default; opacity: 0.35; }
.dilema-op.elegida { opacity: 1; border-color: var(--fosforo); background: rgba(98, 245, 154, 0.08); }
.dilema-op .op-texto { font-weight: 600; font-size: 14px; }
.dilema-op .op-letra { color: var(--fosforo-tenue); margin-right: 6px; }
.dilema-op .op-efectos { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
.op-efectos .sube { color: var(--bien); }
.op-efectos .baja { color: var(--mal); }
.op-efectos .aviso { color: var(--aviso); }
.aviso-pendiente .boton { background: var(--fosforo-oscuro); border-color: var(--fosforo-oscuro); }

.opciones { display: flex; flex-direction: column; gap: 8px; }
.opcion, .chip, .boton {
  font: inherit;
  color: var(--fosforo);
  background: var(--fondo-2);
  border: 1px solid var(--fosforo-oscuro);
  cursor: pointer;
  touch-action: manipulation;
}
.opcion { text-align: left; padding: 10px 12px; font-size: 14px; }
.opcion::before { content: '[ ] '; color: var(--fosforo-tenue); }
.opcion:hover { border-color: var(--fosforo); }
.opcion:disabled { opacity: 0.4; cursor: default; }
.opcion.elegida { opacity: 1; border-color: var(--fosforo); }
.opcion.elegida::before { content: '[x] '; }

.cursor::after {
  content: '▌';
  animation: parpadeo 0.8s steps(2) infinite;
  margin-left: 1px;
}

/* ---------- Consola ---------- */
.consola {
  flex: none;
  border-top: 1px solid var(--linea);
  background: var(--fondo);
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 0 16px;
}
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 13px; padding: 5px 10px; white-space: nowrap; }
.chip.cmd { color: var(--fosforo-tenue); border-style: dashed; }
.chip:hover { border-color: var(--fosforo); }

.linea-orden { display: flex; align-items: stretch; gap: 8px; }
.prompt { font-family: var(--f-terminal); font-size: 26px; line-height: 44px; color: var(--fosforo-tenue); }
#decreto {
  flex: 1;
  min-width: 0;
  font-family: var(--f-texto);
  font-size: 16px;
  color: var(--fosforo);
  background: var(--fondo-2);
  border: 1px solid var(--fosforo-oscuro);
  padding: 0 10px;
  height: 44px;
  caret-color: var(--fosforo);
  border-radius: 0;
}
#decreto::placeholder { color: var(--fosforo-oscuro); }
.boton {
  flex: none;
  padding: 0 14px;
  height: 44px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.06em;
  background: var(--sello);
  color: var(--papel);
  border-color: var(--sello);
}
.boton:disabled { opacity: 0.5; }

:focus-visible { outline: 2px solid var(--aviso); outline-offset: 2px; }
#decreto:focus-visible { outline-offset: 0; }

@media (max-width: 420px) {
  .stat-nombre { font-size: 9px; letter-spacing: 0.04em; }
  .stat-valor { font-size: 18px; }
  .stats { gap: 4px; }
  .b-titulo { font-size: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  .stat-relleno { transition: none; }
  .stat.bajo .stat-valor, .cursor::after { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="cabecera">
    <div class="cabecera-fila">
      <h1 class="marca">VALDORIA</h1>
      <span class="dia" id="dia">DÍA 1/30</span>
    </div>
    <ul class="stats" id="stats" aria-label="Estado del país"></ul>
    <button type="button" class="ticker" id="ticker" title="Ver el mercado">PIB 100 · PARO 12% · INFLACIÓN 5%</button>
  </header>

  <main class="registro" id="registro" aria-live="polite"></main>

  <form class="consola" id="consola" autocomplete="off">
    <div class="chips" id="chips" aria-label="Atajos de decreto"></div>
    <div class="linea-orden">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <label for="decreto" class="oculto" hidden>Decreto</label>
      <input id="decreto" name="decreto" type="text" placeholder="Escribe tu decreto…" enterkeyhint="send" autocapitalize="sentences" spellcheck="false" maxlength="200">
      <button class="boton" id="enviar" type="submit">DECRETAR</button>
    </div>
  </form>
</div>

<script>
// js/texto.js
/*
 * Utilidades de texto: normalizar, separar palabras, raíces (stemming),
 * corrección de faltas y la mini-gramática que usa el Narrador.
 */
(function (RF) {
  'use strict';

  // Palabras que no aportan significado al decreto.
  const VACIAS = new Set((
    'el la los las lo un una unos unas de del al a en y e o u que se por para con sin ' +
    'su sus tu tus es son ser sea sean esta este estos estas ese esa eso esos esas ' +
    'aquel aquella muy pero como cuando donde desde hasta sobre entre hacia le les me te nos ' +
    'ha han he hay todo todos toda todas partir hoy dia adelante decreto decreta decreto ' +
    'ordeno ordena ordenamos quiero queremos sera seran va van vamos ahora nuevo nueva ' +
    'pais nacion nacional ciudadanos gente pueblo excelencia'
  ).split(/\s+/));

  // Negaciones que pueden dar la vuelta a un decreto ("ya no se vende el agua").
  const NEGACIONES = new Set(['no', 'nunca', 'jamas', 'dejar', 'dejen', 'deja', 'dejara', 'dejaran', 'basta']);

  const SUFIJOS = [
    'aciones', 'iciones', 'amiento', 'imiento', 'mente', 'acion', 'icion',
    'ando', 'iendo', 'ados', 'adas', 'idos', 'idas', 'ado', 'ada', 'ido', 'ida',
    'aran', 'eran', 'iran', 'aron', 'ieron', 'aras', 'eras', 'ara', 'era', 'ira',
    'ar', 'er', 'ir', 'an', 'en', 'as', 'es', 'os', 'a', 'e', 'o', 's'
  ];

  function normalizar(txt) {
    return String(txt || '')
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9%\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function palabras(txt) {
    const n = normalizar(txt);
    return n ? n.split(' ') : [];
  }

  function raiz(p) {
    if (p.length <= 4) return p;
    for (const s of SUFIJOS) {
      if (p.endsWith(s) && p.length - s.length >= 4) return p.slice(0, p.length - s.length);
    }
    return p;
  }

  function distancia(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let minFila = i;
      for (let j = 1; j <= b.length; j++) {
        const c = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c);
        if (cur[j] < minFila) minFila = cur[j];
      }
      if (minFila > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  // Corrige una palabra desconocida con la más parecida del vocabulario.
  function corregir(p, vocab) {
    if (p.length < 4 || vocab.has(p) || VACIAS.has(p) || NEGACIONES.has(p) || /\d/.test(p)) return p;
    const max = p.length <= 6 ? 1 : 2;
    let mejor = p, mejorD = max + 1;
    for (const v of vocab) {
      if (v[0] !== p[0]) continue; // las faltas reales casi nunca cambian la primera letra
      const d = distancia(p, v, max);
      if (d < mejorD) { mejor = v; mejorD = d; if (d === 1 && max === 1) break; }
    }
    return mejorD <= max ? mejor : p;
  }

  function azar(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

  // Mini-gramática: [a|b|c] elige una opción al azar, {var} inserta variables.
  function expandir(plantilla, vars) {
    let t = plantilla;
    const re = /\[([^\[\]]*)\]/;
    let m, guardia = 0;
    while ((m = re.exec(t)) && guardia++ < 200) {
      t = t.slice(0, m.index) + azar(m[1].split('|')) + t.slice(m.index + m[0].length);
    }
    // Variables globales (nombres de los ministros actuales) + las de esta llamada.
    const todas = Object.assign({}, RF.VARS || {}, vars || {});
    return t.replace(/\{(\w+)\}/g, (_, k) => (todas[k] != null ? todas[k] : '{' + k + '}'));
  }

  function de(nombre) { return /^el /i.test(nombre) ? 'del ' + nombre.slice(3) : 'de ' + nombre; }
  function a(nombre) { return /^el /i.test(nombre) ? 'al ' + nombre.slice(3) : 'a ' + nombre; }
  function mayus(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }

  RF.VARS = RF.VARS || {
    garrote: 'Garrote', n_garrote: 'General Bruno Garrote', cifuentes: 'Cifuentes', n_cifuentes: 'Leonor Cifuentes',
    sombra: 'Sombra', n_sombra: 'Octavio Sombra', paredes: 'Rolo', n_paredes: 'Rolo Paredes',
    montiel: 'Montiel', n_montiel: 'Isabela Montiel', ventura: 'Ventura', n_ventura: 'Dr. Aurelio Ventura', lider: 'Su Excelencia'
  };

  RF.texto = { VACIAS, NEGACIONES, normalizar, palabras, raiz, distancia, corregir, azar, expandir, de, a, mayus };
})(globalThis.RF = globalThis.RF || {});

// js/datos/sinonimos.js
/*
 * SINÓNIMOS Y JERGA
 * El Intérprete traduce estas palabras antes de pensar. Así entiende "tombos", "birras" o "banear"
 * sin tener que aprender frases nuevas. Claves sin tildes ni mayúsculas.
 */
(function (RF) {
  'use strict';

  RF.SINONIMOS = {
    // Fuerzas de seguridad
    milicos: 'militares', milico: 'militar', guachos: 'soldados', tombos: 'policias', tombo: 'policia',
    pacos: 'policias', paco: 'policia', pasma: 'policia', polis: 'policias', poli: 'policia', maderos: 'policias',
    cana: 'policia', chota: 'policia', pitufos: 'policias', cuarteles: 'militares',
    // Dinero y trabajo
    plata: 'dinero', lana: 'dinero', guita: 'dinero', pasta: 'dinero', billete: 'dinero', varo: 'dinero',
    chamba: 'trabajo', curro: 'trabajo', pega: 'trabajo', laburo: 'trabajo', laburantes: 'trabajadores',

        sumar(d, 'orden', 6);

        else if (o.faccion) { fac(-25); sumar(d, 'pueblo', -4); }

  // Consecuencias con retraso cuando no hay una especial para esa combinación.
  function programarGenericas(accion, o, vars) {
    const E = o.esencial || 0, R = o.rentable || 0, P = o.popular || 0;
    const p = [];
    if (accion === 'PRIVATIZAR' && E >= 2)
      p.push({ en: 3, titulo: 'Mercado negro', texto: 'Surge un mercado negro de {objeto}. Quien puede pagar, paga dos veces. Quien no, se las arregla como puede.', efectos: { orden: -4, salud: o.afecta === 'salud' ? -3 : 0 } });
    if (accion === 'PROHIBIR' && (P >= 2 || o.vicio))
      p.push({ en: 3, titulo: 'Clandestinidad', texto: 'Lo de {objeto} pasa a la clandestinidad. Lo que antes era normal ahora se hace en sótanos, y los sótanos cobran entrada.', efectos: { orden: -4, cupula: 2 } });
    if (accion === 'INVERTIR' || accion === 'CREAR')
      p.push({ en: 4, titulo: 'Los frutos de la inversión', texto: 'Empiezan a notarse los resultados de {medida}. Hasta los más críticos lo reconocen en voz baja.', efectos: { pueblo: 3 + 2 * E, [o.afecta || 'tesoro']: o.afecta ? 6 : 4 }, ingresos: R >= 1 ? 1 : 0 });

      p.push({ en: 4, titulo: 'La factura del recorte', texto: 'Los efectos de {medida} llegan a la calle: servicios cerrados, colas más largas, gente más cansada.', efectos: { pueblo: -3, [o.afecta || 'orden']: -5 } });
    if (accion === 'CASTIGAR' && o.gente && o.afecta !== 'orden')
      p.push({ en: 3, titulo: 'Miedo', texto: 'El miedo se instala en Valdoria. La gente habla más bajo y mira más veces por encima del hombro.', efectos: { orden: 3, pueblo: -3 } });
    if (accion === 'NACIONALIZAR' && R >= 2)
      p.push({ en: 2, titulo: 'Fuga de capitales', texto: 'Tras {medida}, los inversores sacan su dinero del país. El valdo cae un 20% en una tarde.', efectos: { tesoro: -4, mundo: -2 } });

  function limitar(v) { return Math.max(0, Math.min(100, Math.round(v))); }

  function aplicarEfectos(estado, efectos, registro) {
    for (const [k, v] of Object.entries(efectos || {})) {
      if (!v || !(k in estado.stats)) continue;
      const antes = estado.stats[k];
      estado.stats[k] = limitar(antes + v);

  // El personaje de a pie que protagoniza la escena: alguien a quien le importa el tema.
  function elegirCiudadano(estado, objId) {
    const ids = Object.keys(RF.CIUDADANOS).filter(id => !estado.ciudadanos[id].estado || estado.ciudadanos[id].estado === 'libre');
    if (!ids.length) return null;
    const interesados = ids.filter(id => RF.CIUDADANOS[id].intereses.includes(objId));
    const pool = interesados.length ? interesados : ids;
    pool.sort((a, b) => estado.ciudadanos[a].ultimaVez - estado.ciudadanos[b].ultimaVez);
    const candidatos = pool.slice(0, Math.min(2, pool.length));
    return T.azar(candidatos);
  }

  function elegirMinistro(deltas) {
    let mejor = null, mejorV = 0;
    for (const [id, m] of Object.entries(RF.GABINETE)) {
      for (const s of m.stats) {
        const v = Math.abs(deltas[s] || 0);
        if (v > mejorV) { mejorV = v; mejor = { id, stat: s, delta: deltas[s] }; }

    return mejor;

  function comprobarFin(estado) {
    const s = estado.stats;
    const orden = ['ejercito', 'pueblo', 'cupula', 'mundo', 'orden', 'salud'];
    for (const k of orden) if (s[k] <= 0) return k;
    if (estado.diasEnQuiebra >= 2) return 'tesoro';
    if (estado.dia > RF.PAIS.dias) {

      if (s.orden >= 55 && s.ejercito >= 50) return 'elecciones_amanadas';
      return 'elecciones_perdidas';
    }

  /*

    const clave = accion + ':' + objId;
    const especial = RF.ESPECIALES[clave];

    const programadas = inst ? [] : (especial && especial.programar)
      ? especial.programar.map(p => Object.assign({}, p, { texto: T.expandir(p.texto, vars) }))

    for (const p of programadas) estado.pendientes.push(Object.assign({}, p, { dia: estado.dia + p.en }));

    estado.historial.push({ dia: estado.dia, accion, objeto: objId, nombreObjeto: nombre, medida: laMedida, texto: interp.texto });

    reacciones(estado, res, objId, o);

    if (op.avanzar !== false) avanzarDia(estado, res);
    return res;
  }

  function reacciones(estado, res, objId, o) {
    res.ministro = elegirMinistro(res.deltas);
    const cid = elegirCiudadano(estado, objId);
    for (const c of Object.values(estado.ciudadanos)) c.animo = Math.max(-100, Math.min(100, c.animo + (res.deltas.pueblo || 0) * 0.35));

    const interesado = RF.CIUDADANOS[cid].intereses.includes(objId);
    const impacto = (res.deltas.pueblo || 0) + (interesado ? 0.5 * ((res.deltas.salud || 0) + (o && o.faccion === 'pueblo' ? res.deltas.pueblo || 0 : 0)) : 0);

  /*
   * Decreto sobre una persona: "matar a Garrote", "encarcelar a Nico", "premiar a la canciller".

  function decretarPersona(estado, interp, op) {
    op = op || {};

    if (t.nulo) { res.nulo = t.nulo; return res; }
    res.medida = t.medida;
    res.nombreObjeto = t.nombre;
    res.vars = { objeto: t.nombre, Objeto: t.nombre, medida: t.medida, Medida: T.mayus(t.medida), lider: 'Su Excelencia' };

  function avanzarDia(estado, res) {

    res.economia = economia.tesoro || 0;

    // Desgaste del poder: la paciencia se agota y la euforia se enfría.

    for (const [k, v] of Object.entries(estado.stats)) if (v > 75) sumar(desgaste, k, -2);

    const inst = RF.poder.dia(estado, res);

      for (const h of RF.CIUDADANOS[id].hitos) {

/*
 * EL DIRECTOR DE EVENTOS

 *  - Si algo urgente está pasando (huelga, rumores de golpe...), salta a los 2 días del último evento.

  function datos(e) {

  }

  function porId(id) { return RF.DILEMAS.find(d => d.id === id); }

  function disponible(e, d) {
    const D = datos(e);
    if (d.soloCadena) return false;
    const visto = D.vistos[d.id];

  function elegir(lista) {

  // Se llama al final de cada día. Devuelve el dilema que salta hoy, o null.

/*
 * LA ECONOMÍA
 * Cada sector tiene un peso (parte de la economía), un precio mundial que fluctúa y un dueño.
 * Cada día:
 *   1. los precios se mueven (con tendencia a volver a su valor normal)
 *   2. si hay una reconversión en marcha ("toda la economía al carbón"), el sector elegido crece y los demás encogen

(function (RF) {

  const T = RF.texto;
  const OBJETIVO_MODELO = 52;

  function nueva() {
    const sectores = {};
    for (const [id, s] of Object.entries(RF.SECTORES)) sectores[id] = { peso: s.peso, precio: s.base, dueno: s.dueno, legal: !s.ilegal };
    const eco = { sectores, defs: {}, modelo: null, pib: 0, pibAyer: 0, paro: 12, inflacion: 5, extraInflacion: 0, contaminacion: 0, alertas: {}, acum: {} };
    const c = calcular(eco);
    eco.pib = eco.pibAyer = eco.pibBase = c.pib;
    eco.empleoBase = c.empleo;
    eco.contaminacion = c.sucio * 0.35;
    return eco;
  }

  function datos(e) {
    if (!e.eco) e.eco = nueva();
    return e.eco;
  }

  function def(eco, id) { return RF.SECTORES[id] || eco.defs[id]; }

  function calcular(eco) {

  function sectorExotico(eco, nombre) {

  /*
   * Efectos económicos de un decreto. Devuelve { efectos, notas } que el Consejero suma a los del decreto.

  function aplicarDecreto(e, accion, objId, nombre) {
    const eco = datos(e);
    const efectos = {};
    const notas = [];
    const sumar = (k, v) => { efectos[k] = (efectos[k] || 0) + v; };

    if (objId === 'DINERO') {
      if (accion === 'CREAR' || accion === 'SUBSIDIAR' || accion === 'INVERTIR') {
        sumar('tesoro', 14); eco.extraInflacion += 25;
        notas.push('Las imprentas del Banco Central trabajan día y noche. En unos días, los precios empezarán a subir.');
      } else if (accion === 'PROHIBIR' || accion === 'PRIVATIZAR') {

        notas.push('Adiós al valdo: Valdoria usará moneda extranjera. La inflación bajará, pero ya no podrás imprimir dinero.');
      } else if (accion === 'RECORTAR' || accion === 'BAJAR_IMPUESTO') {

      } else if (sec === 'carbon') { sumar('mundo', -5); sumar('cupula', 3); }
      else if (sec === 'tecnologia' || sec === 'turismo') sumar('mundo', 3);
      else if (sec === 'exotico') { sumar('mundo', -3); notas.push('Ningún economista del mundo había contemplado este modelo. Algunos piden verlo de cerca.'); }

      case 'RECORTAR': s.peso = Math.max(0, s.peso - 3); break;

      case 'NACIONALIZAR': s.dueno = 'estado'; if (sec === 'narco') s.legal = true; break;

  // Ajustes que vienen de un evento ({ sectores: {narco: -10}, inflacion: 20, paro: -5, modelo: null }).

    const eco = datos(e);

      if (id === 'narco' && s.legal && s.dueno === 'privado') objetivo = d.base * 0.75; // con competencia legal, paga menos

    vaciar();
    tarjetaAbierta.b.elegida = i;
    tarjetaAbierta.cont.querySelectorAll('button').forEach((x, k) => { x.disabled = true; x.classList.toggle('elegida', k === i); });
    tarjetaAbierta = null;
    const antes = Object.assign({}, estado.stats);
    const r = RF.director.resolver(estado, i);
    mostrar([{ tipo: 'eco', texto: LETRAS[i] + ') ' + RF.texto.expandir(d.opciones[i].texto) }], false);
    mostrar(RF.narrador.decision(estado, r), true);
    pintarStats(cambios(antes));
    actualizarConsola();
    guardar();
  }

  // Mientras hay un evento abierto, la consola lo recuerda.
  function actualizarConsola() {
    const d = RF.director.pendiente(estado);
    $('consola').classList.toggle('aviso-pendiente', !!d);
    $('decreto').placeholder = d ? 'Elige A, B o C en el evento…' : estado.fin ? 'Escribe "reiniciar"…' : 'Escribe tu decreto…';
  }

  function reiniciar() {
    estado = RF.consejero.nuevoEstado();
    vaciar();
    tarjetaAbierta = null;
    registro = [];
    $('registro').innerHTML = '';
    pintarStats();
    mostrar(RF.narrador.intro(estado), false);
    actualizarConsola();
    guardar();
  }

  function procesar(entrada) {
    const texto = entrada.trim();
    if (!texto) return;
    const orden = RF.texto.normalizar(texto);
    mostrar([{ tipo: 'eco', texto }], false);

    if (pendienteReinicio) {
      pendienteReinicio = false;
      if (/^(si|s|confirmar|reiniciar)$/.test(orden)) { reiniciar(); return; }
      mostrar([{ tipo: 'nota', texto: 'Seguimos gobernando.' }], false);
      return;
    }
    if (/^(reiniciar|reset|nueva partida|empezar de nuevo)$/.test(orden)) {
      if (estado.fin) { reiniciar(); return; }
      pendienteReinicio = true;
      mostrar([{ tipo: 'nota', texto: '¿Seguro que quieres abandonar el poder y empezar de cero? Escribe "sí" para confirmar.' }], false);
      return;
    }
    if (/^(ayuda|help|\?)$/.test(orden)) { mostrar(RF.narrador.ayuda(), false); return; }
    if (/^(estado|informe|situacion)$/.test(orden)) { mostrar(RF.narrador.estadoPais(estado), false); return; }
    if (/^(gabinete|ministros|poder|instituciones)$/.test(orden)) { mostrar(RF.narrador.gabinete(estado), false); return; }
    if (/^(economia|mercado|informe economico)$/.test(orden)) { mostrar(RF.narrador.economia(estado), false); return; }
    if (/^(historial|decretos|archivo)$/.test(orden)) { mostrar(RF.narrador.historial(estado), false); return; }

    if (estado.fin) {
      mostrar([{ tipo: 'nota', texto: 'Tu gobierno ha terminado. Escribe "reiniciar" para empezar otra partida.' }], false);
      return;
    }

    const pend = RF.director.pendiente(estado);
    if (pend) {
      const m = orden.match(/^(?:opcion )?([1-3]|[abc])\)?$/);
      if (m) { const i = /\d/.test(m[1]) ? +m[1] - 1 : 'abc'.indexOf(m[1]); if (i < pend.opciones.length) { elegirOpcion(i); return; } }
      mostrar([{ tipo: 'nota', texto: 'Antes de firmar nada más, decide qué hacer con el evento "' + pend.titulo + '". Pulsa una opción o escribe A, B o C.' }], false);
      return;
    }

    const lista = RF.interprete.interpretarVarios(texto, estado);
    if (lista.length > 1) { firmar(lista); return; }
    const interp = lista[0];
    if (interp.estado === 'ok') { firmar([interp]); return; }
    if (interp.estado === 'confuso') { mostrar(RF.narrador.confuso(interp), true); guardar(); return; }
    const q = RF.narrador.pregunta(interp);
    mostrar(q.bloques, true);
    if (q.opciones.length) mostrarOpciones(q.opciones);
    guardar();
  }

  // ---------- Controles ----------
  function montarAtajos() {
    const cont = $('chips');
    for (const [etiqueta, valor, esComando] of ATAJOS) {
      const b = el('button', 'chip' + (esComando ? ' cmd' : ''), etiqueta);
      b.type = 'button';
      b.addEventListener('click', () => {
        const input = $('decreto');
        if (esComando || !valor.endsWith(' ')) { vaciar(); procesar(valor); return; }
        input.value = valor;
        input.focus();
        try { input.setSelectionRange(valor.length, valor.length); } catch (e) { /* algunos navegadores no lo permiten */ }
      });
      cont.appendChild(b);
    }
  }

  function iniciar() {
    RF.interprete.entrenar();
    montarStats();
    montarAtajos();

    const guardada = cargar();
    if (guardada) {
      estado = guardada.estado;
      // Partidas guardadas con versiones anteriores: se completan con lo nuevo.
      if (!estado.eco) estado.eco = RF.economia.nueva();
      RF.poder.iniciar(estado);
      registro = [];
      mostrar(guardada.registro, false);
      mostrar([{ tipo: 'nota', texto: 'Partida recuperada. Bienvenido de vuelta a Palacio, Excelencia.' }], false);
      // Si había un evento abierto y su tarjeta no quedó en el registro, se vuelve a mostrar.
      const d = RF.director.pendiente(estado);
      if (d && !tarjetaAbierta) mostrar([RF.narrador.dilema(estado, d)], false);
      pintarStats();
      actualizarConsola();
    } else {
      reiniciar();
    }

    $('consola').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('decreto');
      const v = input.value;
      input.value = '';
      vaciar();
      procesar(v);
    });
    // Tocar la historia acelera el texto.
    $('registro').addEventListener('click', (e) => { if (!e.target.closest('button')) saltar = true; });
    $('ticker').addEventListener('click', () => { vaciar(); procesar('economía'); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})(globalThis.RF = globalThis.RF || {});
</script>
</body>
</html>
