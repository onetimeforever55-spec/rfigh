<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#14110d">
<title>Consola de Valdoria</title>
<meta name="description" content="Gobierna un país escribiendo decretos en una consola. Tus órdenes cambian el país y la vida de su gente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=VT323&display=swap">
<style>
/* Terminal presidencial: fósforo ámbar sobre negro cálido; los decretos salen impresos en papel. */
:root {
  color-scheme: dark;
  --fondo: #14110d;
  --fondo-2: #1d1812;
  --linea: #3a2f21;
  --ambar: #ffb547;
  --ambar-tenue: #b98a3e;
  --ambar-oscuro: #6e5429;
  --papel: #efe6d2;
  --tinta: #2b2418;
  --sello: #d0452f;
  --bien: #9ad17f;
  --mal: #ff6b52;
  --aviso: #ffd166;
  --f-terminal: 'VT323', 'Courier New', monospace;
  --f-texto: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --f-papel: 'Special Elite', 'Courier New', Courier, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--ambar);
  font-family: var(--f-texto);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.app {
  height: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    repeating-linear-gradient(to bottom, rgba(255, 181, 71, 0.025) 0 1px, transparent 1px 3px),
    var(--fondo);
}

/* ---------- Cabecera y barras del país ---------- */
.cabecera {
  flex: none;
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--linea);
  background: var(--fondo);
}
.cabecera-fila {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.marca {
  font-family: var(--f-terminal);
  font-size: 26px;
  line-height: 1;
  letter-spacing: 0.04em;
  margin: 0;
  font-weight: 400;
  text-shadow: 0 0 8px rgba(255, 181, 71, 0.35);
}
.dia {
  font-family: var(--f-terminal);
  font-size: 22px;
  line-height: 1;
  color: var(--ambar-tenue);
  font-variant-numeric: tabular-nums;
}
.stats {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 2px; }
.stat-nombre { font-size: 10px; letter-spacing: 0.08em; color: var(--ambar-tenue); }
.stat-valor { font-family: var(--f-terminal); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-barra { height: 4px; background: var(--linea); position: relative; overflow: hidden; }
.stat-relleno { position: absolute; inset: 0 auto 0 0; background: var(--ambar); transition: width 0.6s ease; }
.stat.medio .stat-relleno { background: var(--aviso); }
.stat.bajo .stat-relleno { background: var(--mal); }
.stat.bajo .stat-valor { color: var(--mal); animation: parpadeo 1.2s steps(2) infinite; }
.stat .cambio {
  font-size: 10px; height: 12px; line-height: 12px; text-align: right;
  font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 0.3s;
}
.stat .cambio.visible { opacity: 1; }
.cambio.sube { color: var(--bien); }
.cambio.baja { color: var(--mal); }

@keyframes parpadeo { 50% { opacity: 0.45; } }

/* ---------- Historia ---------- */
.registro {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.bloque { max-width: 65ch; }
.bloque p { margin: 0; white-space: pre-wrap; }
.etiqueta {
  display: block;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--ambar-tenue);
  margin-bottom: 2px;
}

.b-titulo {
  font-family: var(--f-terminal);
  font-size: 40px;
  line-height: 1;
  text-align: left;
  text-wrap: balance;
  text-shadow: 0 0 12px rgba(255, 181, 71, 0.4);
  margin-top: 8px;
}

.b-eco, .b-bot { display: flex; gap: 1ch; }
.b-eco { color: var(--ambar); font-weight: 600; margin-top: 6px; }
.b-eco::before { content: '>'; color: var(--ambar-tenue); flex: none; }

.b-bot { font-size: 12px; color: var(--ambar-tenue); opacity: 0.75; letter-spacing: 0.02em; }
.b-bot::before { content: '▸'; flex: none; }

.b-nota { font-size: 13px; font-style: italic; color: var(--ambar-tenue); }

/* La Gaceta Oficial: un papel impreso dentro de la terminal. */
.b-gaceta {
  position: relative;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--f-papel);
  padding: 14px 16px 16px;
  box-shadow: 0 2px 0 var(--ambar-oscuro), 0 10px 24px rgba(0, 0, 0, 0.45);
  transform: rotate(-0.4deg);
  overflow: hidden;
}
.b-gaceta .etiqueta {
  color: var(--tinta);
  opacity: 0.7;
  border-bottom: 1px dashed rgba(43, 36, 24, 0.4);
  padding-bottom: 4px;
  margin-bottom: 8px;
  font-family: var(--f-texto);
}
.b-gaceta p { font-size: 15px; line-height: 1.5; }
.sello {
  position: absolute;
  right: 10px;
  top: 8px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.1em;
  color: var(--sello);
  border: 2px solid var(--sello);
  padding: 0 6px;
  transform: rotate(8deg);
  opacity: 0.85;
  pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) {
  .sello { animation: sellar 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
}
@keyframes sellar {
  from { transform: rotate(8deg) scale(2.2); opacity: 0; }
  to { transform: rotate(8deg) scale(1); opacity: 0.85; }
}

.b-efectos { display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.efecto { padding: 1px 7px; border: 1px solid var(--linea); background: var(--fondo-2); white-space: nowrap; }
.efecto.sube { color: var(--bien); }
.efecto.baja { color: var(--mal); }
.efecto.neutro { color: var(--ambar-tenue); }

.b-cupula, .b-calle { padding-left: 12px; border-left: 2px solid var(--ambar-oscuro); }
.b-calle { border-left-style: dotted; }

.b-suceso { padding: 10px 12px; background: var(--fondo-2); border: 1px solid var(--linea); }
.b-suceso.umbral { border-color: var(--mal); }
.b-suceso.umbral .etiqueta { color: var(--mal); }
.b-suceso.hito .etiqueta { color: var(--aviso); }
.b-suceso .mini { margin-top: 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.mini .sube { color: var(--bien); }
.mini .baja { color: var(--mal); }

.b-sistema { padding: 10px 12px; border: 1px dashed var(--ambar-oscuro); font-size: 13px; }
.b-sistema.mono p { font-variant-numeric: tabular-nums; overflow-x: auto; white-space: pre; }

.b-fin {
  border: 3px double var(--sello);
  padding: 16px;
  color: var(--papel);
  background: rgba(208, 69, 47, 0.08);
}
.b-fin .etiqueta { font-family: var(--f-terminal); font-size: 30px; line-height: 1.1; letter-spacing: 0.06em; color: var(--sello); margin-bottom: 8px; }

.opciones { display: flex; flex-direction: column; gap: 8px; }
.opcion, .chip, .boton {
  font: inherit;
  color: var(--ambar);
  background: var(--fondo-2);
  border: 1px solid var(--ambar-oscuro);
  cursor: pointer;
  touch-action: manipulation;
}
.opcion { text-align: left; padding: 10px 12px; font-size: 14px; }
.opcion::before { content: '[ ] '; color: var(--ambar-tenue); }
.opcion:hover { border-color: var(--ambar); }
.opcion:disabled { opacity: 0.4; cursor: default; }
.opcion.elegida { opacity: 1; border-color: var(--ambar); }
.opcion.elegida::before { content: '[x] '; }

.cursor::after {
  content: '▌';
  animation: parpadeo 0.8s steps(2) infinite;
  margin-left: 1px;
}

/* ---------- Consola ---------- */
.consola {
  flex: none;
  border-top: 1px solid var(--linea);
  background: var(--fondo);
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 0 16px;
}
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 13px; padding: 5px 10px; white-space: nowrap; }
.chip.cmd { color: var(--ambar-tenue); border-style: dashed; }
.chip:hover { border-color: var(--ambar); }

.linea-orden { display: flex; align-items: stretch; gap: 8px; }
.prompt { font-family: var(--f-terminal); font-size: 26px; line-height: 44px; color: var(--ambar-tenue); }
#decreto {
  flex: 1;
  min-width: 0;
  font-family: var(--f-texto);
  font-size: 16px;
  color: var(--ambar);
  background: var(--fondo-2);
  border: 1px solid var(--ambar-oscuro);
  padding: 0 10px;
  height: 44px;
  caret-color: var(--ambar);
  border-radius: 0;
}
#decreto::placeholder { color: var(--ambar-oscuro); }
.boton {
  flex: none;
  padding: 0 14px;
  height: 44px;
  font-family: var(--f-terminal);
  font-size: 22px;
  letter-spacing: 0.06em;
  background: var(--sello);
  color: var(--papel);
  border-color: var(--sello);
}
.boton:disabled { opacity: 0.5; }

:focus-visible { outline: 2px solid var(--aviso); outline-offset: 2px; }
#decreto:focus-visible { outline-offset: 0; }

@media (max-width: 420px) {
  .stat-nombre { font-size: 9px; letter-spacing: 0.04em; }
  .stat-valor { font-size: 18px; }
  .stats { gap: 4px; }
  .b-titulo { font-size: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  .stat-relleno { transition: none; }
  .stat.bajo .stat-valor, .cursor::after { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="cabecera">
    <div class="cabecera-fila">
      <h1 class="marca">VALDORIA</h1>
      <span class="dia" id="dia">DÍA 1/30</span>
    </div>
    <ul class="stats" id="stats" aria-label="Estado del país"></ul>
  </header>

  <main class="registro" id="registro" aria-live="polite"></main>

  <form class="consola" id="consola" autocomplete="off">
    <div class="chips" id="chips" aria-label="Atajos de decreto"></div>
    <div class="linea-orden">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <label for="decreto" class="oculto" hidden>Decreto</label>
      <input id="decreto" name="decreto" type="text" placeholder="Escribe tu decreto…" enterkeyhint="send" autocapitalize="sentences" spellcheck="false" maxlength="200">
      <button class="boton" id="enviar" type="submit">DECRETAR</button>
    </div>
  </form>
</div>

<script>
// js/texto.js
/*
 * Utilidades de texto: normalizar, separar palabras, raíces (stemming),
 * corrección de faltas y la mini-gramática que usa el Narrador.
 */
(function (RF) {
  'use strict';

  // Palabras que no aportan significado al decreto.
  const VACIAS = new Set((
    'el la los las lo un una unos unas de del al a en y e o u que se por para con sin ' +
    'su sus tu tus es son ser sea sean esta este estos estas ese esa eso esos esas ' +
    'aquel aquella muy pero como cuando donde desde hasta sobre entre hacia le les me te nos ' +
    'ha han he hay todo todos toda todas partir hoy dia adelante decreto decreta decreto ' +
    'ordeno ordena ordenamos quiero queremos sera seran va van vamos ahora nuevo nueva ' +
    'pais nacion nacional ciudadanos gente pueblo excelencia'
  ).split(/\s+/));

  // Negaciones que pueden dar la vuelta a un decreto ("ya no se vende el agua").
  const NEGACIONES = new Set(['no', 'nunca', 'jamas', 'dejar', 'dejen', 'deja', 'dejara', 'dejaran', 'basta']);

  const SUFIJOS = [
    'aciones', 'iciones', 'amiento', 'imiento', 'mente', 'acion', 'icion',
    'ando', 'iendo', 'ados', 'adas', 'idos', 'idas', 'ado', 'ada', 'ido', 'ida',
    'aran', 'eran', 'iran', 'aron', 'ieron', 'aras', 'eras', 'ara', 'era', 'ira',
    'ar', 'er', 'ir', 'an', 'en', 'as', 'es', 'os', 'a', 'e', 'o', 's'
  ];

  function normalizar(txt) {
    return String(txt || '')
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9%\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function palabras(txt) {
    const n = normalizar(txt);
    return n ? n.split(' ') : [];
  }

  function raiz(p) {
    if (p.length <= 4) return p;
    for (const s of SUFIJOS) {
      if (p.endsWith(s) && p.length - s.length >= 4) return p.slice(0, p.length - s.length);
    }
    return p;
  }

  function distancia(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let minFila = i;
      for (let j = 1; j <= b.length; j++) {
        const c = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c);
        if (cur[j] < minFila) minFila = cur[j];
      }
      if (minFila > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  // Corrige una palabra desconocida con la más parecida del vocabulario.
  function corregir(p, vocab) {
    if (p.length < 4 || vocab.has(p) || VACIAS.has(p) || NEGACIONES.has(p) || /\d/.test(p)) return p;
    const max = p.length <= 5 ? 1 : 2;
    let mejor = p, mejorD = max + 1;
    for (const v of vocab) {
      const d = distancia(p, v, max);
      if (d < mejorD) { mejor = v; mejorD = d; if (d === 1 && max === 1) break; }
    }
    return mejorD <= max ? mejor : p;
  }

  function azar(lista) { return lista[Math.floor(Math.random() * lista.length)]; }

  // Mini-gramática: [a|b|c] elige una opción al azar, {var} inserta variables.
  function expandir(plantilla, vars) {
    let t = plantilla;
    const re = /\[([^\[\]]*)\]/;
    let m, guardia = 0;
    while ((m = re.exec(t)) && guardia++ < 200) {
      t = t.slice(0, m.index) + azar(m[1].split('|')) + t.slice(m.index + m[0].length);
    }
    return t.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] != null ? vars[k] : '{' + k + '}'));
  }

  function de(nombre) { return /^el /i.test(nombre) ? 'del ' + nombre.slice(3) : 'de ' + nombre; }
  function a(nombre) { return /^el /i.test(nombre) ? 'al ' + nombre.slice(3) : 'a ' + nombre; }
  function mayus(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }

  RF.texto = { VACIAS, NEGACIONES, normalizar, palabras, raiz, distancia, corregir, azar, expandir, de, a, mayus };
})(globalThis.RF = globalThis.RF || {});

/*
 * EL INTÉRPRETE
 * Un pequeño bot que entiende decretos escritos libremente.
 *
 * Usa dos clasificadores Naive Bayes (uno para la ACCIÓN y otro para el OBJETO)
 * entrenados con las frases de ejemplo de acciones.js y objetos.js.
 * Además corrige faltas de ortografía, detecta negaciones ("ya no se vende...")
 * e intensidad ("subir MUCHO los impuestos").

  const FUERTES = new Set(['mucho', 'muchisimo', 'muchos', 'doble', 'duplicar', 'triple', 'triplicar', 'totalmente',
    'completamente', 'absolutamente', 'ejecutar', 'fusilar', 'matar', 'muerte', 'exterminar', 'radical', 'brutal',
    'masivo', 'masivamente', 'enorme', 'extremo', 'terminantemente', 'aplastar']);

    'simbolico', 'temporalmente', 'leve', 'tantito']);

  // Convierte un texto en rasgos: raíces de palabras con significado + pares de raíces.
  function rasgos(palabras) {
    const utiles = palabras.filter(p => !T.VACIAS.has(p));
    const raices = utiles.map(T.raiz);
    const out = raices.slice();
    // La palabra exacta también cuenta ("impuesto" no es igual que "impuestos").
    utiles.forEach((p, i) => { if (p !== raices[i]) out.push('=' + p); });
    for (let i = 0; i < raices.length - 1; i++) out.push(raices[i] + '_' + raices[i + 1]);
    return out;
  }

  function crearClasificador() {
    return { cuentas: {}, totales: {}, vocab: new Set(), clases: [] };
  }

    if (yaHecho) res.notas.push('Eso ya estaba hecho. El decreto se archiva junto al anterior y apenas cambia nada.');
    else if (rep > 0) res.notas.push(rep === 1 ? 'Ya habías decretado algo así. La gente lo nota menos.' : 'Otra vez lo mismo. Ya casi nadie presta atención.');

    const previa = estado.politicas[objId];

      sumar(efectos, 'mundo', -3); sumar(efectos, 'cupula', -4);

    const ingresosAntes = estado.ingresos;
    estado.ingresos = Math.max(-6, Math.min(6, estado.ingresos + Math.round(base.ingresos * Math.min(1, factor))));

    const desgaste = { pueblo: -1 };

    // Consecuencias que tocan hoy.
    const hoy = estado.pendientes.filter(p => p.dia <= estado.dia);
    estado.pendientes = estado.pendientes.filter(p => p.dia > estado.dia);
    for (const p of hoy) {
      const reg = {};
      aplicarEfectos(estado, p.efectos, reg);
      if (p.ingresos) estado.ingresos = Math.max(-6, Math.min(6, estado.ingresos + p.ingresos));

        if (c.hitos.includes(h.id)) continue;
        if ((h.bajo != null && c.animo <= h.bajo) || (h.alto != null && c.animo >= h.alto)) {
          c.hitos.push(h.id);

    let texto = T.expandir(T.azar(m.delta > 0 ? min.pos : min.neg), res.vars);

      cola.push({ b, animar: animar && !reducirMovimiento && ANIMADOS.has(b.tipo) });
    }
    if (registro.length > MAX_REGISTRO * 1.5) registro = registro.slice(-MAX_REGISTRO);
    if (!escribiendo) siguiente();
  }

  function alFondo() { const r = $('registro'); r.scrollTop = r.scrollHeight; }

  function siguiente() {
    let item;
    while ((item = cola.shift())) {
      const { nodo, parrafo, texto } = crearBloque(item.b);
      $('registro').appendChild(nodo);
      if (!parrafo || !item.animar || saltar) { if (parrafo) parrafo.textContent = texto; continue; }
      let i = 0;
      actual = { parrafo, texto };
      parrafo.classList.add('cursor');
      const paso = () => {
        i = saltar ? texto.length : Math.min(texto.length, i + 4);
        parrafo.textContent = texto.slice(0, i);
        alFondo();
        if (i < texto.length) escribiendo = requestAnimationFrame(paso);
        else { parrafo.classList.remove('cursor'); actual = null; escribiendo = setTimeout(siguiente, saltar ? 0 : 180); }
      };
      escribiendo = requestAnimationFrame(paso);
      return;
    }
    alFondo();
    escribiendo = null;
    saltar = false;
  }

  // Termina de golpe todo lo que se estaba escribiendo.
  function vaciar() {
    if (escribiendo) { clearTimeout(escribiendo); cancelAnimationFrame(escribiendo); }
    if (actual) { actual.parrafo.textContent = actual.texto; actual.parrafo.classList.remove('cursor'); actual = null; }
    while (cola.length) {
      const { nodo, parrafo, texto } = crearBloque(cola.shift().b);
      if (parrafo) parrafo.textContent = texto;
      $('registro').appendChild(nodo);
    }
    escribiendo = null;
    saltar = false;
    alFondo();
  }

  function mostrarOpciones(opciones) {
    const cont = el('div', 'bloque opciones');
    for (const op of opciones) {
      const b = el('button', 'opcion', op.etiqueta);
      b.type = 'button';
      b.addEventListener('click', () => {
        cont.querySelectorAll('button').forEach(x => { x.disabled = true; });
        b.classList.add('elegida');
        vaciar();
        firmar(op.interp);
      });
      cont.appendChild(b);
    }
    const esperar = () => { if (escribiendo || cola.length) setTimeout(esperar, 100); else { $('registro').appendChild(cont); alFondo(); } };
    esperar();
  }

  // ---------- Turno ----------
  function firmar(interp) {
    const antes = Object.assign({}, estado.stats);
    const res = RF.consejero.decretar(estado, interp);
    const bloques = RF.narrador.turno(estado, interp, res);
    const cambio = {};
    for (const k of Object.keys(antes)) cambio[k] = estado.stats[k] - antes[k];
    mostrar(bloques, true);
    pintarStats(cambio);
    guardar();
  }

  function reiniciar() {
    estado = RF.consejero.nuevoEstado();
    vaciar();
    registro = [];
    $('registro').innerHTML = '';
    pintarStats();
    mostrar(RF.narrador.intro(estado), false);
    guardar();
  }

  function procesar(entrada) {
    const texto = entrada.trim();
    if (!texto) return;
    const orden = RF.texto.normalizar(texto);
    mostrar([{ tipo: 'eco', texto }], false);

    if (pendienteReinicio) {
      pendienteReinicio = false;
      if (/^(si|s|confirmar|reiniciar)$/.test(orden)) { reiniciar(); return; }
      mostrar([{ tipo: 'nota', texto: 'Seguimos gobernando.' }], false);
      return;
    }
    if (/^(reiniciar|reset|nueva partida|empezar de nuevo)$/.test(orden)) {
      if (estado.fin) { reiniciar(); return; }
      pendienteReinicio = true;
      mostrar([{ tipo: 'nota', texto: '¿Seguro que quieres abandonar el poder y empezar de cero? Escribe "sí" para confirmar.' }], false);
      return;
    }
    if (/^(ayuda|help|\?)$/.test(orden)) { mostrar(RF.narrador.ayuda(), false); return; }
    if (/^(estado|informe|situacion)$/.test(orden)) { mostrar(RF.narrador.estadoPais(estado), false); return; }
    if (/^(gabinete|ministros)$/.test(orden)) { mostrar(RF.narrador.gabinete(estado), false); return; }
    if (/^(historial|decretos|archivo)$/.test(orden)) { mostrar(RF.narrador.historial(estado), false); return; }

    if (estado.fin) {
      mostrar([{ tipo: 'nota', texto: 'Tu gobierno ha terminado. Escribe "reiniciar" para empezar otra partida.' }], false);
      return;
    }

    const interp = RF.interprete.interpretar(texto);
    if (interp.estado === 'ok') { firmar(interp); return; }
    if (interp.estado === 'confuso') { mostrar(RF.narrador.confuso(interp), true); guardar(); return; }
    const q = RF.narrador.pregunta(interp);
    mostrar(q.bloques, true);
    if (q.opciones.length) mostrarOpciones(q.opciones);
    guardar();
  }

  // ---------- Controles ----------
  function montarAtajos() {
    const cont = $('chips');
    for (const [etiqueta, valor, esComando] of ATAJOS) {
      const b = el('button', 'chip' + (esComando ? ' cmd' : ''), etiqueta);
      b.type = 'button';
      b.addEventListener('click', () => {
        const input = $('decreto');
        if (esComando || !valor.endsWith(' ')) { vaciar(); procesar(valor); return; }
        input.value = valor;
        input.focus();
        try { input.setSelectionRange(valor.length, valor.length); } catch (e) { /* algunos navegadores no lo permiten */ }
      });
      cont.appendChild(b);
    }
  }

  function iniciar() {
    RF.interprete.entrenar();
    montarStats();
    montarAtajos();

    const guardada = cargar();
    if (guardada) {
      estado = guardada.estado;
      registro = [];
      mostrar(guardada.registro, false);
      mostrar([{ tipo: 'nota', texto: 'Partida recuperada. Bienvenido de vuelta a Palacio, Excelencia.' }], false);
      pintarStats();
    } else {
      reiniciar();
    }

    $('consola').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('decreto');
      const v = input.value;
      input.value = '';
      vaciar();
      procesar(v);
    });
    // Tocar la historia acelera el texto.
    $('registro').addEventListener('click', (e) => { if (!e.target.closest('button')) saltar = true; });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})(globalThis.RF = globalThis.RF || {});
</script>
</body>
</html>
