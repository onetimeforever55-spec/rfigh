[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memebot"
version = "1.0.0"
description = "Automated memecoin trading bot for Solana"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
live = ["solders>=0.21", "solana>=0.34", "base58>=2.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
memebot = "memebot.cli:main"

[tool.setuptools.packages.find]
include = ["memebot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
