<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a100c">
<title>Consola de Pionyang</title>
<meta name="description" content="Gobierna Corea del Norte escribiendo decretos en una consola. Tus órdenes cambian el país y la vida de su gente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Special+Elite&family=VT323&display=swap">
<!--ESTILOS-->
<link rel="stylesheet" href="css/estilo.css">
<!--/ESTILOS-->
</head>
<body>
<div class="app">
  <header class="cabecera">
    <div class="cabecera-fila">
      <h1 class="marca">RPDC <button type="button" class="regimen r-juche" id="regimen" title="Ver el sistema político">JUCHE</button></h1>
      <span class="cabecera-der"><button type="button" class="boton-ia" id="boton-ia" title="Narrador con IA: pon aquí tu clave de API">IA</button><span class="dia" id="dia">TURNO 1</span></span>
    </div>
    <ul class="stats" id="stats" aria-label="Estado del país"></ul>
    <button type="button" class="ticker" id="ticker" title="Ver las leyes vigentes">BALANCE +0M POR TURNO · 0 LEYES VIGENTES</button>
  </header>

  <main class="registro" id="registro" aria-live="polite"></main>
  <button type="button" class="ir-abajo" id="ir-abajo" hidden>↓ texto nuevo</button>

  <form class="consola" id="consola" autocomplete="off">
    <div class="chips" id="chips" aria-label="Atajos de decreto"></div>
    <div class="linea-orden">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <label for="decreto" class="oculto" hidden>Decreto</label>
      <input id="decreto" name="decreto" type="text" placeholder="Escribe tu decreto…" enterkeyhint="send" autocapitalize="sentences" spellcheck="false" maxlength="200">
      <button class="boton" id="enviar" type="submit">DECRETAR</button>
    </div>
  </form>
</div>

<!--SCRIPTS-->
<script src="js/texto.js"></script>
<script src="js/datos/paises.js"></script>
<script src="js/datos/sinonimos.js"></script>
<script src="js/datos/acciones.js"></script>
<script src="js/datos/objetos.js"></script>
<script src="js/datos/personajes.js"></script>
<script src="js/datos/eventos.js"></script>
<script src="js/datos/dilemas.js"></script>
<script src="js/datos/voces.js"></script>
<script src="js/datos/mercado.js"></script>
<script src="js/datos/poder.js"></script>
<script src="js/datos/regimenes.js"></script>
<script src="js/datos/temas.js"></script>
<script src="js/datos/exterior.js"></script>
<script src="js/interprete.js"></script>
<script src="js/leyes.js"></script>
<script src="js/consejero.js"></script>
<script src="js/director.js"></script>
<script src="js/poder.js"></script>
<script src="js/politica.js"></script>
<script src="js/diplomacia.js"></script>
<script src="js/narrador.js"></script>
<script src="js/narradorIA.js"></script>
<script src="js/consejoIA.js"></script>
<script src="js/juego.js"></script>
<!--/SCRIPTS-->
</body>
</html>
