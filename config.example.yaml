# memebot configuration.
# Copy to config.yaml and edit. Secrets do NOT go here — see .env.example.
#
# Every value below is the built-in default, shown so you can see what exists.

database_path: data/memebot.db
log_level: INFO
log_file: logs/memebot.log

execution:
  # "paper" simulates fills against live prices. Run it for at least a few
  # days before even thinking about "live".
  mode: paper
  slippage_bps: 300          # 3% max slippage on a swap
  priority_fee_lamports: 200000
  max_price_impact_pct: 4.0  # refuse a trade that would move the price more
  paper_fee_pct: 0.35        # simulated round-trip cost in paper mode
  paper_slippage_pct: 1.0    # simulated base slippage, before size impact
  confirm_timeout_s: 90
  max_swap_retries: 3

risk:
  starting_equity_usd: 1000   # paper mode only; live reads the real wallet
  position_size_usd: 25       # target size per trade
  position_size_pct_equity: 3 # never risk more than this share of equity
  max_open_positions: 5
  max_daily_loss_usd: 150     # hit this and the bot stops opening trades
  max_daily_trades: 40
  min_cash_reserve_usd: 0
  rebuy_cooldown_minutes: 120 # do not immediately re-buy something you sold

screener:
  # Hard safety gates. A token failing ANY of these is never bought.
  min_liquidity_usd: 20000
  max_liquidity_usd: 3000000
  min_volume_h1_usd: 25000
  min_volume_h24_usd: 100000
  min_txns_h1: 75
  min_volume_liquidity_ratio: 0.5
  max_volume_liquidity_ratio: 60      # higher usually means wash trading
  min_age_minutes: 20                 # skip the first minutes, that is rug hour
  max_age_hours: 96
  min_market_cap_usd: 50000
  max_market_cap_usd: 30000000
  max_mcap_liquidity_ratio: 150       # thin float relative to valuation
  chain_id: solana
  allowed_quote_mints:
    - So11111111111111111111111111111111111111112   # SOL
    - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v   # USDC
  blocked_dex_ids: []
  blocked_mints: []
  blocked_symbol_keywords: [test, scam, rug]
  # On-chain checks. These are the ones that actually stop rugs — keep them on.
  require_mint_authority_revoked: true
  require_freeze_authority_revoked: true
  max_top_holder_pct: 25              # excludes the AMM pool vault
  max_top10_holder_pct: 60
  # Reject when the holder distribution cannot be read at all, rather than
  # letting the token through unchecked. Free RPCs rate-limit hard: on one
  # of those this rejects a lot, which is the honest outcome — the check
  # either ran or it did not.
  require_holder_data: true
  use_rugcheck: true
  max_rugcheck_score: 40
  require_socials: false

strategy:
  min_entry_score: 60          # composite score 0-100 needed to buy
  min_price_change_m5: 1.0
  min_price_change_h1: 5.0
  max_price_change_h1: 250.0   # do not chase a vertical candle
  max_price_change_h24: 900.0
  min_buy_sell_ratio_m5: 1.0
  min_buy_sell_ratio_h1: 1.15
  # Relative weights of the score components.
  weight_momentum: 30
  weight_buy_pressure: 25
  weight_volume: 25
  weight_liquidity: 10
  weight_age: 10

exits:
  stop_loss_pct: -25.0
  max_hold_minutes: 240
  # [gain %, fraction of the ORIGINAL position to sell at that gain]
  take_profit_ladder:
    - [40.0, 0.4]
    - [100.0, 0.3]
    - [250.0, 0.2]
  trailing_activation_pct: 30.0   # arm the trailing stop once up this much
  trailing_stop_pct: 18.0         # then exit on this drawdown from the peak
  max_liquidity_drop_pct: 45.0    # liquidity being pulled -> emergency exit
  volume_collapse_pct: 85.0       # momentum gone -> exit
  volume_collapse_grace_minutes: 45

engine:
  poll_interval_s: 20          # how often open positions are re-checked
  discovery_interval_s: 60     # how often new candidates are scanned
  max_candidates_per_scan: 40
  discovery_queries: [SOL, USDC]

# Trading on measured frequencies instead of the hand-set weights above.
#
# `record` is independent of `enabled`: recording is what builds the dataset,
# so it runs from day one, while `enabled` stays off until there is a fitted
# model worth trusting. Workflow:
#
#   1. run the bot in paper mode for days   (it records every candidate)
#   2. memebot dataset                      (what is the base rate?)
#   3. memebot fit                          (does anything generalise?)
#   4. memebot backtest --test-only         (would the rule have paid?)
#   5. set enabled: true, back to paper mode
probability:
  record: true
  retention_days: 30.0

  enabled: false
  model_path: data/model.json

  # The question the model answers. These must match the exit rules above, or
  # the bot refuses to start: a model fitted on "+40% before -25% within 4h"
  # says nothing useful about a bot that sells at +30% and stops out at -35%.
  take_profit_pct: 40.0        # = first take_profit_ladder rung
  stop_loss_pct: -25.0         # = exits.stop_loss_pct
  horizon_minutes: 240.0       # = exits.max_hold_minutes
  max_gap_minutes: 15.0        # a longer break means the horizon is uncovered

  # A trade needs BOTH: enough probability to be worth the slot, and a
  # positive expectation once costs are paid.
  min_probability: 0.0
  min_expected_value_pct: 0.0
  round_trip_cost_pct: 3.0     # fees + slippage + priority fee, per round trip

  # Refuse a model that has not earned the right to trade. 0.5 AUC is a coin
  # flip; trading on a model that learnt nothing is worse than the heuristic,
  # because it looks principled.
  min_test_auc: 0.55
  min_train_rows: 500
  allow_target_mismatch: false
